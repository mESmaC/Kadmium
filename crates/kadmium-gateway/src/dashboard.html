<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kadmium — Distributed Compute Control Room</title>
  <link rel="icon" href="/assets/Logos/kadmium-favicon.svg">
  <link rel="stylesheet" href="/tokens.css">
  <link rel="stylesheet" href="/components/bundle.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; overflow-x: hidden; }
    body {
      background: var(--graphite-0);
      color: var(--ink);
      font-family: var(--font-sans);
      min-height: 100vh;
    }
    .top {
      display: flex;
      align-items: center;
      gap: var(--space-3);
      min-height: 60px;
      padding: var(--space-2) clamp(16px, 3vw, 40px);
      border-bottom: 1px solid var(--line);
      background: color-mix(in srgb, var(--graphite-1) 92%, transparent);
      backdrop-filter: blur(12px);
      flex-wrap: wrap;
      position: sticky;
      top: 0;
      z-index: 20;
    }
    .top img { height: 24px; display: block; }
    .top .cd {
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 0.08em;
      color: var(--ink-muted);
      text-transform: uppercase;
    }
    .top .spacer { flex: 1; }
    .page {
      max-width: 1440px;
      margin: 0 auto;
      padding: var(--space-8) clamp(16px, 3.5vw, 48px) var(--space-16);
      display: grid;
      gap: var(--space-8);
    }
    .page > *, .hero > *, .two > * {
      min-width: 0;
    }
    .hero {
      display: grid;
      grid-template-columns: 1.1fr 1fr;
      gap: var(--space-8);
      align-items: center;
    }
    .hero h1 { margin: 0 0 var(--space-3); }
    .hero p { margin: 0 0 var(--space-5); color: var(--ink-muted); max-width: 58ch; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--ink-muted);
      margin: 0 0 var(--space-2);
    }
    .panel {
      background: var(--graphite-1);
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      padding: var(--space-5);
      box-shadow: var(--shadow-sm);
      min-width: 0;
    }
    .stat-strip {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: var(--space-4);
    }
    .stat-card {
      background: var(--graphite-1);
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      padding: var(--space-4) var(--space-5);
      box-shadow: var(--shadow-sm);
      display: grid;
      gap: var(--space-1);
      min-width: 0;
    }
    .stat-card .metric {
      font-variant-numeric: tabular-nums;
    }
    .stat-card .meta {
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--ink-muted);
    }
    .two {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: var(--space-5);
    }
    .plans {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: var(--space-5);
      align-items: stretch;
    }
    .table-wrap {
      width: 100%;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }
    .mono-table {
      width: 100%;
      min-width: 600px;
      border-collapse: collapse;
      font-family: var(--font-mono);
      font-size: 12px;
      line-height: 18px;
      font-variant-numeric: tabular-nums;
    }
    .mono-table th {
      text-align: left;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--ink-muted);
      background: var(--graphite-2);
      padding: var(--space-2) var(--space-3);
      border-bottom: 1px solid var(--line);
      white-space: nowrap;
    }
    .mono-table td {
      padding: var(--space-2) var(--space-3);
      border-bottom: 1px solid var(--line);
      color: var(--ink);
    }
    .mono-table tr:last-child td {
      border-bottom: 0;
    }
    .shift-bar {
      background: var(--graphite-1);
      border: 1px solid var(--line-strong);
      border-radius: var(--radius-md);
      padding: var(--space-4);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-4);
      flex-wrap: wrap;
    }
    @media (max-width: 1040px) {
      .hero, .two { grid-template-columns: 1fr; }
      .plans { grid-template-columns: 1fr; }
      .stat-strip { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 560px) {
      .stat-strip { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
<div id="app"></div>

<script src="/components/lib/react.production.min.js"></script>
<script src="/components/lib/react-dom.production.min.js"></script>
<script src="/components/bundle.js"></script>
<script>
(function () {
  var K = window.Kadmium, h = React.createElement;

  function shortNodeLabel(id) {
    if (id.indexOf('main-gaming') >= 0) return 'pc';
    if (id.indexOf('mac-mini') >= 0) return 'mac';
    if (id.indexOf('gaming-laptop') >= 0) return 'lap-1';
    if (id.indexOf('friend-remote') >= 0) return 'wan';
    if (id.indexOf('legacy-thinkpad') >= 0) return 'old';
    if (id.indexOf('rk3588') >= 0) return 'sbc';
    if (id.indexOf('home-nas') >= 0) return 'nas';
    if (id.indexOf('cloud-burst') >= 0) return 'h100';
    return id.slice(0, 6);
  }

  function mapNodeKind(node) {
    var id = node.id;
    if (id.indexOf('cloud') >= 0) return 'gpu';
    if (id.indexOf('mac-mini') >= 0) return 'compact';
    if (id.indexOf('laptop') >= 0 || id.indexOf('thinkpad') >= 0) return 'laptop';
    if (id.indexOf('sbc') >= 0) return 'sbc';
    if (id.indexOf('nas') >= 0) return 'nas';
    return 'desktop';
  }

  function mapNodePlacement(node) {
    return node.id.indexOf('cloud') >= 0 ? 'cloud' : 'local';
  }

  function mapNodeStatus(node, assignment) {
    if (node.polite_state === 'GamingOrHeavyApp' || node.polite_state === 'OnBatteryPowerSaver') return 'yielded';
    if (node.id.indexOf('cloud') >= 0) return 'prefetching';
    if (assignment && assignment.layer_count > 0) return 'resident';
    return 'resident';
  }

  function formatHardwareLine(node) {
    var mem = node.memory;
    var q = node.vram_bandwidth_gbps + node.ram_bandwidth_gbps > 0
      ? (node.ram_bandwidth_gbps / (node.vram_bandwidth_gbps + node.ram_bandwidth_gbps)).toFixed(2)
      : '0.00';
    if (mem.unified_memory && mem.vram_gb > 0) {
      return 'm4 pro · ' + mem.vram_gb + ' gb unified · q* ' + q;
    }
    if (mem.vram_gb > 0) {
      return node.compute_backend.toLowerCase() + ' · ' + mem.vram_gb + ' gb vram · nvme ' + mem.nvme_read_bw_gbps + ' gb/s';
    }
    return node.cpu_cores + ' cores · ' + mem.system_ram_gb + ' gb ram · nvme ' + mem.nvme_read_bw_gbps + ' gb/s';
  }

  function buildNodeMeters(node, assignment) {
    var m = node.memory;
    var tm = assignment && assignment.tiered_memory ? assignment.tiered_memory : null;
    var meters = [];
    if (m.unified_memory && m.vram_gb > 0) {
      meters.push({ label: 'UMA', value: tm ? tm.hot_vram_or_unified_gb : Math.round(m.vram_gb * 0.45), max: m.vram_gb, unit: 'GB' });
    } else if (m.vram_gb > 0) {
      var vramVal = node.polite_state === 'GamingOrHeavyApp' ? Math.round(m.vram_gb * 0.12 * 10) / 10 : (tm ? tm.hot_vram_or_unified_gb : Math.round(m.vram_gb * 0.6));
      meters.push({ label: 'VRAM', value: vramVal, max: m.vram_gb, unit: 'GB', criticalAt: 0.95 });
      meters.push({ label: 'RAM', value: tm ? tm.warm_system_ram_gb : Math.round(m.system_ram_gb * 0.35), max: m.system_ram_gb, unit: 'GB' });
    } else {
      meters.push({ label: 'RAM', value: tm ? tm.warm_system_ram_gb : Math.round(m.system_ram_gb * 0.35), max: m.system_ram_gb, unit: 'GB' });
    }
    meters.push({ label: 'NVMe', value: tm ? tm.cold_nvme_stream_gb : Math.min(m.nvme_cache_gb, 48), max: m.nvme_cache_gb, unit: 'GB' });
    return meters;
  }

  function buildShardRailNodes(nodes, plan) {
    var totalLayers = plan.total_layers || 61;
    var ordered = nodes.slice().sort(function (a, b) {
      var ac = a.id.indexOf('cloud') >= 0 ? 1 : 0;
      var bc = b.id.indexOf('cloud') >= 0 ? 1 : 0;
      return ac - bc;
    });
    return ordered.map(function (n) {
      var a = (plan.assignments || []).find(function (x) { return x.node_id.0 === n.id.0 || x.node_id === n.id.0 || x.hostname === n.hostname; });
      var share = a ? a.layer_count / totalLayers : 0;
      return {
        id: n.hostname,
        name: shortNodeLabel(n.hostname),
        share: share,
        placement: mapNodePlacement(n)
      };
    });
  }

  function App() {
    var themeState = React.useState('dark'), theme = themeState[0], setTheme = themeState[1];
    var tabState = React.useState('nodes'), tab = tabState[0], setTab = tabState[1];
    var overviewState = React.useState(null), overview = overviewState[0], setOverview = overviewState[1];
    var slicesState = React.useState(null), slices = slicesState[0], setSlices = slicesState[1];
    var dataflowState = React.useState(null), dataflow = dataflowState[0], setDataflow = dataflowState[1];
    var dreamState = React.useState(null), dream = dreamState[0], setDream = dreamState[1];
    var cloudState = React.useState(null), cloud = cloudState[0], setCloud = cloudState[1];
    var probeState = React.useState(null), probe = probeState[0], setProbe = probeState[1];
    var companionState = React.useState(null), companion = companionState[0], setCompanion = companionState[1];
    var integrationsState = React.useState(null), integrations = integrationsState[0], setIntegrations = integrationsState[1];
    var mcpManifestState = React.useState(null), mcpManifest = mcpManifestState[0], setMcpManifest = mcpManifestState[1];
    var mcpReplyState = React.useState(null), mcpReply = mcpReplyState[0], setMcpReply = mcpReplyState[1];
    var gatewayReplyState = React.useState(null), gatewayReply = gatewayReplyState[0], setGatewayReply = gatewayReplyState[1];
    var gaState = React.useState(null), ga = gaState[0], setGa = gaState[1];
    var kernelsState = React.useState(null), kernels = kernelsState[0], setKernels = kernelsState[1];
    var workersState = React.useState(null), workersOverview = workersState[0], setWorkersOverview = workersState[1];
    var liveInfState = React.useState(null), liveInfReply = liveInfState[0], setLiveInfReply = liveInfState[1];
    var liveTrainState = React.useState(null), liveTrainReply = liveTrainState[0], setLiveTrainReply = liveTrainState[1];
    var otaState = React.useState(null), otaStatus = otaState[0], setOtaStatus = otaState[1];
    var promptState = React.useState('Verify multi-node TCP WireFrame pipeline and SkipPipe routing across local + online hardware.'), promptInput = promptState[0], setPromptInput = promptState[1];
    var otaVerState = React.useState('v0.2.0-cd48'), otaVerInput = otaVerState[0], setOtaVerInput = otaVerState[1];
    var fts3State = React.useState(null), fts3Reply = fts3State[0], setFts3Reply = fts3State[1];
    var ckptState = React.useState(null), ckptReply = ckptState[0], setCkptReply = ckptState[1];

    function refreshWorkersAndOverview() {
      fetch('/api/v1/cluster/workers').then(function (r) { return r.json(); }).then(setWorkersOverview);
      fetch('/api/v1/cluster/overview').then(function (r) { return r.json(); }).then(setOverview);
      fetch('/api/v1/update/status').then(function (r) { return r.json(); }).then(setOtaStatus);
    }

    React.useEffect(function () {
      document.documentElement.setAttribute('data-theme', theme);
    }, [theme]);

    React.useEffect(function () {
      fetch('/api/v1/cluster/overview').then(function (r) { return r.json(); }).then(setOverview);
      fetch('/api/v1/cluster/workers').then(function (r) { return r.json(); }).then(setWorkersOverview);
      fetch('/api/v1/update/status').then(function (r) { return r.json(); }).then(setOtaStatus);
      fetch('/api/v1/slices').then(function (r) { return r.json(); }).then(setSlices);
      fetch('/api/v1/dataflow').then(function (r) { return r.json(); }).then(setDataflow);
      fetch('/api/v1/rl/dream-rsi').then(function (r) { return r.json(); }).then(setDream);
      fetch('/api/v1/cloud-shield').then(function (r) { return r.json(); }).then(setCloud);
      fetch('/api/v1/host/probe').then(function (r) { return r.json(); }).then(setProbe);
      fetch('/api/v1/companion/status').then(function (r) { return r.json(); }).then(setCompanion);
      fetch('/api/v1/integrations').then(function (r) { return r.json(); }).then(setIntegrations);
      fetch('/api/v1/mcp').then(function (r) { return r.json(); }).then(setMcpManifest);
      fetch('/api/v1/ga/governance').then(function (r) { return r.json(); }).then(setGa);
      fetch('/api/v1/runtime/kernels').then(function (r) { return r.json(); }).then(setKernels);
    }, []);

    function triggerScenario(scenario) {
      fetch('/api/v1/cluster/shift', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ scenario: scenario })
      }).then(function (r) { return r.json(); }).then(setOverview);
    }

    function toggleCompanionMode(targetCloud) {
      var payload = targetCloud
        ? {
            KadmiumCloudManaged: {
              workspace_slug: 'cameron-lab',
              cloud_endpoint: 'https://api.kadmium.ai',
              downtime_shield_enabled: true,
              spot_arbitrage_burst_enabled: true,
              max_hourly_spend_cap_usd: 2.50
            }
          }
        : {
            SelfHostedOpenSource: {
              local_coordinator_url: 'http://127.0.0.1:7848'
            }
          };
      fetch('/api/v1/companion/mode', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      }).then(function (r) { return r.json(); }).then(setCompanion);
    }

    function testGatewayInference() {
      fetch('/v1/chat/completions', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          model: 'deepseek-v3-671b-moe',
          messages: [{ role: 'user', content: 'Verify asymmetric pipeline route across the local mesh.' }]
        })
      }).then(function (r) { return r.json(); }).then(setGatewayReply);
    }

    function invokeMcpTool(toolName, args) {
      fetch('/mcp', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          jsonrpc: '2.0',
          id: Date.now(),
          method: 'tools/call',
          params: { name: toolName, arguments: args || {} }
        })
      }).then(function (r) { return r.json(); }).then(setMcpReply);
    }

    function toggleLiveOnlyMode(liveOnly) {
      fetch('/api/v1/cluster/mode', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ live_only: liveOnly })
      }).then(function (r) { return r.json(); }).then(function (data) {
        setWorkersOverview(data);
        fetch('/api/v1/cluster/overview').then(function (r) { return r.json(); }).then(setOverview);
      });
    }

    function spawnLocalTestFleet() {
      fetch('/api/v1/cluster/spawn-local-fleet', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' }
      }).then(function (r) { return r.json(); }).then(function (data) {
        setWorkersOverview(data);
        refreshWorkersAndOverview();
      });
    }

    function triggerWorkerFault(nodeId, action) {
      fetch('/api/v1/cluster/worker-fault', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ node_id: nodeId, action: action })
      }).then(function (r) { return r.json(); }).then(function (data) {
        setWorkersOverview(data);
        fetch('/api/v1/cluster/overview').then(function (r) { return r.json(); }).then(setOverview);
      });
    }

    function pushOtaUpdate(targetVersion, payloadKind, targetScope) {
      fetch('/api/v1/update/push', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          target_version: targetVersion,
          payload_kind: payloadKind,
          target_scope: targetScope,
          rolling_canary: true,
          release_notes: 'Control Room OTA push (' + payloadKind + ' -> ' + targetScope + ')'
        })
      }).then(function (r) { return r.json(); }).then(function (data) {
        setOtaStatus(data);
        refreshWorkersAndOverview();
      });
    }

    function runLiveMultiNodeInference() {
      fetch('/api/v1/pipeline/live', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          prompt: promptInput,
          max_tokens: 16
        })
      }).then(function (r) { return r.json(); }).then(function (data) {
        setLiveInfReply(data);
        refreshWorkersAndOverview();
      });
    }

    function runLiveDistributedTrainingStep() {
      fetch('/api/v1/training/step', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ learning_rate: 0.001 })
      }).then(function (r) { return r.json(); }).then(function (data) {
        setLiveTrainReply(data);
        refreshWorkersAndOverview();
      });
    }

    function runLiveFts3ShardStream() {
      fetch('/api/v1/fts3/stream', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' }
      }).then(function (r) { return r.json(); }).then(function (data) {
        setFts3Reply(data);
        refreshWorkersAndOverview();
      });
    }

    function exportKtbCheckpoint() {
      fetch('/api/v1/training/checkpoint', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' }
      }).then(function (r) { return r.json(); }).then(function (data) {
        setCkptReply(data);
        refreshWorkersAndOverview();
      });
    }

    var wordmark = theme === 'dark' ? '/assets/Logos/kadmium-wordmark-dark.svg' : '/assets/Logos/kadmium-wordmark-light.svg';

    if (!overview) {
      return h('div', { className: 'page' }, h('p', { className: 'code' }, 'Loading Kadmium control room...'));
    }

    var nodes = overview.nodes || [];
    var infPlan = overview.inference_plan;
    var trainPlan = overview.training_plan;
    var railNodes = buildShardRailNodes(nodes, infPlan);
    var trainRailNodes = buildShardRailNodes(nodes, trainPlan);
    var isCloudCompanion = companion && companion.mode && companion.mode.KadmiumCloudManaged;
    var hasCloudNode = nodes.some(function (n) { return n.hostname.indexOf('cloud') >= 0; });

    return h(React.Fragment, null,
      h('header', { className: 'top' },
        h('img', { src: wordmark, alt: 'Kadmium' }),
        h('span', { className: 'cd' }, 'Cd‑48'),
        h(K.Badge, { tone: 'ok', dot: true }, 'leader ' + overview.coordinator_quorum.active_leader + ' · term ' + overview.coordinator_quorum.term),
        h(K.Badge, { tone: isCloudCompanion || hasCloudNode ? 'cloud' : 'local' }, isCloudCompanion ? 'kadmium cloud' : 'self-hosted'),
        h('span', { className: 'spacer' }),
        h(K.Button, { variant: 'ghost', size: 'sm', onClick: function () { window.location.href = '/site'; } }, 'Site'),
        h(K.Button, { variant: 'ghost', size: 'sm', onClick: function () { window.location.href = '/companion'; } }, 'Companion'),
        h(K.Button, { variant: 'ghost', size: 'sm', onClick: function () { window.location.href = '/docs'; } }, 'Docs'),
        h(K.Button, { variant: 'ghost', size: 'sm', onClick: function () { window.location.href = '/design-system'; } }, 'Design system'),
        h(K.Button, { variant: 'ghost', size: 'sm', onClick: function () { setTheme(theme === 'dark' ? 'light' : 'dark'); } }, theme === 'dark' ? 'Light theme' : 'Dark theme'),
        h(K.Button, { variant: 'quiet', size: 'sm', onClick: function () { triggerScenario('gaming_mode'); } }, 'Yield desktop'),
        h(K.Button, { variant: 'cloud', size: 'sm', icon: 'cloud', onClick: function () { triggerScenario('cloud_burst'); } }, 'Attach burst GPU'),
        h(K.Button, { variant: 'ghost', size: 'sm', onClick: function () { triggerScenario('reset'); } }, 'Reset')),

      h('main', { className: 'page' },
        h('div', { className: 'hero' },
          h('div', null,
            h('p', { className: 'eyebrow' }, 'Control room · epoch ' + infPlan.epoch + ' · ' + infPlan.model_id),
            h('h1', { className: 'display' }, 'Every machine you own, as one reactor.'),
            h('p', { className: 'body-lg' }, 'Kadmium profiles each node’s FLOPs, 5-tier memory envelope and link speed, compiles 64 KiB page-aligned .ktb banks on the NAS, and rebalances shards in under 200 ms when your gaming desktop yields or a burst GPU joins.'),
            h('div', { className: 'kd-row' },
              h(K.Button, { variant: 'primary', size: 'lg', icon: 'rods', onClick: function () { setTab('shards'); } }, 'Inspect shard plan'),
              h(K.Button, { size: 'lg', onClick: function () { window.location.href = '/docs'; } }, 'Read the docs'),
              h(K.Button, { variant: 'cloud', size: 'lg', icon: 'cloud', onClick: function () { triggerScenario('cloud_burst'); } }, 'Attach burst GPU'))),
          h('div', { className: 'panel' },
            h('p', { className: 'eyebrow' }, 'Asymmetric shard rail · ' + infPlan.model_id + ' · ' + infPlan.total_layers + ' layers'),
            h(K.ShardRail, {
              label: 'Shard plan for ' + infPlan.model_id,
              depth: 112,
              pitch: 56,
              nodes: railNodes
            }))),

        overview.last_shift ? h('div', { className: 'shift-bar' },
          h('div', null,
            h('p', { className: 'eyebrow' }, 'Live responsibility shift · epoch ' + overview.last_shift.new_plan.epoch),
            h('div', { className: 'code' }, overview.last_shift.summary_note)),
          h('div', { className: 'kd-row' },
            h(K.Badge, { tone: 'warn', dot: true }, overview.last_shift.estimated_handoff_latency_ms + ' ms boundary handoff'),
            h(K.Badge, { tone: 'ok' }, overview.fts3_transfers.length + ' fts3 p2p streams'))) : null,

        h('div', { className: 'stat-strip' },
          h('div', { className: 'stat-card' },
            h('span', { className: 'label' }, 'INFERENCE THROUGHPUT'),
            h('span', { className: 'metric' }, infPlan.estimated_throughput + ' tok/s'),
            h('span', { className: 'meta' }, infPlan.total_layers + ' layers · 256 routed experts')),
          h('div', { className: 'stat-card' },
            h('span', { className: 'label' }, 'DILOCO + DEMO SYNC'),
            h('span', { className: 'metric' }, overview.training_telemetry.demo_compression_ratio + '×'),
            h('span', { className: 'meta' }, 'pipeline bubble ' + overview.training_telemetry.pipeline_bubble_Ratio_pct + ' %')),
