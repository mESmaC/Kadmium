<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kadmium — Control Room</title>
  <link rel="icon" href="/assets/Logos/kadmium-favicon.svg">
  <link rel="stylesheet" href="/tokens.css">
  <link rel="stylesheet" href="/components/bundle.css">
  <style>
    /* ============================================================
       Kadmium Control Room — app shell
       Every colour, length and face comes from tokens.css. Prefix: cr-
       ============================================================ */
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; }
    body { background: var(--graphite-0); color: var(--ink); font-family: var(--font-sans); min-height: 100vh; -webkit-font-smoothing: antialiased; }
    :root { --cr-side: 240px; --cr-top: 56px; }
    a { color: var(--cadmium-text); }
    button { font-family: inherit; }
    ::selection { background: var(--cadmium-soft); color: var(--cadmium-text); }

    .cr { display: grid; grid-template-columns: var(--cr-side) minmax(0, 1fr); min-height: 100vh; }

    /* ---- sidebar ---- */
    .cr-side { position: sticky; top: 0; height: 100vh; background: var(--graphite-1); border-right: 1px solid var(--line); display: flex; flex-direction: column; overflow: hidden; }
    .cr-brand { height: var(--cr-top); flex: none; display: flex; align-items: center; gap: var(--space-2); padding: 0 var(--space-4); border-bottom: 1px solid var(--line); }
    .cr-brand img { height: 22px; display: block; }
    .cr-brand .cd { font-family: var(--font-mono); font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-faint); margin-left: 2px; }
    .cr-nav { padding: var(--space-2) var(--space-2) var(--space-3); display: grid; gap: 1px; align-content: start; overflow: auto; flex: 1; }
    .cr-nav-group { font-family: var(--font-mono); font-size: 10px; font-weight: 500; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-faint); padding: 14px 10px 4px; }
    .cr-nav a { display: flex; align-items: center; gap: 10px; height: 34px; padding: 0 10px; border-radius: var(--radius-sm); color: var(--ink-muted); text-decoration: none; font-size: 14px; font-weight: 500; white-space: nowrap; }
    .cr-nav a:hover { background: var(--graphite-2); color: var(--ink); }
    .cr-nav a:focus-visible { outline: none; box-shadow: var(--focus-ring); }
    .cr-nav a.active { background: var(--cadmium-soft); color: var(--cadmium-text); font-weight: 600; }
    .cr-nav a svg { width: 18px; height: 18px; flex: none; }
    .cr-nav a .count { margin-left: auto; font-family: var(--font-mono); font-size: 11px; color: var(--ink-faint); }
    .cr-nav a.active .count { color: var(--cadmium-text); }
    .cr-side-foot { flex: none; padding: var(--space-3); border-top: 1px solid var(--line); display: grid; gap: var(--space-2); }
    .cr-cluster { display: grid; gap: 2px; padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--graphite-0); }
    .cr-cluster .n { font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 6px; }
    .cr-cluster .m { font-family: var(--font-mono); font-size: 11px; color: var(--ink-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .cr-dot { width: 7px; height: 7px; border-radius: var(--radius-full); background: var(--ok); flex: none; }
    .cr-dot.warn { background: var(--warn); } .cr-dot.danger { background: var(--danger); } .cr-dot.cloud { background: var(--cherenkov); }
    .cr-side-links { display: flex; flex-wrap: wrap; gap: 2px 10px; font-family: var(--font-mono); font-size: 11px; }
    .cr-side-links a { color: var(--ink-muted); text-decoration: none; }
    .cr-side-links a:hover { color: var(--ink); }

    /* ---- main ---- */
    .cr-main { min-width: 0; display: flex; flex-direction: column; }
    .cr-top { position: sticky; top: 0; z-index: 10; height: var(--cr-top); flex: none; display: flex; align-items: center; gap: var(--space-3); padding: 0 var(--space-6); background: color-mix(in srgb, var(--graphite-0) 90%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
    .cr-top h1 { margin: 0; font-size: 17px; font-weight: 600; letter-spacing: -0.01em; white-space: nowrap; }
    .cr-top .crumb { font-family: var(--font-mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-faint); }
    .cr-top .status { display: flex; gap: var(--space-2); align-items: center; flex-wrap: wrap; margin-left: var(--space-2); }
    .cr-top .actions { margin-left: auto; display: flex; gap: var(--space-2); align-items: center; flex: none; }
    .cr-menu { display: none; }
    .cr-content { padding: var(--space-6); display: grid; gap: var(--space-5); align-content: start; width: 100%; max-width: 1480px; }
    .cr-content > * { min-width: 0; }

    /* ---- building blocks ---- */
    .cr-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: var(--space-4); }
    .cr-stat { background: var(--graphite-1); border: 1px solid var(--line); border-radius: var(--radius-md); padding: 14px 16px 12px; display: grid; gap: 4px; min-width: 0; box-shadow: var(--shadow-sm); }
    .cr-stat .l { font-family: var(--font-mono); font-size: 11px; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-muted); display: flex; align-items: center; gap: 6px; }
    .cr-stat .v { font-family: var(--font-mono); font-size: 26px; line-height: 30px; font-weight: 500; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .cr-stat .v.txt { font-size: 19px; line-height: 30px; font-family: var(--font-sans); font-weight: 600; letter-spacing: -0.01em; }
    .cr-stat .v small { font-size: 13px; color: var(--ink-muted); letter-spacing: 0; margin-left: 4px; }
    .cr-stat .m { font-family: var(--font-mono); font-size: 11.5px; line-height: 16px; color: var(--ink-muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .cr-stat.cloud .v { color: var(--cherenkov-text); }
    .cr-stat.cadmium .v { color: var(--cadmium-text); }
    .cr-stat.danger .v { color: var(--danger); }

    .cr-panel { background: var(--graphite-1); border: 1px solid var(--line); border-radius: var(--radius-md); box-shadow: var(--shadow-sm); min-width: 0; display: flex; flex-direction: column; }
    .cr-panel-head { display: flex; align-items: center; gap: var(--space-3); padding: 12px 16px; border-bottom: 1px solid var(--line); min-height: 48px; flex-wrap: wrap; }
    .cr-panel-head h2 { margin: 0; font-size: 15px; font-weight: 600; letter-spacing: -0.005em; white-space: nowrap; }
    .cr-panel-head .sub { font-family: var(--font-mono); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .cr-panel-head .tools { margin-left: auto; display: flex; gap: var(--space-2); align-items: center; flex-wrap: wrap; }
    .cr-panel-body { padding: 16px; display: grid; gap: var(--space-3); min-width: 0; }
    .cr-panel-body > * { min-width: 0; }
    .cr-panel-body.flush { padding: 0; }
    .cr-panel-foot { padding: 10px 16px; border-top: 1px solid var(--line); font-family: var(--font-mono); font-size: 11.5px; color: var(--ink-muted); display: flex; gap: var(--space-3); flex-wrap: wrap; }

    .cr-two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--space-5); }
    .cr-three { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--space-5); }
    .cr-main-aside { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(300px, 1fr); gap: var(--space-5); }
    .cr-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: var(--space-4); }
    .cr-grid .kd-node { cursor: pointer; transition: border-color .12s ease; }
    .cr-grid .kd-node:hover { border-color: var(--line-strong); }
    .cr-grid .kd-node.selected { border-color: var(--cadmium-text); }

    .cr-tablewrap { overflow: auto; }
    .cr-table { width: 100%; border-collapse: collapse; font-family: var(--font-mono); font-size: 12px; }
    .cr-table th { text-align: left; font-size: 10.5px; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-muted); padding: 9px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; background: var(--graphite-1); position: sticky; top: 0; }
    .cr-table td { padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; white-space: nowrap; color: var(--ink); }
    .cr-table tbody tr:last-child td { border-bottom: 0; }
    .cr-table tbody tr:hover td { background: var(--graphite-2); }
    .cr-table td.num, .cr-table th.num { text-align: right; font-variant-numeric: tabular-nums; }
    .cr-table td.muted { color: var(--ink-muted); }
    .cr-table td.wrap { white-space: normal; min-width: 240px; }
    .cr-table .sans { font-family: var(--font-sans); font-size: 13px; }
    .cr-table tr.clickable { cursor: pointer; }

    .cr-kv { display: grid; grid-template-columns: max-content 1fr; gap: 6px 16px; margin: 0; font-family: var(--font-mono); font-size: 12px; align-items: baseline; }
    .cr-kv dt { color: var(--ink-muted); font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; }
    .cr-kv dd { margin: 0; color: var(--ink); word-break: break-word; }

    .cr-seg { display: inline-flex; gap: 2px; padding: 2px; background: var(--graphite-2); border-radius: var(--radius-sm); }
    .cr-seg button { -webkit-appearance: none; appearance: none; border: 0; background: transparent; color: var(--ink-muted); font: inherit; font-size: 12.5px; font-weight: 500; height: 26px; padding: 0 10px; border-radius: 4px; cursor: pointer; white-space: nowrap; }
    .cr-seg button:hover { color: var(--ink); }
    .cr-seg button.active { background: var(--graphite-1); color: var(--ink); box-shadow: var(--shadow-sm); }
    .cr-seg button:focus-visible { outline: none; box-shadow: var(--focus-ring); }

    .cr-empty { padding: 28px 16px; text-align: center; color: var(--ink-muted); font-size: 14px; display: grid; gap: var(--space-3); justify-items: center; }
    .cr-empty .code { color: var(--ink-faint); }
    .cr-muted { color: var(--ink-muted); }
    .cr-prose { font-size: 14px; line-height: 21px; color: var(--ink-muted); margin: 0; max-width: 70ch; }
    .cr-prose b { color: var(--ink); font-weight: 600; }
    .cr-rowwrap { display: flex; flex-wrap: wrap; gap: var(--space-2); align-items: center; }
    .cr-textarea { width: 100%; min-height: 96px; resize: vertical; border: 1px solid var(--line-strong); border-radius: var(--radius-sm); background: var(--graphite-0); color: var(--ink); font-family: var(--font-sans); font-size: 14px; line-height: 20px; padding: 10px 12px; outline: none; }
    .cr-textarea:focus-visible { border-color: var(--cadmium-text); box-shadow: var(--focus-ring); }
    .cr-select { height: var(--control-md); border: 1px solid var(--line-strong); border-radius: var(--radius-sm); background: var(--graphite-0); color: var(--ink); font-family: var(--font-mono); font-size: 13px; padding: 0 10px; outline: none; }
    .cr-select:focus-visible { border-color: var(--cadmium-text); box-shadow: var(--focus-ring); }
    .cr-reply { font-family: var(--font-sans); font-size: 15px; line-height: 23px; padding: 14px 16px; border-radius: var(--radius-md); background: var(--graphite-0); border: 1px solid var(--line); white-space: pre-wrap; }
    .cr-timeline { display: grid; gap: 0; min-width: 0; }
    .cr-tl > div { min-width: 0; }
    .cr-tl .t, .cr-tl .m { overflow-wrap: anywhere; }
    .cr-tl { display: grid; grid-template-columns: 16px 1fr; gap: 12px; padding: 8px 0; position: relative; }
    .cr-tl::before { content: ""; position: absolute; left: 7px; top: 24px; bottom: -8px; width: 2px; background: var(--line); }
    .cr-tl:last-child::before { display: none; }
    .cr-tl .pip { width: 16px; height: 16px; border-radius: var(--radius-full); border: 2px solid var(--line-strong); background: var(--graphite-1); margin-top: 1px; }
    .cr-tl .pip.ok { border-color: var(--ok); } .cr-tl .pip.cloud { border-color: var(--cherenkov); } .cr-tl .pip.warn { border-color: var(--warn); } .cr-tl .pip.danger { border-color: var(--danger); } .cr-tl .pip.cadmium { border-color: var(--cadmium); }
    .cr-tl .t { font-size: 13.5px; line-height: 19px; }
    .cr-tl .m { font-family: var(--font-mono); font-size: 11px; color: var(--ink-muted); margin-top: 2px; }
    .cr-progress { height: 8px; border-radius: var(--radius-xs); background: var(--graphite-3); overflow: hidden; }
    .cr-progress i { display: block; height: 100%; background: var(--cadmium); border-radius: var(--radius-xs); box-shadow: inset 0 0 0 1px var(--cadmium-edge); transition: width .3s ease; }
    .cr-modelcard { border: 1px solid var(--line); border-radius: var(--radius-md); padding: 12px 14px; display: grid; gap: 6px; cursor: pointer; background: var(--graphite-0); }
    .cr-modelcard:hover { border-color: var(--line-strong); }
    .cr-modelcard.active { border-color: var(--cadmium-text); background: var(--cadmium-soft); }
    .cr-modelcard .n { font-size: 14px; font-weight: 600; }
    .cr-modelcard .m { font-family: var(--font-mono); font-size: 11px; color: var(--ink-muted); }
    .cr-chip { display: inline-flex; align-items: center; gap: 6px; font-family: var(--font-mono); font-size: 11.5px; color: var(--ink-muted); }

    /* ---- drawer ---- */
    .cr-scrim { position: fixed; inset: 0; background: color-mix(in srgb, var(--graphite-0) 60%, transparent); z-index: 25; }
    .cr-drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(460px, 100vw); background: var(--graphite-1); border-left: 1px solid var(--line); box-shadow: var(--shadow-lg); z-index: 30; display: flex; flex-direction: column; }
    .cr-drawer-head { display: flex; align-items: flex-start; gap: var(--space-3); padding: 16px; border-bottom: 1px solid var(--line); }
    .cr-drawer-head h2 { margin: 0; font-size: 17px; font-weight: 600; letter-spacing: -0.01em; }
    .cr-drawer-head .hw { font-family: var(--font-mono); font-size: 12px; color: var(--ink-muted); margin-top: 3px; }
    .cr-drawer-body { padding: 16px; overflow: auto; display: grid; gap: var(--space-4); align-content: start; }
    .cr-drawer h3 { margin: 0; font-family: var(--font-mono); font-size: 11px; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-muted); }

    /* ---- toasts ---- */
    .cr-toasts { position: fixed; right: 20px; bottom: 20px; display: grid; gap: 8px; z-index: 40; max-width: min(420px, calc(100vw - 40px)); }
    .cr-toast { background: var(--graphite-1); box-shadow: var(--shadow-lg); border-radius: var(--radius-md); padding: 10px 14px; display: flex; gap: 12px; align-items: center; font-size: 13.5px; line-height: 19px; }
    .cr-toast .rod { width: 3px; height: 20px; border-radius: var(--radius-full); background: var(--cadmium); flex: none; }
    .cr-toast.ok .rod { background: var(--ok); } .cr-toast.danger .rod { background: var(--danger); } .cr-toast.cloud .rod { background: var(--cherenkov); } .cr-toast.warn .rod { background: var(--warn); }
    .cr-toast .m { font-family: var(--font-mono); font-size: 11px; color: var(--ink-muted); }

    /* ---- charts ---- */
    .cr-gantt text, .cr-spark text, .cr-shield text { font-family: var(--font-mono); font-size: 10.5px; fill: var(--ink-muted); }
    .cr-gantt .fwd { fill: var(--cadmium); } .cr-gantt .bwd { fill: var(--tier-warm); } .cr-gantt .lane { stroke: var(--line); }
    .cr-spark .line { fill: none; stroke: var(--cadmium); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .cr-spark .area { fill: var(--cadmium-soft); }
    .cr-spark .dot { fill: var(--cadmium); }
    .cr-spark .grid { stroke: var(--line); }
    .cr-shield .step { fill: var(--graphite-3); } .cr-shield .step.local { fill: var(--cadmium); } .cr-shield .step.cloud { fill: var(--cherenkov); } .cr-shield .step.warn { fill: var(--warn); }
    .cr-loading { padding: 48px; text-align: center; font-family: var(--font-mono); font-size: 12px; color: var(--ink-muted); }

    /* ---- responsive ---- */
    @media (max-width: 1180px) {
      .cr-three { grid-template-columns: 1fr 1fr; }
      .cr-main-aside { grid-template-columns: 1fr; }
    }
    @media (max-width: 1000px) {
      :root { --cr-side: 64px; }
      .cr-brand .cd, .cr-nav a span, .cr-nav-group, .cr-side-foot, .cr-nav a .count { display: none; }
      .cr-brand { justify-content: center; padding: 0; }
      .cr-brand img { display: none; }
      .cr-brand .mark { display: block; }
      .cr-nav a { justify-content: center; padding: 0; }
      .cr-two, .cr-three { grid-template-columns: 1fr; }
    }
    @media (min-width: 1001px) { .cr-brand .mark { display: none; } }
    @media (max-width: 720px) {
      .cr { grid-template-columns: 1fr; }
      .cr-side { position: fixed; left: 0; top: 0; bottom: 0; width: 240px; z-index: 35; transform: translateX(-100%); transition: transform .18s ease; }
      .cr-side.open { transform: none; }
      :root { --cr-side: 240px; }
      .cr-brand .cd, .cr-nav a span, .cr-nav-group, .cr-side-foot, .cr-nav a .count { display: initial; }
      .cr-brand img { display: block; } .cr-brand .mark { display: none; } .cr-brand { justify-content: flex-start; padding: 0 var(--space-4); }
      .cr-nav a { justify-content: flex-start; padding: 0 10px; }
      .cr-nav a .count { display: inline; }
      .cr-menu { display: inline-flex; }
      .cr-top { padding: 0 var(--space-4); }
      .cr-top .status { display: none; }
      .cr-top .actions > *:not(:last-child) { display: none; }
      .cr-top h1 { font-size: 15px; }
      .cr-content { padding: var(--space-4); }
      .cr-stats { grid-template-columns: 1fr 1fr; }
      .cr-stat .v { font-size: 22px; }
    }
  </style>
</head>
<body>
<div id="app"></div>
<script src="/components/lib/react.production.min.js"></script>
<script src="/components/lib/react-dom.production.min.js"></script>
<script src="/components/bundle.js"></script>
<script>
/* ============================================================
   Kadmium Control Room — core: data layer, routing, shell, helpers
   ============================================================ */
(function () {
  'use strict';
  const K = window.Kadmium, h = React.createElement, F = React.Fragment;
  const { useState, useEffect, useRef, useMemo, useCallback } = React;

  /* ---------- formatting ---------- */
  const fmt = {
    num(n, d) { if (n === null || n === undefined || isNaN(n)) return '—'; const v = Number(n); return d === undefined ? (Number.isInteger(v) ? v.toLocaleString() : v.toLocaleString(undefined, { maximumFractionDigits: 2 })) : v.toLocaleString(undefined, { minimumFractionDigits: d, maximumFractionDigits: d }); },
    gb(n) { return n >= 1024 ? fmt.num(n / 1024, 1) + ' TB' : fmt.num(n, n < 10 ? 1 : 0) + ' GB'; },
    pct(n, d) { return fmt.num(n, d === undefined ? 1 : d) + ' %'; },
    ms(n) { return fmt.num(n, n < 10 ? 2 : 0) + ' ms'; },
    usd(n, d) { return '$' + fmt.num(n, d === undefined ? 2 : d); },
    hex(n, len) { try { return '0x' + BigInt(n).toString(16).slice(0, len || 10); } catch (e) { return '0x' + Number(n || 0).toString(16).slice(0, len || 10); } },
    enumName(v) { if (v === null || v === undefined) return '—'; if (typeof v === 'string') return v; if (typeof v === 'object') return Object.keys(v)[0]; return String(v); },
    words(s) { return String(s || '').replace(/([a-z0-9])([A-Z])/g, '$1 $2').replace(/_/g, ' ').toLowerCase().replace('pipeline1 f1 b', '1F1B pipeline').replace('static weight bank ktb', '.ktb weight bank').replace('diloco', 'DiLoCo').replace('demo', 'DeMo'); },
    ago(d) { const s = Math.max(0, (Date.now() - d) / 1000); if (s < 5) return 'just now'; if (s < 60) return Math.round(s) + 's ago'; if (s < 3600) return Math.round(s / 60) + 'm ago'; return Math.round(s / 3600) + 'h ago'; }
  };

  /* ---------- node helpers (the fabric's own vocabulary) ---------- */
  const KIND_BY_DEVICE = { DesktopWorkstation: 'desktop', AppleSiliconMac: 'compact', GamingLaptop: 'laptop', LegacyLaptop: 'laptop', LinuxSbc: 'sbc', HomeNas: 'nas', CloudBurstGpu: 'gpu', CloudBurst: 'gpu' };
  function nodeKind(node) { return KIND_BY_DEVICE[node.device_kind] || (isCloudNode(node) ? 'gpu' : 'desktop'); }
  function isCloudNode(node) { return String(node.device_kind || '').indexOf('Cloud') >= 0 || String(node.id || '').indexOf('cloud') >= 0 || (node.roles || []).indexOf('BurstAccelerator') >= 0; }
  function nodePlacement(node) { return isCloudNode(node) ? 'cloud' : 'local'; }
  function nodeStatus(node, assignment, worker) {
    if (worker && worker.online === false) return 'offline';
    const ps = node.polite_state;
    if (ps === 'GamingOrHeavyApp') return 'yielded';
    if (ps === 'BatteryOrThermalThrottle') return 'throttled';
    if (isCloudNode(node) && !(assignment && assignment.layer_count > 0)) return 'prefetching';
    return 'resident';
  }
  function shortLabel(hostname) {
    const id = String(hostname || '');
    if (/main|rig|desktop/i.test(id)) return 'pc';
    if (/m4|apple|mac|ipad/i.test(id)) return 'm4';
    if (/cm4|reterminal|turing|uconsole|waveshare/i.test(id)) return 'cm4';
    if (/switch|tegra|mariko|erista|jetson|shield/i.test(id)) return 'tegra';
    if (/phone-farm|sd8/i.test(id)) return 'farm';
    if (/zephyrus/i.test(id)) return 'lap-1';
    if (/legion/i.test(id)) return 'lap-2';
    if (/thinkpad/i.test(id)) return 'old';
    if (/k230/i.test(id)) return 'k230';
    if (/rk3588|sbc/i.test(id)) return 'sbc';
