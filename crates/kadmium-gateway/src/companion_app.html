<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kadmium Desktop Application — Cd‑48</title>
  <link rel="icon" href="/assets/Logos/kadmium-favicon.svg">
  <link rel="stylesheet" href="/tokens.css">
  <link rel="stylesheet" href="/components/bundle.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; overflow-x: hidden; }
    body {
      background: var(--graphite-0);
      color: var(--ink);
      font-family: var(--font-sans);
      min-height: 100vh;
    }
    .top {
      display: flex;
      align-items: center;
      gap: var(--space-3);
      min-height: 60px;
      padding: var(--space-2) clamp(16px, 3vw, 40px);
      border-bottom: 1px solid var(--line);
      background: color-mix(in srgb, var(--graphite-1) 92%, transparent);
      backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 20;
      flex-wrap: wrap;
    }
    .top img { height: 24px; display: block; }
    .top .cd {
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 0.08em;
      color: var(--ink-muted);
      text-transform: uppercase;
    }
    .top .spacer { flex: 1; }
    .shell {
      max-width: 1280px;
      margin: 0 auto;
      padding: var(--space-6) clamp(16px, 3.5vw, 40px) var(--space-16);
      display: grid;
      gap: var(--space-5);
    }
    .shell > *, .two > *, .three > * {
      min-width: 0;
    }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--ink-muted);
      margin: 0 0 var(--space-2);
    }
    .panel {
      background: var(--graphite-1);
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      padding: var(--space-5);
      box-shadow: var(--shadow-sm);
      min-width: 0;
    }
    .two {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: var(--space-5);
      align-items: stretch;
    }
    .three {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: var(--space-4);
    }
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(195px, 1fr));
      gap: var(--space-4);
    }
    .stat-card {
      background: var(--graphite-1);
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      padding: 14px 16px;
      display: grid;
      gap: 4px;
    }
    .stat-card .l {
      font-family: var(--font-mono);
      font-size: 10.5px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--ink-muted);
    }
    .stat-card .v {
      font-family: var(--font-mono);
      font-size: 23px;
      font-weight: 600;
      color: var(--ink);
    }
    .stat-card .v.cadmium { color: var(--cadmium-text); }
    .stat-card .v.ok { color: var(--ok); }
    .stat-card .v.cloud { color: var(--cherenkov-text); }
    .stat-card .m {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--ink-muted);
    }
    .mode-card {
      background: var(--graphite-2);
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      padding: var(--space-5);
      display: flex;
      flex-direction: column;
      gap: var(--space-3);
      min-width: 0;
    }
    .mode-card .kd-btn {
      margin-top: auto;
    }
    .mode-card.active-local {
      border-color: var(--cadmium-edge);
    }
    .mode-card.active-cloud {
      border-color: var(--cherenkov);
    }
    .table-wrap {
      width: 100%;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }
    .mono-table {
      width: 100%;
      min-width: 560px;
      border-collapse: collapse;
      font-family: var(--font-mono);
      font-size: 12px;
      line-height: 18px;
      font-variant-numeric: tabular-nums;
    }
    .mono-table th {
      text-align: left;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--ink-muted);
      background: var(--graphite-2);
      padding: var(--space-2) var(--space-3);
      border-bottom: 1px solid var(--line);
      white-space: nowrap;
    }
    .mono-table td {
      padding: var(--space-2) var(--space-3);
      border-bottom: 1px solid var(--line);
      color: var(--ink);
    }
    .toast-bar {
      position: fixed;
      right: 20px;
      bottom: 20px;
      z-index: 50;
      background: var(--graphite-1);
      border: 1px solid var(--cadmium-edge);
      border-radius: var(--radius-md);
      padding: 10px 16px;
      box-shadow: var(--shadow-lg);
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--ink);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .toast-bar .dot {
      width: 8px;
      height: 8px;
      border-radius: 99px;
      background: var(--cadmium);
    }
    .select-box {
      height: var(--control-md);
      border: 1px solid var(--line-strong);
      border-radius: var(--radius-sm);
      background: var(--graphite-0);
      color: var(--ink);
      font-family: var(--font-mono);
      font-size: 12.5px;
      padding: 0 10px;
    }
    @media (max-width: 900px) {
      .two, .three { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
<div id="app"></div>

<script src="/components/lib/react.production.min.js"></script>
<script src="/components/lib/react-dom.production.min.js"></script>
<script src="/components/bundle.js"></script>
<script>
(function () {
  var K = window.Kadmium, h = React.createElement;

  function hex(n) {
    try { return '0x' + BigInt(n || 0).toString(16).slice(0, 12); }
    catch (e) { return '0x' + Number(n || 0).toString(16).slice(0, 12); }
  }

  function CompanionApp() {
    var themeState = React.useState('dark'), theme = themeState[0], setTheme = themeState[1];
    var tabState = React.useState('host'), tab = tabState[0], setTab = tabState[1];
    var toastState = React.useState(null), toastMsg = toastState[0], setToastMsg = toastState[1];

    var statusState = React.useState(null), status = statusState[0], setStatus = statusState[1];
    var probeState = React.useState(null), probe = probeState[0], setProbe = probeState[1];
    var platformsState = React.useState(null), platforms = platformsState[0], setPlatforms = platformsState[1];
    var deepM4State = React.useState(null), deepM4 = deepM4State[0], setDeepM4 = deepM4State[1];
    var execState = React.useState(null), execReport = execState[0], setExecReport = execState[1];
    var supplyState = React.useState(null), supply = supplyState[0], setSupply = supplyState[1];
    var pairingState = React.useState(null), pairing = pairingState[0], setPairing = pairingState[1];
    var watcherState = React.useState(null), watcher = watcherState[0], setWatcher = watcherState[1];

    var workspaceState = React.useState('cameron-lab'), workspace = workspaceState[0], setWorkspace = workspaceState[1];
    var budgetState = React.useState('2.50'), budget = budgetState[0], setBudget = budgetState[1];

    // Studio state (.ktb import, EXL3 quantizer, KV migration, FTS3 stream)
    var impModelState = React.useState('qwen2.5-coder-32b-instruct'), impModel = impModelState[0], setImpModel = impModelState[1];
    var impFormatState = React.useState('gguf'), impFormat = impFormatState[0], setImpFormat = impFormatState[1];
    var impResultState = React.useState(null), impResult = impResultState[0], setImpResult = impResultState[1];
    var exlModelState = React.useState('deepseek-v3-671b-exl3-2.5bpw'), exlModel = exlModelState[0], setExlModel = exlModelState[1];
    var exlBpwState = React.useState('2.55'), exlBpw = exlBpwState[0], setExlBpw = exlBpwState[1];
    var exlResultState = React.useState(null), exlResult = exlResultState[0], setExlResult = exlResultState[1];
    var kvMigState = React.useState(null), kvMig = kvMigState[0], setKvMig = kvMigState[1];
    var ftsStreamState = React.useState(null), ftsStream = ftsStreamState[0], setFtsStream = ftsStreamState[1];
    var busyState = React.useState(false), busy = busyState[0], setBusy = busyState[1];

    function notify(msg) {
      setToastMsg(msg);
      setTimeout(function () { setToastMsg(null); }, 4200);
    }

    function refreshAll() {
      fetch('/api/v1/companion/status').then(function (r) { return r.json(); }).then(setStatus);
      fetch('/api/v1/host/probe').then(function (r) { return r.json(); }).then(setProbe);
      fetch('/api/v1/platforms/overview').then(function (r) { return r.json(); }).then(function (d) {
        setPlatforms(d);
        if (d && d.apple_m4_deep_metal4) setDeepM4(d.apple_m4_deep_metal4);
      });
      fetch('/api/v1/supply/marketplace').then(function (r) { return r.json(); }).then(setSupply);
      fetch('/api/v1/companion/pairing').then(function (r) { return r.json(); }).then(setPairing);
      fetch('/api/v1/cloud-shield/watcher').then(function (r) { return r.json(); }).then(setWatcher);
    }

    function runLivePipelinePass() {
      setBusy(true);
      fetch('/api/v1/pipeline/execute-live').then(function (r) { return r.json(); }).then(function (d) {
        if (d && d.execution) setExecReport(d.execution);
        notify('Executed live TCP pipeline across ' + ((d && d.live_hops && d.live_hops.length) || 1) + ' stage(s) · ' + (d && d.execution ? d.execution.effective_tokens_per_sec.toFixed(1) + ' tok/s' : 'done'));
      }).finally(function () { setBusy(false); });
    }

    React.useEffect(function () {
      document.documentElement.setAttribute('data-theme', theme);
    }, [theme]);

    React.useEffect(function () {
      refreshAll();
    }, []);

    function approveLanPeer(candidateId, newStatus) {
      if (!pairing) return;
      var nextCandidates = pairing.lan_candidates.map(function (c) {
        if (c.candidate_id !== candidateId) return c;
        return Object.assign({}, c, { status: newStatus });
      });
      setPairing(Object.assign({}, pairing, { lan_candidates: nextCandidates }));
      notify('LAN peer ' + candidateId + ' approved as ' + newStatus);
    }

    function updateSupplyPolicy(nextEnabled, nextHours, nextPayoutCredits) {
      if (!supply) return;
      var updated = Object.assign({}, supply.policy, {
        enabled: nextEnabled,
        daily_lease_hours: nextHours,
        payout_mode: nextPayoutCredits
          ? { KadmiumCloudCredits: { bonus_multiplier: 1.25 } }
          : 'UsdDirectPayout'
      });
      fetch('/api/v1/supply/configure', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(updated)
      }).then(function (r) { return r.json(); }).then(function (d) {
        setSupply(d);
        notify('Reactor Supply Grid policy updated (' + (nextEnabled ? nextHours + 'h/day active' : 'paused') + ')');
      });
    }

    function switchMode(useCloud) {
      var payload = useCloud
        ? {
            KadmiumCloudManaged: {
              workspace_slug: workspace || 'cameron-lab',
              cloud_endpoint: 'https://api.kadmium.ai',
              downtime_shield_enabled: true,
              spot_arbitrage_burst_enabled: true,
              max_hourly_spend_cap_usd: parseFloat(budget) || 2.50
            }
          }
        : {
            SelfHostedOpenSource: {
              local_coordinator_url: 'http://127.0.0.1:7848'
            }
          };
      fetch('/api/v1/companion/mode', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      }).then(function (r) { return r.json(); }).then(function (d) {
        setStatus(d);
        notify(useCloud ? 'Linked to Kadmium Cloud (' + workspace + ')' : 'Switched to 100% Self-Hosted Open-Source mode ($0.00/hr)');
      });
    }

    function setHostPoliteMode(scenario) {
      fetch('/api/v1/cluster/shift', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ scenario: scenario })
      }).then(function () {
        fetch('/api/v1/companion/status').then(function (r) { return r.json(); }).then(setStatus);
        fetch('/api/v1/pipeline/execute').then(function (r) { return r.json(); }).then(setExecReport);
        notify(scenario === 'gaming_mode' ? 'Polite Governor: Host yielded to 15% (<200ms swapchain hook) — shards shifted to Mac mini' : 'Polite Governor: Restored 100% Dedicated Idle capacity');
      });
    }

    function triggerKvMigrate() {
      setBusy(true);
      fetch('/api/v1/kv-cache/migrate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ session_id: 'companion-polite-yield-01', start_layer: 0, end_layer: 15 })
      }).then(function (r) { return r.json(); }).then(function (d) {
        setKvMig(d);
        notify('Migrated ' + d.pages_migrated + ' KV-cache pages (' + d.tokens_preserved + ' tokens) over TCP in ' + d.total_migration_wall_ms.toFixed(2) + ' ms');
      }).finally(function () { setBusy(false); });
    }

    function attachPlatform(family, skuSlug, label) {
      setBusy(true);
      fetch('/api/v1/platforms/attach', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ family: family, sku_slug: skuSlug || undefined, run_deep_bench: family === 'apple-m4' && !skuSlug })
      }).then(function (r) { return r.json(); }).then(function (d) {
        if (d.apple_m4_deep_metal4) setDeepM4(d.apple_m4_deep_metal4);
        fetch('/api/v1/companion/status').then(function (r) { return r.json(); }).then(setStatus);
        fetch('/api/v1/pipeline/execute').then(function (r) { return r.json(); }).then(setExecReport);
        fetch('/api/v1/supply/marketplace').then(function (r) { return r.json(); }).then(setSupply);
        notify('Attached ' + (label || (d.attached_hostnames && d.attached_hostnames.join(', ')) || family) + (d.live_silicon_verified ? ' (LIVE SILICON VERIFIED)' : ''));
      }).finally(function () { setBusy(false); });
    }

    function runM4DeepSuite() {
      setBusy(true);
      fetch('/api/v1/m4-mac-mini/deep-suite', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ iterations: 8, seq_len: 256 })
      }).then(function (r) { return r.json(); }).then(function (d) {
        if (d.deep_metal4_suite) {
          setDeepM4(d.deep_metal4_suite);
          notify('Apple M4 Deep Metal 4 Suite: 1024×1024 GEMM ' + d.deep_metal4_suite.tiled_gemm1024_gflops.toFixed(1) + ' GFLOP/s · 10-Core GCD ' + d.deep_metal4_suite.gcd_10core_speedup.toFixed(2) + '×');
        } else {
          notify('Apple M4 probed (' + d.probe.lan_endpoint + ')');
        }
      }).finally(function () { setBusy(false); });
    }

    function runImportKtb() {
      setBusy(true);
      fetch('/api/v1/models/import', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ model_id: impModel, format_hint: impFormat, start_layer: 0, end_layer: 3 })
      }).then(function (r) { return r.json(); }).then(function (d) {
        setImpResult(d);
        notify('Compiled 64 KiB page-aligned .ktb bank: ' + d.compiled_ktb_path + ' (Merkle ' + hex(d.merkle_root_fnv64) + ')');
      }).finally(function () { setBusy(false); });
    }

    function runExl3Quantize() {
      setBusy(true);
      fetch('/api/v1/models/exl3-convert', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ model_id: exlModel, target_bpw: parseFloat(exlBpw) || 2.55 })
      }).then(function (r) { return r.json(); }).then(function (d) {
        setExlResult(d);
        notify('EXL3 / QTIP Trellis Quantization complete: +' + d.snr_gain_over_scalar_db.toFixed(2) + ' dB SNR gain · -' + d.vram_savings_vs_q4k_gb.toFixed(1) + ' GB vs Q4_K');
      }).finally(function () { setBusy(false); });
    }

    function runFts3Stream() {
      setBusy(true);
      fetch('/api/v1/fts3/stream', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({})
      }).then(function (r) { return r.json(); }).then(function (d) {
        setFtsStream(d);
        notify('Streamed ' + d.shard_name + ' (' + (d.ktb_total_bytes / 1024).toFixed(0) + ' KiB) at ' + d.aggregate_goodput_mbps.toFixed(0) + ' Mbps');
      }).finally(function () { setBusy(false); });
    }

    var wordmark = theme === 'dark' ? '/assets/Logos/kadmium-wordmark-dark.svg' : '/assets/Logos/kadmium-wordmark-light.svg';
    var isCloud = status && status.mode && status.mode.KadmiumCloudManaged;
    var m4 = platforms && platforms.apple_m4_probe;
    var cm4 = platforms && platforms.rpi_cm4_probe;
    var k230 = platforms && platforms.kendryte_k230_probe;

    return h(React.Fragment, null,
      h('header', { className: 'top' },
        h('img', { src: wordmark, alt: 'Kadmium' }),
        h('span', { className: 'cd' }, 'Cd‑48 · Desktop App v' + (status ? status.app_version : '0.1.0')),
        status ? h(K.Badge, { tone: isCloud ? 'cloud' : 'local', dot: true }, isCloud ? 'kadmium cloud' : 'self-hosted oss') : null,
        m4 && m4.physical_board_online ? h(K.Badge, { tone: 'ok', dot: true }, 'Apple M4 Live (' + m4.lan_endpoint + ')') : null,
        h('span', { className: 'spacer' }),
        h(K.Button, { variant: 'primary', size: 'sm', onClick: function () { attachPlatform('all-live', null, 'All Live LAN/USB Silicon'); } }, 'Auto-Attach Live Silicon'),
        h(K.Button, { variant: 'quiet', size: 'sm', disabled: busy, onClick: runLivePipelinePass }, 'Run Live TCP Pass'),
        h(K.Button, { variant: 'ghost', size: 'sm', onClick: function () { window.location.href = '/'; } }, 'Control room'),
        h(K.Button, { variant: 'ghost', size: 'sm', onClick: function () { window.location.href = '/#/platforms'; } }, 'Platforms'),
        h(K.Button, { variant: 'ghost', size: 'sm', onClick: function () { window.location.href = '/docs'; } }, 'Docs'),
        h(K.Button, { variant: 'ghost', size: 'sm', onClick: function () { setTheme(theme === 'dark' ? 'light' : 'dark'); } }, theme === 'dark' ? 'Light theme' : 'Dark theme')),

      toastMsg ? h('div', { className: 'toast-bar', role: 'status' }, h('span', { className: 'dot' }), h('span', null, toastMsg)) : null,

      h('main', { className: 'shell' },
        h('div', { className: 'stats' },
          h('div', { className: 'stat-card' },
            h('span', { className: 'l' }, 'Local Host Governor'),
            h('span', { className: 'v cadmium' }, status ? (status.local_host_polite_state === 'GamingOrHeavyApp' ? 'Yielded (15%)' : 'Idle Dedicated (100%)') : 'Probing…'),
            h('span', { className: 'm' }, probe ? probe.local_node.hostname + ' · q* ' + probe.q_star_ratio : 'DXGI / IOKit < 200 ms hook')),
          h('div', { className: 'stat-card' },
            h('span', { className: 'l' }, 'Active Cluster Nodes'),
            h('span', { className: 'v' }, status ? status.active_cluster_nodes + ' nodes' : '—'),
            h('span', { className: 'm' }, 'Leader: ' + (status ? status.active_coordinator_leader : 'local'))),
          h('div', { className: 'stat-card' },
            h('span', { className: 'l' }, 'Apple M4 Metal 4 Bridge'),
            h('span', { className: 'v ' + (m4 && m4.physical_board_online ? 'ok' : '') }, m4 ? (m4.physical_board_online ? 'ONLINE · ' + m4.execution_proof.amx_sgemm_512_gflops.toFixed(0) + ' GF/s' : 'Standby') : 'Probing…'),
            h('span', { className: 'm' }, m4 ? m4.lan_endpoint + ' · ' + m4.board_model : '192.168.40.237:7860')),
          h('div', { className: 'stat-card' },
            h('span', { className: 'l' }, 'Pipeline Throughput'),
            h('span', { className: 'v ' + (execReport ? 'cadmium' : '') }, execReport ? execReport.effective_tokens_per_sec + ' tok/s' : 'Idle'),
            h('span', { className: 'm' }, execReport ? execReport.model_id + ' · ' + execReport.total_pipeline_latency_ms + ' ms total' : 'No model loaded · click Run Live TCP Pass')),
          h('div', { className: 'stat-card' },
            h('span', { className: 'l' }, 'Reactor Supply Net'),
            h('span', { className: 'v ' + (supply && supply.policy.enabled ? 'ok' : '') }, supply ? (supply.policy.enabled ? '+$' + (supply.total_net_monthly_profit_after_power_usd || 0).toFixed(0) + '/mo' : 'Paused') : '—'),
            h('span', { className: 'm' }, '75% Host · $0.14/kWh power deducted'))),

        h(K.Tabs, {
          label: 'Desktop application views',
          value: tab,
          onChange: setTab,
          items: [
            { id: 'host', label: 'Host & Polite Governor' },
            { id: 'platforms', label: 'Silicon Platforms & LAN Bridges', count: platforms ? platforms.total_catalog_skus : 26 },
            { id: 'studio', label: 'Local .ktb Studio & EXL3 Quantizer' },
            { id: 'reactor', label: 'Reactor Supply Grid' },
            { id: 'shield', label: 'CloudShield Watcher' }
          ]
        }),

        tab === 'host' ? h(React.Fragment, null,
          h('section', { className: 'panel' },
            h('p', { className: 'eyebrow' }, 'Operating mode · one binary for open-source and Kadmium Cloud'),
            h('h1', { className: 'headline', style: { margin: '0 0 var(--space-4)' } }, 'Desktop Companion Node Agent'),
            h('div', { className: 'two' },
              h('div', { className: 'mode-card ' + (!isCloud ? 'active-local' : '') },
                h('div', { className: 'kd-row' },
                  h(K.Badge, { tone: 'local', dot: !isCloud }, 'self-hosted'),
                  h('span', { className: 'code-sm', style: { marginLeft: 'auto' } }, '$0.00 / hr')),
                h('div', { className: 'title' }, 'Open-source local mesh'),
                h('p', { className: 'body', style: { color: 'var(--ink-muted)', margin: 0 } },
                  'Connects strictly to your LAN coordinator (127.0.0.1:7848) via UDP KDMD beacons. Zero cloud account required.'),
                h(K.Button, {
                  variant: !isCloud ? 'primary' : 'quiet',
                  onClick: function () { switchMode(false); }
                }, !isCloud ? 'Active: Self-hosted mode' : 'Switch to self-hosted')),

              h('div', { className: 'mode-card ' + (isCloud ? 'active-cloud' : '') },
                h('div', { className: 'kd-row' },
                  h(K.Badge, { tone: 'cloud', dot: Boolean(isCloud) }, 'kadmium cloud'),
