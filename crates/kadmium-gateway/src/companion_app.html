<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kadmium Companion</title>
  <link rel="icon" href="/assets/Logos/kadmium-favicon.svg">
  <link rel="stylesheet" href="/tokens.css">
  <link rel="stylesheet" href="/components/bundle.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    :root { --cp-ease: cubic-bezier(.2, .8, .2, 1); --cp-fast: 120ms; --cp-base: 200ms; --cp-slow: 280ms; }
    html, body, #app { height: 100%; margin: 0; }
    body {
      background: var(--graphite-0);
      color: var(--ink);
      font-family: var(--font-sans);
      font-size: 14px;
      line-height: 20px;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }
    button { font: inherit; }
    code { font-family: var(--font-mono); font-size: 12px; }
    :focus-visible { outline: none; box-shadow: var(--focus-ring); }

    /* ---------- shell: icon rail + main column ---------- */
    .cp-app { display: grid; grid-template-columns: 76px minmax(0, 1fr); height: 100vh; height: 100dvh; }
    .cp-rail {
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      padding: 14px 0 12px; background: var(--graphite-1); border-right: 1px solid var(--line);
      user-select: none; -webkit-user-select: none; min-height: 0;
    }
    .cp-rail .tile { width: 38px; height: 38px; display: block; margin: 0 0 14px; border-radius: 10px; }
    .cp-rail .grow { flex: 1; }
    .cp-nav { display: flex; flex-direction: column; gap: 2px; width: 100%; padding: 0 8px; }
    .cp-nav button {
      position: relative; display: flex; flex-direction: column; align-items: center; gap: 4px;
      padding: 9px 0 7px; border: 0; border-radius: var(--radius-sm); background: transparent;
      color: var(--ink-muted); font-size: 10.5px; line-height: 12px; font-weight: 500; cursor: pointer;
      transition: background-color var(--cp-fast) ease, color var(--cp-fast) ease;
    }
    .cp-nav button:hover { background: var(--graphite-2); color: var(--ink); }
    .cp-nav button.active { background: var(--graphite-2); color: var(--ink); }
    .cp-nav button.active svg { color: var(--cadmium-text); }
    .cp-nav button.active::before {
      content: ""; position: absolute; left: -8px; top: 10px; bottom: 10px; width: 3px;
      border-radius: 0 3px 3px 0; background: var(--cadmium);
    }
    .cp-railstate {
      display: flex; flex-direction: column; align-items: center; gap: 5px; margin-top: 10px; padding-top: 12px;
      width: 52px; border-top: 1px solid var(--line); font: 500 9.5px/11px var(--font-mono);
      letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-muted);
    }
    .cp-railstate .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); }
    .cp-railstate.yield .dot { background: var(--warn); }
    .cp-railstate.down .dot { background: var(--danger); animation: cp-pulse 1.2s ease-in-out infinite; }

    .cp-main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
    .cp-top {
      display: flex; align-items: center; gap: 12px; min-height: 64px; padding: 12px 28px;
      border-bottom: 1px solid var(--line); user-select: none; -webkit-user-select: none;
    }
    .cp-top .titles { min-width: 0; }
    .cp-top h1 { margin: 0; font-size: 18px; line-height: 24px; font-weight: 600; letter-spacing: -0.01em; }
    .cp-top h1:focus, .cp-top h1:focus-visible { outline: none; box-shadow: none; }
    .cp-top .sub { color: var(--ink-muted); font-size: 12.5px; line-height: 18px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .cp-top .spacer { flex: 1; }
    .cp-conn {
      display: inline-flex; align-items: center; gap: 7px; height: 26px; padding: 0 10px; border: 1px solid var(--line);
      border-radius: var(--radius-full); color: var(--ink-muted); font: 500 11px/1 var(--font-mono); white-space: nowrap;
    }
    .cp-conn .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); }
    .cp-conn.down { color: var(--ink); border-color: var(--danger); }
    .cp-conn.down .dot { background: var(--danger); animation: cp-pulse 1.2s ease-in-out infinite; }
    @keyframes cp-pulse { 50% { opacity: 0.35; } }

    .cp-banner {
      display: flex; align-items: center; gap: 12px; padding: 9px 28px; font-size: 13px; line-height: 18px;
      background: var(--cherenkov-soft); border-bottom: 1px solid var(--line); color: var(--ink);
    }
    .cp-banner svg { flex: none; color: var(--cherenkov-text); }
    .cp-banner code { color: var(--cherenkov-text); }
    .cp-banner .x {
      margin-left: auto; flex: none; display: grid; place-items: center; width: 26px; height: 26px; border: 0;
      border-radius: var(--radius-sm); background: transparent; color: var(--ink-muted); cursor: pointer;
    }
    .cp-banner .x:hover { background: var(--graphite-2); color: var(--ink); }
    .cp-banner.down { background: var(--danger-soft); }
    .cp-banner.down svg { color: var(--danger); }

    .cp-scroll { flex: 1; min-height: 0; overflow: auto; }
    .cp-scroll:focus, .cp-scroll:focus-visible { outline: none; box-shadow: none; }
    .cp-skip {
      position: fixed; left: 12px; top: 12px; z-index: 60; transform: translateY(-200%); padding: 8px 14px;
      border-radius: var(--radius-sm); background: var(--graphite-1); border: 1px solid var(--line-strong); color: var(--ink);
      font-size: 14px; font-weight: 600; text-decoration: none; box-shadow: var(--shadow-lg);
    }
    .cp-skip:focus { transform: none; }
    .cp-sr { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
    .cp-lede { margin: 0; max-width: 74ch; color: var(--ink-muted); font-size: 14px; line-height: 21px; }
    .cp-lede b { color: var(--ink); font-weight: 600; }
    .cp-page { display: grid; gap: 20px; max-width: 1160px; padding: 24px 28px 48px; }
    .cp-page > * { min-width: 0; }

    /* ---------- building blocks ---------- */
    .cp-card { background: var(--graphite-1); border: 1px solid var(--line); border-radius: var(--radius-md); min-width: 0; }
    .cp-card > header { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 13px 18px; border-bottom: 1px solid var(--line); }
    .cp-card > header h2 { margin: 0; font-size: 14px; line-height: 20px; font-weight: 600; }
    .cp-card > header .sub { color: var(--ink-muted); font-size: 12px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .cp-card > header .tools { margin-left: auto; display: flex; align-items: center; gap: 8px; }
    .cp-card > .body { padding: 16px 18px; display: grid; gap: 14px; }
    .cp-card > .body.flush { padding: 0; gap: 0; }
    .cp-card > footer { padding: 11px 18px; border-top: 1px solid var(--line); color: var(--ink-muted); font-size: 12px; display: flex; gap: 16px; flex-wrap: wrap; }
    .cp-pad { padding: 16px 18px; }
    .cp-subhead {
      padding: 10px 18px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); background: var(--graphite-2);
      font: 500 10.5px/14px var(--font-mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-muted);
    }
    .cp-minihead { padding-top: 4px; font: 500 10.5px/14px var(--font-mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-muted); }
    .cp-grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; align-items: start; }
    .cp-grid2.stretch { align-items: stretch; }
    .cp-tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
    .cp-tile { display: grid; gap: 3px; min-width: 0; padding: 13px 16px; background: var(--graphite-1); border: 1px solid var(--line); border-radius: var(--radius-md); }
    .cp-tile .l { font: 500 10.5px/14px var(--font-mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-muted); }
    .cp-tile .v { font-size: 19px; line-height: 26px; font-weight: 600; letter-spacing: -0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .cp-tile .v.mono { font-family: var(--font-mono); font-size: 17px; font-weight: 500; letter-spacing: 0; }
    .cp-tile .v.cadmium { color: var(--cadmium-text); }
    .cp-tile .v.ok { color: var(--ok); }
    .cp-tile .v.muted { color: var(--ink-muted); }
    .cp-tile .m { color: var(--ink-muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .cp-kv { display: grid; grid-template-columns: minmax(96px, max-content) minmax(0, 1fr); gap: 8px 18px; margin: 0; font-size: 13px; line-height: 19px; }
    .cp-kv dt { color: var(--ink-muted); }
    .cp-kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
    .cp-kv dd.mono { font-family: var(--font-mono); font-size: 12.5px; }
    .cp-meters { display: grid; gap: 12px; }

    .cp-tablewrap { width: 100%; overflow-x: auto; }
    .cp-table { width: 100%; border-collapse: collapse; font-size: 13px; line-height: 18px; }
    .cp-table th {
      padding: 9px 18px; text-align: left; white-space: nowrap; border-bottom: 1px solid var(--line);
      font: 500 10.5px/14px var(--font-mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-muted);
    }
    .cp-table td { padding: 10px 18px; border-bottom: 1px solid var(--line); vertical-align: middle; }
    .cp-table tbody tr:last-child td { border-bottom: 0; }
    .cp-table th.num { font: 500 10.5px/14px var(--font-mono); }
    .cp-table .num { text-align: right; font-family: var(--font-mono); font-size: 12.5px; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .cp-table .mono { font-family: var(--font-mono); font-size: 12px; }
    .cp-table .nowrap { white-space: nowrap; }
    .cp-table .name { font-weight: 600; }
    .cp-table .sub { display: block; margin-top: 2px; color: var(--ink-muted); font: 11.5px/16px var(--font-mono); }
    .cp-table .muted { color: var(--ink-muted); }
    .cp-table .clip { max-width: 280px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .cp-table td.empty { padding: 26px 18px; text-align: center; color: var(--ink-muted); }

    .cp-empty { display: grid; justify-items: center; gap: 12px; padding: 22px 12px; text-align: center; color: var(--ink-muted); font-size: 13px; }
    .cp-empty p { margin: 0; max-width: 46ch; }
    .cp-loading { display: flex; align-items: center; gap: 10px; padding: 40px 4px; color: var(--ink-muted); font-size: 13px; }
    .cp-loading .spin { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--line-strong); border-top-color: var(--cadmium); animation: cp-spin 0.8s linear infinite; }
    @keyframes cp-spin { to { transform: rotate(360deg); } }

    .cp-note { display: flex; gap: 10px; align-items: flex-start; padding: 11px 14px; border-radius: var(--radius-sm); background: var(--graphite-2); color: var(--ink-muted); font-size: 12.5px; line-height: 18px; }
    .cp-note svg { flex: none; margin-top: 1px; }
    .cp-note.warn { background: var(--warn-soft); color: var(--ink); }
    .cp-note.warn svg { color: var(--warn); }
    .cp-note.ok svg { color: var(--ok); }
    .cp-help { margin: 0; color: var(--ink-muted); font-size: 12.5px; line-height: 19px; }
    .cp-help code, .cp-kv code, .cp-note code { color: var(--ink); overflow-wrap: anywhere; }

    .cp-seg { display: inline-flex; gap: 2px; padding: 3px; background: var(--graphite-0); border: 1px solid var(--line); border-radius: var(--radius-sm); }
    .cp-seg button { padding: 4px 11px; border: 0; border-radius: 4px; background: transparent; color: var(--ink-muted); font-size: 12.5px; line-height: 18px; font-weight: 500; cursor: pointer; white-space: nowrap; }
    .cp-seg button:hover { color: var(--ink); }
    .cp-seg button.on { background: var(--graphite-3); color: var(--ink); }

    .cp-switch {
      position: relative; flex: none; width: 40px; height: 22px; padding: 0; border-radius: var(--radius-full);
      border: 1px solid var(--line-strong); background: var(--graphite-3); cursor: pointer; transition: background 0.15s, border-color 0.15s;
    }
    .cp-switch::after {
      content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%;
      background: var(--ink-muted); transition: transform 0.15s, background 0.15s;
    }
    .cp-switch[aria-checked="true"] { background: var(--cadmium); border-color: var(--cadmium); }
    .cp-switch[aria-checked="true"]::after { transform: translateX(18px); background: var(--on-cadmium); }
    .cp-switch:disabled { opacity: 0.5; cursor: default; }

    .cp-field { display: grid; gap: 6px; min-width: 0; }
    .cp-field > .lbl { font-size: 13px; line-height: 18px; font-weight: 500; color: var(--ink); }
    .cp-page .kd-field { min-width: 0; grid-template-columns: minmax(0, 1fr); }
    .cp-field .cp-seg, .cp-mode > .kd-badge, .cp-mode > .kd-btn { justify-self: start; }
    .cp-field > .hint { font-size: 12px; color: var(--ink-muted); }
    .cp-select, .cp-range { width: 100%; }
    .cp-select {
      height: var(--control-md); padding: 0 10px; border: 1px solid var(--line-strong); border-radius: var(--radius-sm);
      background: var(--graphite-0); color: var(--ink); font: 12.5px var(--font-mono);
    }
    .cp-range { accent-color: var(--cadmium); }
    .cp-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .cp-row.end { justify-content: flex-end; }
    .cp-formgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 16px; }
    .cp-check { display: flex; align-items: flex-start; gap: 10px; font-size: 13px; line-height: 19px; cursor: pointer; }
    .cp-check input { margin: 2px 0 0; accent-color: var(--cadmium); width: 15px; height: 15px; flex: none; }
    .cp-check small { display: block; color: var(--ink-muted); font-size: 12px; }
    .cp-textarea {
      width: 100%; min-height: 64px; resize: vertical; padding: 9px 11px; border: 1px solid var(--line-strong); border-radius: var(--radius-sm);
      background: var(--graphite-0); color: var(--ink); font: 13px/19px var(--font-sans);
    }
    .cp-output {
      margin: 0; padding: 12px 14px; border-radius: var(--radius-sm); background: var(--graphite-0); border: 1px solid var(--line);
      font: 12.5px/19px var(--font-mono); white-space: pre-wrap; overflow-wrap: anywhere; color: var(--ink);
    }
    .cp-ticket {
      padding: 10px 12px; border-radius: var(--radius-sm); background: var(--graphite-0); border: 1px solid var(--line);
      font: 11.5px/17px var(--font-mono); color: var(--ink-muted); overflow-wrap: anywhere; max-height: 74px; overflow: auto;
      user-select: all; -webkit-user-select: all;
    }
    .cp-code { font: 600 15px/20px var(--font-mono); letter-spacing: 0.08em; }

    /* ---------- home hero ---------- */
    .cp-hero {
      display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 20px; align-items: center;
      padding: 22px 24px; background: var(--graphite-1); border: 1px solid var(--line); border-radius: var(--radius-md);
      border-left: 4px solid var(--cadmium);
    }
    .cp-hero.yield { border-left-color: var(--warn); }
    .cp-hero.off { border-left-color: var(--line-strong); }
    .cp-orb { width: 64px; height: 64px; border-radius: 18px; display: grid; place-items: center; background: var(--cadmium-soft); color: var(--ink); }
    .cp-hero.yield .cp-orb { background: var(--warn-soft); color: var(--warn); }
    .cp-hero.off .cp-orb { background: var(--graphite-3); color: var(--ink-muted); }
    .cp-hero .eyebrow { font: 500 11px/16px var(--font-mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--cadmium-text); margin-bottom: 4px; }
    .cp-hero.yield .eyebrow { color: var(--warn); }
    .cp-hero.off .eyebrow { color: var(--ink-muted); }
    .cp-hero h2 { margin: 0 0 4px; font-size: 22px; line-height: 28px; font-weight: 600; letter-spacing: -0.015em; }
    .cp-hero p { margin: 0; max-width: 62ch; color: var(--ink-muted); font-size: 13.5px; line-height: 20px; }
    .cp-hero .act { display: grid; gap: 8px; justify-items: end; }
    .cp-hero .act small { color: var(--ink-muted); font-size: 11.5px; text-align: right; }

    .cp-modes { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
    .cp-mode { display: grid; gap: 10px; align-content: start; padding: 16px 18px; border: 1px solid var(--line); border-radius: var(--radius-md); background: var(--graphite-0); }
    .cp-mode.on { border-color: var(--cadmium-edge); }
    .cp-mode.on.cloud { border-color: var(--cherenkov); }
    .cp-mode h3 { margin: 0; font-size: 15px; line-height: 20px; font-weight: 600; }
    .cp-mode p { margin: 0; color: var(--ink-muted); font-size: 12.5px; line-height: 19px; }

    .cp-toasts { position: fixed; right: 20px; bottom: 20px; z-index: 50; display: grid; gap: 8px; width: min(420px, calc(100vw - 40px)); pointer-events: none; }
    .cp-toast {
      display: flex; gap: 10px; align-items: stretch; padding: 10px 14px; border-radius: var(--radius-sm);
      background: var(--graphite-2); border: 1px solid var(--line-strong); box-shadow: var(--shadow-lg); font-size: 13px; line-height: 18px;
      pointer-events: auto;
    }
    .cp-toast .bar { flex: none; width: 3px; border-radius: 2px; background: var(--ok); }

    /* ---------- next steps on Home ---------- */
    .cp-next { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
    .cp-step {
      display: grid; grid-template-columns: 34px minmax(0, 1fr) 16px; gap: 2px 12px; align-items: start; padding: 13px 14px;
      border: 1px solid var(--line); border-radius: var(--radius-md); background: var(--graphite-1); color: var(--ink);
      font: inherit; text-align: left; cursor: pointer; transition: border-color var(--cp-fast) ease, background-color var(--cp-fast) ease;
    }
    .cp-step:hover { border-color: var(--line-strong); background: var(--graphite-2); }
    .cp-step .ic { grid-row: 1 / span 2; width: 34px; height: 34px; border-radius: var(--radius-sm); display: grid; place-items: center; background: var(--cadmium-soft); color: var(--cadmium-text); }
    .cp-step .t { grid-column: 2; font-size: 14px; line-height: 20px; font-weight: 600; }
    .cp-step .d { grid-column: 2; color: var(--ink-muted); font-size: 12.5px; line-height: 18px; }
    .cp-step .go { grid-column: 3; grid-row: 1; align-self: center; color: var(--ink-muted); transition: transform var(--cp-base) var(--cp-ease), color var(--cp-fast) ease; }
    .cp-step:hover .go, .cp-step:focus-visible .go { color: var(--ink); transform: translateX(3px); }

    /* ---------- glossary terms ---------- */
    .cp-term {
      -webkit-appearance: none; appearance: none; display: inline; margin: 0; padding: 0; border: 0; background: none;
      font: inherit; color: inherit; letter-spacing: inherit; text-transform: inherit; line-height: inherit; text-align: inherit;
      cursor: help; text-decoration: underline dotted; text-decoration-thickness: 1px; text-underline-offset: 3px;
      text-decoration-color: color-mix(in srgb, currentColor 55%, transparent); border-radius: 2px;
    }
    .cp-term:hover { text-decoration-color: currentColor; }
    .cp-tip {
      position: fixed; z-index: 70; max-width: min(300px, calc(100vw - 24px)); padding: 8px 11px; border-radius: var(--radius-sm);
      background: var(--graphite-3); border: 1px solid var(--line-strong); color: var(--ink); box-shadow: var(--shadow-lg);
      font: 400 12.5px/18px var(--font-sans); letter-spacing: 0; text-transform: none;
    }
    .cp-tablewrap:focus-visible, .kd-code pre:focus-visible { outline: none; box-shadow: var(--focus-ring); }

    /* ---------- motion: short, eased, and only when the system allows it ---------- */
    @media (prefers-reduced-motion: no-preference) {
      .cp-page > * { animation: cp-rise var(--cp-slow) var(--cp-ease) both; }
      .cp-page > *:nth-child(2) { animation-delay: 40ms; }
      .cp-page > *:nth-child(3) { animation-delay: 80ms; }
      .cp-page > *:nth-child(4) { animation-delay: 120ms; }
      .cp-page > *:nth-child(n+5) { animation-delay: 160ms; }
      .cp-nav button.active::before { animation: cp-bar var(--cp-base) var(--cp-ease); }
      .cp-toast { animation: cp-toast-in var(--cp-base) var(--cp-ease) both; }
      .cp-toast.out { animation: cp-toast-out 180ms ease forwards; }
      .cp-tip, .cp-banner { animation: cp-appear var(--cp-fast) ease both; }
      .cp-railstate:not(.down) .dot { animation: cp-breathe 3s ease-in-out infinite; }
      .cp-hero.share .cp-orb { animation: cp-glow 4s ease-in-out infinite; }
    }
    @keyframes cp-rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    @keyframes cp-appear { from { opacity: 0; } to { opacity: 1; } }
    @keyframes cp-bar { from { opacity: 0; transform: scaleY(.3); } to { opacity: 1; transform: none; } }
    @keyframes cp-toast-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    @keyframes cp-toast-out { to { opacity: 0; transform: translateY(6px); } }
    @keyframes cp-breathe { 0%, 100% { opacity: 1; } 50% { opacity: .45; } }
    @keyframes cp-glow { 0%, 100% { box-shadow: 0 0 0 0 var(--cadmium-soft); } 50% { box-shadow: 0 0 0 7px var(--cadmium-soft); } }
    .cp-toast.danger .bar { background: var(--danger); }
    .cp-toast.warn .bar { background: var(--warn); }

    @media (max-width: 980px) {
      .cp-tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .cp-next { grid-template-columns: minmax(0, 1fr); }
      .cp-grid2, .cp-modes { grid-template-columns: minmax(0, 1fr); }

          h('div', { className: 'cp-formgrid' },
            h(Field, { label: 'Model' }, h(Select, { value: exlModel, onChange: setExlModel, options: models })),
            h(K.Input, { label: 'Bits per weight', mono: true, inputMode: 'decimal', value: bpw, onChange: e => setBpw(e.target.value.replace(/[^0-9.]/g, '')) })),
          h('div', { className: 'cp-row' }, h(K.Button, { disabled: busy === 'exl' || !(Number(bpw) >= 1.5 && Number(bpw) <= 8), onClick: () => run('exl', () => postJSON('/api/v1/runtime/exl3', { model_id: exlModel, target_bpw: Number(bpw) }).then(d => { setExl(d); return d; }),
            d => d.model_id + ' at ' + fixed(d.achieved_effective_bpw, 2) + ' bpw: ' + gb(d.exl3_ktb_size_gb)) }, busy === 'exl' ? 'Estimating…' : 'Estimate'),
            Number(bpw) >= 1.5 && Number(bpw) <= 8 ? null : h('span', { className: 'cp-help' }, 'Use 1.5 to 8 bits per weight.')),
          exl ? KV([
            ['Sizes', 'FP16 ' + gb(exl.original_fp16_size_gb) + ' · Q4_K ' + gb(exl.legacy_q4k_size_gb) + ' · EXL3 ' + gb(exl.exl3_ktb_size_gb), true],
            ['Saves', gb(exl.vram_savings_vs_q4k_gb) + ' against Q4_K', true],
            ['Quality', 'SNR ' + fixed(exl.exl3_viterbi_snr_db, 2) + ' dB, ' + fixed(exl.snr_gain_over_scalar_db, 2) + ' dB above scalar rounding', true],
            ['Cluster time', exl.estimated_cluster_conversion_minutes > 0 ? fixed(exl.estimated_cluster_conversion_minutes, 1) + ' min across ' + plural((exl.node_conversion_shards || []).length, 'machine') : 'no machine can take a conversion shard right now']
          ]) : null)),
      h(BoardsCard, { liveIds }));
  }
  function BoardsCard({ liveIds }) {
    const [scan, setScan] = useState(null);
    const [scanning, setScanning] = useState(false);
    const [busy, run] = useBusy();
    const [ips, setIps] = useState({ m4: '', cm4: '' });
    const rescan = () => { setScanning(true); load('/api/v1/platforms/overview').then(setScan).catch(e => toast(e.message, 'danger')).finally(() => setScanning(false)); };
    useEffect(rescan, []);
    const host = endpoint => String(endpoint || '').split(':')[0];
    const boards = scan ? [
      { key: 'm4', family: 'apple-m4', name: 'Apple M4 Mac mini', online: scan.apple_m4_probe.physical_board_online, where: scan.apple_m4_probe.lan_endpoint, model: scan.apple_m4_probe.board_model, ip: true },
      { key: 'cm4', family: 'rpi-cm4', name: 'Raspberry Pi CM4', online: scan.rpi_cm4_probe.physical_board_online, where: scan.rpi_cm4_probe.lan_endpoint, model: scan.rpi_cm4_probe.board_model, ip: true },
      { key: 'k230', family: 'kendryte-k230', name: 'Kendryte K230 (USB)', online: scan.kendryte_k230_probe.physical_board_detected, where: scan.kendryte_k230_probe.detected_serial_port || 'USB', model: scan.kendryte_k230_probe.board_model },
      { key: 'tegra', family: 'tegra-x1', name: 'NVIDIA Tegra X1', online: null, where: '—', model: scan.tegra_x1_active_spec ? scan.tegra_x1_active_spec.display_name : 'Tegra X1 profile' }
    ] : [];
    const attach = b => run('attach:' + b.key, () => postJSON('/api/v1/platforms/attach', { family: b.family, custom_ip: b.ip && ips[b.key].trim() ? ips[b.key].trim() : undefined, run_deep_bench: b.family === 'apple-m4' }),
      d => (d.live_silicon_verified ? 'Attached ' : 'Added an emulated node for ') + ((d.attached_hostnames || []).join(', ') || b.name), CORE);
    return h(Card, { title: 'Boards and bridges', sub: scan ? scan.total_catalog_skus + ' supported boards across ' + scan.total_platform_families + ' families' : 'Looking for boards…', flush: true,
      tools: h(K.Button, { size: 'sm', variant: 'ghost', icon: Icon('refresh', 16), disabled: scanning, onClick: rescan }, scanning ? 'Scanning…' : 'Scan again') },
      scan ? Table({
        wide: true,
        rows: boards,
        rowKey: b => b.key,
        cols: [
          { label: 'Board', render: b => h(F, null, h('span', { className: 'name' }, b.name), h('span', { className: 'sub', title: b.model }, b.model.length > 64 ? b.model.slice(0, 63) + '…' : b.model)) },
          { label: 'Found', className: 'nowrap', render: b => b.online == null ? h(K.Badge, { tone: 'neutral' }, 'no probe') : b.online ? h(K.Badge, { tone: 'ok', dot: true }, 'online') : h(K.Badge, { tone: 'neutral', dot: true }, 'not found') },
          { label: 'Address', className: 'nowrap', render: b => b.ip
            ? h('input', { className: 'cp-select', style: { width: '150px' }, 'aria-label': b.name + ' address', placeholder: host(b.where), value: ips[b.key], onChange: e => setIps(Object.assign({}, ips, { [b.key]: e.target.value })) })
            : h('span', { className: 'mono muted' }, b.where) },
          { label: '', sr: 'Attach', num: true, render: b => h(K.Button, { size: 'sm', disabled: busy === 'attach:' + b.key, onClick: () => attach(b) }, b.online ? 'Attach' : b.ip && ips[b.key].trim() ? 'Probe and attach' : 'Add emulated') }
        ]
      }) : h('div', { className: 'cp-pad' }, Loading('Probing the LAN and USB for boards…')),
      scan ? h('div', { className: 'cp-pad' }, h('p', { className: 'cp-help' }, 'Kadmium looks for each board at its usual address. Type another address to probe a different one. ',
        '“Add emulated” adds a node with that board’s published profile when no board answers, so you can plan around hardware you have not plugged in yet.')) : null);
  }

  /* ---------- Settings ---------- */
  function SettingsPage({ core, theme, setTheme }) {
    const { status, workers } = core;
    const [busy, run] = useBusy();
    const cloud = status && status.mode && status.mode.KadmiumCloudManaged;
    const [slug, setSlug] = useState(cloud ? cloud.workspace_slug : '');
    const [cap, setCap] = useState(cloud ? String(cloud.max_hourly_spend_cap_usd) : '2.50');
    const linkedSlug = cloud ? cloud.workspace_slug : null;
    const linkedCap = cloud ? cloud.max_hourly_spend_cap_usd : null;
    useEffect(() => { if (linkedSlug) { setSlug(linkedSlug); setCap(String(linkedCap)); } }, [linkedSlug, linkedCap]);
    if (!status) return Loading('Reading settings…');
    const slugOk = /^[a-z0-9][a-z0-9-]{1,38}$/.test(slug.trim());
    const capOk = Number(cap) > 0 && Number(cap) <= 1000;
    const selfUrl = (workers && workers.coordinator_http_url) || location.origin;
    const setMode = payload => run('mode', () => postJSON('/api/v1/companion/mode', payload).then(d => { publish('/api/v1/companion/status', d); return d; }),
      payload.KadmiumCloudManaged ? 'Linked to the Kadmium Cloud workspace ' + payload.KadmiumCloudManaged.workspace_slug : 'Self-hosted: no Kadmium Cloud connection');
    const link = () => setMode({ KadmiumCloudManaged: { workspace_slug: slug.trim(), cloud_endpoint: 'https://api.kadmium.ai', downtime_shield_enabled: true, spot_arbitrage_burst_enabled: true, max_hourly_spend_cap_usd: Number(cap) } });
    return h(F, null,
      h(Card, { title: 'Connection', sub: cloud ? 'Kadmium Cloud · ' + cloud.workspace_slug : 'Self-hosted' },
        h('div', { className: 'cp-modes' },
          h('div', { className: 'cp-mode' + (cloud ? '' : ' on') },
            h('div', { className: 'cp-row' }, h(K.Badge, { tone: 'local', dot: !cloud }, 'Self-hosted'), h('span', { className: 'mono muted', style: { marginLeft: 'auto', fontSize: '12px' } }, '$0 / hr')),
            h('h3', null, 'Your machines only'),
            h('p', null, 'This machine works with the coordinator on your network at ', h('code', null, selfUrl), '. No account and no Kadmium Cloud traffic. Free to self-host, MIT or Apache-2.0.'),
            cloud ? h(K.Button, { disabled: busy === 'mode', onClick: () => setMode({ SelfHostedOpenSource: { local_coordinator_url: selfUrl } }) }, 'Use self-hosted') : h(K.Badge, { tone: 'ok' }, 'in use')),
          h('div', { className: 'cp-mode cloud' + (cloud ? ' on' : '') },
            h('div', { className: 'cp-row' }, h(K.Badge, { tone: 'cloud', dot: !!cloud }, 'Kadmium Cloud')),
            h('h3', null, 'Add the managed plane'),
            h('p', null, 'Adds WAN relay between sites, a failover vault that takes your shards if a machine drops, and burst GPUs up to your spend cap.'),
            h('div', { className: 'cp-formgrid' },
              h(K.Input, { label: 'Workspace', mono: true, placeholder: 'your-workspace', value: slug, error: slug && !slugOk ? 'Lowercase letters, digits and dashes' : undefined, onChange: e => setSlug(e.target.value.toLowerCase()) }),
              h(K.Input, { label: 'Spend cap per hour', mono: true, prefix: '$', inputMode: 'decimal', value: cap, error: capOk ? undefined : 'Enter an amount above $0', onChange: e => setCap(e.target.value.replace(/[^0-9.]/g, '')) })),
            h(K.Button, { variant: 'cloud', icon: 'cloud', disabled: busy === 'mode' || !slugOk || !capOk, onClick: link }, cloud ? 'Update workspace' : 'Link workspace')))),
      h('div', { className: 'cp-grid2' },
        h(Card, { title: 'Appearance' },
          h(Field, { label: 'Theme' }, h(Seg, { label: 'Theme', value: theme, onChange: setTheme, items: [{ id: 'dark', label: 'Dark' }, { id: 'light', label: 'Light' }, { id: 'system', label: 'Match system' }] })),
          h('p', { className: 'cp-help' }, 'Press ', h('code', null, (desktop && desktop.platform === 'macos') || /Mac/.test(navigator.platform) ? '⌘1–⌘6' : 'Ctrl+1–6'), ' to switch pages.')),
        h(Card, { title: 'About' },
          KV([
            ['Kadmium', status.app_version, true],
            ['Desktop app', desktop ? 'kadmium-desktop ' + desktop.version + ' · ' + desktop.platform : 'not in use: this is a browser tab'],
            ['Coordinator', location.origin, true],
            ['Leader', status.active_coordinator_leader, true]
          ]),
          h('div', { className: 'cp-row' },
            h(K.Button, { size: 'sm', icon: Icon('external', 16), onClick: () => openControlRoom('') }, 'Control Room'),
            h(K.Button, { size: 'sm', variant: 'ghost', icon: Icon('external', 16), onClick: () => openExternal('/docs') }, 'Documentation'),
            h(K.Button, { size: 'sm', variant: 'ghost', icon: Icon('external', 16), onClick: () => openExternal('/metrics') }, 'Metrics')))));
  }

  /* ---------- app ---------- */
  function App() {
    const page = useRoute();
    const up = useConn();
    const [status] = useData('/api/v1/companion/status', 4000);
    const [overview] = useData('/api/v1/cluster/overview', 4000);
    const [workers] = useData('/api/v1/cluster/workers', 5000);
    const [probe] = useData('/api/v1/host/probe', 20000);
    const [theme, setThemeState] = useState(readTheme);
    const scrollRef = useRef(null);
    const setTheme = t => { setThemeState(t); try { localStorage.setItem(THEME_KEY, t); } catch (e) { /* private mode */ } };
    useEffect(() => {
      applyTheme(theme);
      if (theme !== 'system' || !window.matchMedia) return undefined;
      const mq = window.matchMedia('(prefers-color-scheme: light)');
      const fn = () => applyTheme('system');
      if (mq.addEventListener) mq.addEventListener('change', fn); else mq.addListener(fn);
      return () => { if (mq.removeEventListener) mq.removeEventListener('change', fn); else mq.removeListener(fn); };
    }, [theme]);
    useEffect(() => {
      const onKey = e => {
        if ((e.ctrlKey || e.metaKey) && !e.altKey && !e.shiftKey && /^[1-6]$/.test(e.key)) { e.preventDefault(); go(PAGES[Number(e.key) - 1].id); }
      };
      window.addEventListener('keydown', onKey);
      return () => window.removeEventListener('keydown', onKey);
    }, []);
    const first = useRef(true);
    useEffect(() => {
      if (scrollRef.current) scrollRef.current.scrollTop = 0;
      document.title = (PAGES.find(p => p.id === page) || PAGES[0]).title + ' · Kadmium Companion';
      if (first.current) { first.current = false; return; }
      const t = document.getElementById('cp-page-title'); if (t) t.focus({ preventScroll: true });
    }, [page]);
    const core = { status, overview, workers, probe };
    const meta = PAGES.find(p => p.id === page) || PAGES[0];
    const body = {
      home: () => h(HomePage, { core }),
      cluster: () => h(ClusterPage, { core }),
      models: () => h(ModelsPage, { core }),
      earn: () => h(EarnPage, { core }),
      tools: () => h(ToolsPage, { core }),
      settings: () => h(SettingsPage, { core, theme, setTheme })
    }[page];
    return h('div', { className: 'cp-app' },
      h('a', { className: 'cp-skip', href: '#cp-main', onClick: e => { e.preventDefault(); if (scrollRef.current) scrollRef.current.focus(); } }, 'Skip to content'),
      h(Rail, { page, core, up }),
      h('div', { className: 'cp-main' },
        desktop ? null : h(BrowserBanner),
        up ? null : h('div', { className: 'cp-banner down', role: 'alert' }, Icon('alert', 18), h('span', null, 'Lost the connection to the coordinator at ', h('code', null, location.host), '. Retrying every few seconds.')),
        h(TopBar, { meta, core, up }),
        h('main', { className: 'cp-scroll', ref: scrollRef, id: 'cp-main', tabIndex: -1 }, h('div', { className: 'cp-page', key: page }, h('p', { className: 'cp-lede' }, meta.lede), body()))),
      h(TipLayer),
      h(Toasts));
  }

  ReactDOM.createRoot(document.getElementById('app')).render(h(App));
})();
</script>
</body>
</html>
