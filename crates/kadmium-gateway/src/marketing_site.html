<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kadmium (kadmium.ai) — Every machine you own, as one reactor.</title>
  <link rel="icon" href="/assets/Logos/kadmium-favicon.svg">
  <link rel="stylesheet" href="/tokens.css">
  <link rel="stylesheet" href="/components/bundle.css">
  <style>
    html, body { margin: 0; }
    body {
      background: var(--graphite-0);
      color: var(--ink);
      font-family: var(--font-sans);
    }
    .top {
      display: flex;
      align-items: center;
      gap: var(--space-3);
      min-height: 56px;
      padding: var(--space-2) var(--space-6);
      border-bottom: 1px solid var(--line);
      background: var(--graphite-1);
      position: sticky;
      top: 0;
      z-index: 20;
      flex-wrap: wrap;
    }
    .top img { height: 24px; display: block; }
    .top .cd {
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 0.08em;
      color: var(--ink-muted);
      text-transform: uppercase;
    }
    .top .spacer { flex: 1; }
    .page {
      max-width: 1160px;
      margin: 0 auto;
      padding: var(--space-8) var(--space-6) var(--space-16);
      display: grid;
      gap: var(--space-12);
    }
    .cover-banner {
      position: relative;
      background: var(--graphite-1);
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      overflow: hidden;
      min-height: 300px;
      display: grid;
      grid-template-columns: 1.1fr 1fr;
      align-items: end;
      box-shadow: var(--shadow-sm);
    }
    .cover-words {
      padding: var(--space-8);
      z-index: 2;
    }
    .cover-art {
      position: relative;
      height: 300px;
      overflow: hidden;
      display: flex;
      justify-content: flex-end;
    }
    .cover-art svg {
      width: 520px;
      height: 288px;
      display: block;
    }
    .slab { fill: var(--cadmium); }
    .tint { fill: var(--cadmium-soft); }
    .deep { fill: var(--graphite-3); }
    .rail { stroke: var(--ink); stroke-width: 4; stroke-linecap: round; fill: none; }
    .rod { stroke: var(--cadmium); stroke-width: 8; stroke-linecap: round; fill: none; }
    .rod.cut { stroke: var(--on-cadmium); }
    .rod.cloud { stroke: var(--cherenkov); }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--ink-muted);
      margin: 0 0 var(--space-2);
    }
    .panel {
      background: var(--graphite-1);
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      padding: var(--space-5);
      box-shadow: var(--shadow-sm);
    }
    .two {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--space-6);
      align-items: start;
    }
    .three {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: var(--space-4);
    }
    .plans {
      display: flex;
      gap: var(--space-4);
      flex-wrap: wrap;
    }
    footer {
      border-top: 1px solid var(--line);
      padding: var(--space-6) 0 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--ink-muted);
      flex-wrap: wrap;
      gap: var(--space-3);
    }
    @media (max-width: 860px) {
      .cover-banner, .two { grid-template-columns: 1fr; }
      .cover-art { display: none; }
    }
  </style>
</head>
<body>
<div id="app"></div>

<script src="/components/lib/react.production.min.js"></script>
<script src="/components/lib/react-dom.production.min.js"></script>
<script src="/components/bundle.js"></script>
<script>
(function () {
  var K = window.Kadmium, h = React.createElement;

  function Site() {
    var themeState = React.useState('dark'), theme = themeState[0], setTheme = themeState[1];
    React.useEffect(function () {
      document.documentElement.setAttribute('data-theme', theme);
    }, [theme]);
    var wordmark = theme === 'dark' ? '/assets/Logos/kadmium-wordmark-dark.svg' : '/assets/Logos/kadmium-wordmark-light.svg';

    return h(React.Fragment, null,
      h('header', { className: 'top' },
        h('img', { src: wordmark, alt: 'Kadmium' }),
        h('span', { className: 'cd' }, 'Cd‑48 · kadmium.ai'),
        h('span', { className: 'spacer' }),
        h(K.Button, { variant: 'ghost', size: 'sm', onClick: function () { window.location.href = '/'; } }, 'Control room'),
        h(K.Button, { variant: 'ghost', size: 'sm', onClick: function () { window.location.href = '/companion'; } }, 'Desktop companion'),
        h(K.Button, { variant: 'ghost', size: 'sm', onClick: function () { window.location.href = '/docs'; } }, 'Docs'),
        h(K.Button, { variant: 'ghost', size: 'sm', onClick: function () { window.location.href = '/design-system'; } }, 'Design system'),
        h(K.Button, { variant: 'ghost', size: 'sm', onClick: function () { setTheme(theme === 'dark' ? 'light' : 'dark'); } }, theme === 'dark' ? 'Light theme' : 'Dark theme'),
        h(K.Button, { variant: 'primary', size: 'sm', icon: 'rods', onClick: function () { window.location.href = '/'; } }, 'Launch dashboard')),

      h('main', { className: 'page' },
        h('section', { className: 'cover-banner' },
          h('div', { className: 'cover-words' },
            h('p', { className: 'eyebrow' }, '100% Pure Rust · MIT / Apache-2.0 · Cd‑48'),
            h('h1', { className: 'display-xl', style: { margin: '0 0 var(--space-4)' } }, 'Every machine you own, as one reactor.'),
            h('p', { className: 'body-lg', style: { color: 'var(--ink-muted)', margin: '0 0 var(--space-6)' } },
              'The modern AI industry promotes a convenient myth: frontier model training and inference require hundreds of thousands of dollars in homogeneous datacenter GPUs. Kadmium shards models asymmetrically across your gaming desktop, M4 Mac Mini, laptops, Raspberry Pi and NAS.'),
            h('div', { className: 'kd-row' },

              h(K.Button, { size: 'lg', onClick: function () { window.location.href = '/companion'; } }, 'Desktop companion app'),
              h(K.Button, { variant: 'cloud', size: 'lg', icon: 'cloud', onClick: function () { window.location.href = '/docs'; } }, 'Read the docs'))),
          h('div', { className: 'cover-art', 'aria-hidden': 'true' },
            h('svg', { viewBox: '0 0 520 288' },
              h('rect', { className: 'slab', x: 16, y: -16, width: 176, height: 256, rx: 10 }),
              h('rect', { className: 'tint', x: 208, y: 96, width: 120, height: 144, rx: 10 }),
              h('rect', { className: 'deep', x: 344, y: 48, width: 192, height: 192, rx: 10 }),
              h('line', { className: 'rail', x1: 16, y1: 36, x2: 536, y2: 36 }),
              h('line', { className: 'rod cut', x1: 40, y1: 28, x2: 40, y2: 120 }),
              h('line', { className: 'rod cut', x1: 64, y1: 28, x2: 64, y2: 184 }),
              h('line', { className: 'rod cut', x1: 88, y1: 28, x2: 88, y2: 96 }),
              h('line', { className: 'rod cut', x1: 112, y1: 28, x2: 112, y2: 152 }),
              h('line', { className: 'rod cut', x1: 136, y1: 28, x2: 136, y2: 212 }),
              h('line', { className: 'rod cut', x1: 160, y1: 28, x2: 160, y2: 128 }),
              h('line', { className: 'rod', x1: 232, y1: 28, x2: 232, y2: 72 }),
              h('line', { className: 'rod', x1: 256, y1: 28, x2: 256, y2: 160 }),
              h('line', { className: 'rod', x1: 280, y1: 28, x2: 280, y2: 112 }),
              h('line', { className: 'rod', x1: 304, y1: 28, x2: 304, y2: 200 }),
              h('line', { className: 'rod', x1: 368, y1: 28, x2: 368, y2: 144 }),
              h('line', { className: 'rod', x1: 392, y1: 28, x2: 392, y2: 88 }),
              h('line', { className: 'rod', x1: 416, y1: 28, x2: 416, y2: 208 }),
              h('line', { className: 'rod', x1: 440, y1: 28, x2: 440, y2: 120 }),
              h('line', { className: 'rod cloud', x1: 464, y1: 28, x2: 464, y2: 168 }),
              h('line', { className: 'rod', x1: 488, y1: 28, x2: 488, y2: 100 }),
              h('line', { className: 'rod', x1: 512, y1: 28, x2: 512, y2: 152 })))),

        h('section', { className: 'two' },
          h('div', { className: 'panel' },
            h('p', { className: 'eyebrow' }, 'Asymmetric shard plan · deepseek-v3-671b-moe'),
            h('h2', { className: 'title', style: { margin: '0 0 var(--space-3)' } }, 'Control rods inserted to unequal depths.'),
            h('p', { className: 'body', style: { color: 'var(--ink-muted)', margin: '0 0 var(--space-4)' } },
              'Yellow rods run on hardware you own. Blue rods run on burst cloud GPUs. Each rod’s depth matches the node’s FreeToken q* bandwidth ratio and 5-tier memory envelope.'),
            h(K.ShardRail, {
              label: 'Shard plan for deepseek-v3-671b-moe',
              depth: 112,
              pitch: 56,
              nodes: [
                { name: 'mac', share: 0.41 },
                { name: 'pc', share: 0.33 },
                { name: 'lap-1', share: 0.18 },
                { name: 'wan', share: 0.06 },
                { name: 'old', share: 0.02 },
                { name: 'sbc', share: 0.0 },
                { name: 'nas', share: 0.0 },
                { name: 'h100', share: 0.24, placement: 'cloud' }
              ]
            })),
          h(K.CodeBlock, {
            title: 'terminal · single binary quickstart',
            language: 'shell',
            code: '$ kadmium probe\n$ kadmium plan --workload inference\n$ kadmium dream   # offline Dream-RSI replay on SBCs (0 GPU-hours)\n$ kadmium slice --pool-size 100 --slices 5\n$ kadmium serve --port 7848'
          })),

        h('section', null,
          h('p', { className: 'eyebrow' }, 'Core mechanisms'),
          h('h2', { className: 'headline', style: { margin: '0 0 var(--space-4)' } }, 'Built for real rooms, home broadband and mixed silicon.'),
          h('div', { className: 'three' },
            h('div', { className: 'panel' },
              h('p', { className: 'eyebrow' }, '64 KiB .ktb + CERN FTS3'),
              h('h3', { className: 'title', style: { margin: '0 0 var(--space-2)' } }, 'Zero-copy NVMe expert streaming'),
              h('p', { className: 'body', style: { color: 'var(--ink-muted)', margin: 0 } },
                'Safetensors and GGUF v3 weights compile automatically on your NAS into 64 KiB page-aligned .ktb banks and stream peer-to-peer to workers with 0.0 GB coordinator bottleneck.')),
            h('div', { className: 'panel' },
              h('p', { className: 'eyebrow' }, 'DiLoCo + Nous DeMo DCT'),
              h('h3', { className: 'title', style: { margin: '0 0 var(--space-2)' } }, '142×–800× less sync bandwidth'),
              h('p', { className: 'body', style: { color: 'var(--ink-muted)', margin: 0 } },
                'Orthonormal DCT-II frequency compression extracts only the fastest-moving momentum components with lossless residual error feedback over 100 Mbps home internet.')),
            h('div', { className: 'panel' },
              h('p', { className: 'eyebrow' }, 'Dream-RSI · arXiv:2609.14858'),
              h('h3', { className: 'title', style: { margin: '0 0 var(--space-2)' } }, 'Offline causal replay at 0 GPU-hours'),
              h('p', { className: 'body', style: { color: 'var(--ink-muted)', margin: 0 } },
                'Idle Raspberry Pis, RK3588 SBCs and old laptops replay recorded discovery trees offline to evolve pruning and exploration policies, cutting GPU search cost by 71.4 %.')),
            h('div', { className: 'panel' },
              h('p', { className: 'eyebrow' }, '< 200 ms Polite Governor'),
              h('h3', { className: 'title', style: { margin: '0 0 var(--space-2)' } }, 'Launch a game; shards step aside'),
              h('p', { className: 'body', style: { color: 'var(--ink-muted)', margin: 0 } },

            h('div', { className: 'panel' },
              h('p', { className: 'eyebrow' }, 'TPU / CIM Dataflows'),
              h('h3', { className: 'title', style: { margin: '0 0 var(--space-2)' } }, 'Token streaming vs. weight streaming'),
              h('p', { className: 'body', style: { color: 'var(--ink-muted)', margin: 0 } },
                'Runs weight-stationary systolic token streaming on high-q* unified memory nodes and dynamic weight streaming on NVMe-backed edge nodes.')),
            h('div', { className: 'panel' },
              h('p', { className: 'eyebrow' }, 'Sub-Cluster Pool Slicing'),
              h('h3', { className: 'title', style: { margin: '0 0 var(--space-2)' } }, '100 nodes → 5 isolated clusters'),
              h('p', { className: 'body', style: { color: 'var(--ink-muted)', margin: 0 } },
                'Partition a lab or datacenter pool into isolated Production, Staging, DiLoCo Training, Dream-RSI and Batch slices with independent sub-coordinators.')))),

        h('section', null,
          h('p', { className: 'eyebrow' }, 'Open source and Kadmium Cloud'),
          h('h2', { className: 'headline', style: { margin: '0 0 var(--space-4)' } }, 'Run it yourself, or let us run the hard part.'),
          h('div', { className: 'plans' },
            h(K.PlanCard, {
              product: 'self-hosted',
              name: 'Kadmium',
              price: '$0',
              period: 'forever',
              summary: 'The whole fabric, on hardware you already own.',
              features: [
                'One Rust binary, every OS',
                'Asymmetric sharding and live rebalancing',
                'DiLoCo + DeMo training over home internet',
                'Dream-RSI offline replay on SBCs and laptops',
                'OpenAI- and Anthropic-compatible gateway',
                'MIT / Apache-2.0'
              ],
              cta: 'Open local control room',
              onSelect: function () { window.location.href = '/'; }
            }),
            h(K.PlanCard, {
              product: 'cloud',
              name: 'Kadmium Cloud',
              price: '$0.89',
              period: '/ GPU-hour, from',
              summary: 'A managed control plane, multi-provider spot arbitrage, and a failover shield for your local lab.',
              features: [
                'Burst GPUs attached to your cluster in minutes',
                'Pre-warmed .ktb vault for < 400 ms bidirectional failover',
                'Multi-datacenter spot arbitrage (~62 % savings)',
                'Spot eviction handled for you',
                'Usage billing, no minimum'
              ],
              cta: 'Configure in Desktop Companion',
              onSelect: function () { window.location.href = '/companion'; }
            }))),

        h('footer', null,
          h('span', null, 'Kadmium · Cd‑48 · https://kadmium.ai'),
          h('span', null, 'One Rust binary. Free to self-host, forever. MIT or Apache-2.0.'))));
  }

  ReactDOM.createRoot(document.getElementById('app')).render(h(Site));
})();
</script>
</body>
</html>
