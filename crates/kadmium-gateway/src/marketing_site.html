<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="stylesheet" href="/tokens.css">
  <link rel="stylesheet" href="/components/bundle.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    html, body { margin: 0; overflow-x: hidden; }
    body {
      background: var(--graphite-0);
      color: var(--ink);
      font-family: var(--font-sans);
      -webkit-font-smoothing: antialiased;
    }

    /* ---- Fluid Typography ---- */
    .display-xl {
      font-size: clamp(34px, 4vw, 54px);
      line-height: 1.06;
      letter-spacing: -0.035em;
      font-weight: 650;
    }
    .headline {
      font-size: clamp(24px, 2.5vw, 32px);
      line-height: 1.16;
      letter-spacing: -0.022em;
      font-weight: 600;
    }
    .title {
      font-size: clamp(18px, 1.8vw, 21px);
      line-height: 1.28;
      font-weight: 600;
    }

    /* ---- Wide, Breathable Container (1440px) ---- */
    .top-wrap {
      position: sticky;
      top: 0;
      z-index: 40;
      background: var(--graphite-1);
      border-bottom: 1px solid var(--line);
    }
    .top {
      max-width: 1440px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-4);
      min-height: 68px;
      padding: var(--space-2) var(--space-8);
    }
    .brand-cluster {
      display: flex;
      align-items: center;
      gap: var(--space-3);
      text-decoration: none;
      color: inherit;
      flex-shrink: 0;
    }
    .brand-cluster img { height: 24px; display: block; }
    .brand-tag {
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 0.08em;
      color: var(--ink-muted);
      text-transform: uppercase;
      padding: 3px 9px;
      border-radius: var(--radius-full);
      border: 1px solid var(--line);
      background: var(--graphite-2);
    }
    .nav-links {
      display: flex;
      align-items: center;
      gap: var(--space-2);
    }
    .nav-link {
      font-family: var(--font-sans);
      font-size: 14px;
      font-weight: 500;
      color: var(--ink-muted);
      text-decoration: none;
      padding: 8px 14px;
      border-radius: var(--radius-sm);
      transition: color 0.12s ease, background-color 0.12s ease;
      white-space: nowrap;
    }
    .nav-link:hover {
      color: var(--ink);
      background: var(--graphite-2);
    }
    .nav-actions {
      display: flex;
      align-items: center;
      gap: var(--space-3);
      flex-shrink: 0;
    }
    .mobile-menu-btn { display: none; }
    .mobile-drawer {
      display: none;
      border-top: 1px solid var(--line);
      background: var(--graphite-1);
      padding: var(--space-4) var(--space-6);
    }
    .mobile-drawer.open {
      display: grid;
      gap: var(--space-2);
    }

    /* ---- Main Page Canvas ---- */
    .page {
      max-width: 1440px;
      margin: 0 auto;
      padding: var(--space-10) var(--space-8) 96px;
      display: grid;
      gap: 80px;
    }
    .page > *, .kd-stack > *, .two > *, .three > *, .plans > *, .node-grid > *, .stat-strip > * {
      min-width: 0;
    }
    .section-block {
      display: grid;
      gap: var(--space-6);
    }

    /* ---- Spacious Hero ---- */
    .hero-card {
      background: var(--graphite-1);
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      padding: 44px;
      box-shadow: var(--shadow-sm);
      display: grid;
      grid-template-columns: 1.12fr 0.88fr;
      gap: 48px;
      align-items: center;
    }
    .hero-left {
      display: grid;
      gap: var(--space-6);
      min-width: 0;
    }
    .hero-right {
      display: grid;
      gap: var(--space-5);
      background: var(--graphite-2);
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      padding: var(--space-6);
      min-width: 0;
    }
    .hero-svg-box {
      width: 100%;
      overflow: hidden;
      border-radius: var(--radius-sm);
      border: 1px solid var(--line);
      background: var(--graphite-1);
      padding: var(--space-4);
    }
    .hero-svg-box svg {
      width: 100%;
      height: auto;
      display: block;
    }
    .hero-mini-stats {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: var(--space-3);
    }
    .hero-mini-stat {
      background: var(--graphite-1);
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      padding: var(--space-4);
      display: grid;
      gap: 4px;
    }
    .hero-mini-stat .val {
      font-family: var(--font-mono);
      font-size: 20px;
      font-weight: 600;
      letter-spacing: -0.02em;
    }
    .slab { fill: var(--cadmium); }
    .tint { fill: var(--cadmium-soft); }
    .deep { fill: var(--graphite-3); }
    .rail { stroke: var(--ink); stroke-width: 4; stroke-linecap: round; fill: none; }
    .rod { stroke: var(--cadmium); stroke-width: 8; stroke-linecap: round; fill: none; }
    .rod.cut { stroke: var(--on-cadmium); }
    .rod.cloud { stroke: var(--cherenkov); }

    /* ---- Eyebrow, Panels & Section Headers ---- */
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--ink-muted);
      margin: 0 0 var(--space-2);
    }
    .section-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: var(--space-6);
      flex-wrap: wrap;
    }
    .section-head-copy {
      max-width: 680px;
    }
    .panel {
      background: var(--graphite-1);
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      padding: 32px;
      box-shadow: var(--shadow-sm);
      min-width: 0;
    }
    .well {
      background: var(--graphite-2);
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      padding: var(--space-5);
      min-width: 0;
    }

    /* ---- Grids ---- */
    .two {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--space-8);
      align-items: start;
    }
    .node-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: var(--space-5);
    }
    .stat-strip {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: var(--space-5);
    }
    .stat-strip-3 {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: var(--space-5);
    }
    .stat-strip-2 {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: var(--space-5);
    }
    .stat-card {
      background: var(--graphite-1);
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      padding: var(--space-6);
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: var(--space-2);
    }
    .stat-card .meta {
      font-family: var(--font-mono);
      font-size: 12px;
      line-height: 18px;
      color: var(--ink-muted);
      font-variant-numeric: tabular-nums;
    }

    /* ---- Pricing & Product Cards ---- */
    .plans {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: var(--space-6);
      align-items: stretch;
    }
    .plan-featured-wrap {
      display: flex;
      flex-direction: column;
    }
    .plan-featured-wrap .kd-plan {
      border-color: var(--cherenkov);
      flex: 1;
    }
    .plans > .kd-plan {
      height: 100%;
      padding: 32px;
    }

    /* ---- Scrollable Tables ---- */
    .table-wrap {
      width: 100%;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      background: var(--graphite-1);
    }
    .mono-table {
      width: 100%;
      min-width: 480px;
      border-collapse: collapse;
      font-family: var(--font-mono);
      font-size: 12px;
      font-variant-numeric: tabular-nums;
    }
    .mono-table th {
      text-align: left;
      padding: 12px 16px;
      background: var(--graphite-2);
      color: var(--ink-muted);
      border-bottom: 1px solid var(--line);
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .mono-table td {
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
      color: var(--ink);
      vertical-align: middle;
    }
    .mono-table tr:last-child td { border-bottom: none; }

    /* ---- FAQ Grid ---- */
    .faq-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: var(--space-5);
    }
    .faq-card {
      background: var(--graphite-1);
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      padding: var(--space-6);
      display: grid;
      gap: var(--space-2);
    }

    /* ---- CTA Banner & Commercial Footer ---- */
    .cta-banner {
      background: var(--graphite-1);
      border: 1px solid var(--cadmium-edge);
      border-radius: var(--radius-lg);
      padding: 40px 44px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: var(--space-6);
      flex-wrap: wrap;
      box-shadow: var(--shadow-sm);
    }
    .site-footer {
      border-top: 1px solid var(--line);
      padding-top: var(--space-8);
      display: grid;
      gap: var(--space-6);
    }
    .footer-grid {
      display: grid;
      grid-template-columns: 1.5fr repeat(3, 1fr);
      gap: var(--space-8);
    }
    .footer-col {
      display: grid;
      align-content: start;
      gap: var(--space-2);
    }
    .footer-col a {
      color: var(--ink-muted);
      text-decoration: none;
      font-size: 14px;
      line-height: 22px;
    }
    .footer-col a:hover { color: var(--ink); }
    .footer-bottom {
      border-top: 1px solid var(--line);
      padding-top: var(--space-4);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: var(--space-3);
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--ink-muted);
    }

    /* ---- Responsive Breakpoints ---- */
    @media (max-width: 1200px) {
      .node-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 1040px) {
      .nav-links { display: none; }
      .mobile-menu-btn { display: inline-flex; }
      .hero-card { grid-template-columns: 1fr; padding: var(--space-6); gap: var(--space-6); }
      .two { grid-template-columns: 1fr; gap: var(--space-6); }
      .plans { grid-template-columns: 1fr; }
      .stat-strip { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .footer-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 720px) {
      .top { padding: var(--space-2) var(--space-4); }
      .brand-tag { display: none; }
      .page { padding: var(--space-6) var(--space-4) var(--space-12); gap: 48px; }
      .hero-card, .panel, .cta-banner { padding: var(--space-5); }
      .hero-mini-stats, .node-grid, .stat-strip, .stat-strip-3, .stat-strip-2, .faq-grid, .footer-grid {
        grid-template-columns: 1fr;
      }
      .nav-actions .hide-sm { display: none; }
    }

</head>
