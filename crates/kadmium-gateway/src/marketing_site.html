<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">

  <link rel="stylesheet" href="/components/bundle.css">
  <style>
    html, body { margin: 0; }
    body {
      background: var(--graphite-0);
      color: var(--ink);
      font-family: var(--font-sans);
    }
    .top {
      display: flex;
      align-items: center;
      gap: var(--space-3);
      min-height: 56px;
      padding: var(--space-2) var(--space-6);
      border-bottom: 1px solid var(--line);
      background: var(--graphite-1);
      position: sticky;
      top: 0;
      z-index: 20;
      flex-wrap: wrap;
    }
    .top img { height: 24px; display: block; }
    .top .cd {
      font-family: var(--font-mono);
      font-size: 12px;
      letter-spacing: 0.08em;
      color: var(--ink-muted);
      text-transform: uppercase;
    }
    .top .spacer { flex: 1; }
    .page {
      max-width: 1200px;
      margin: 0 auto;
      padding: var(--space-8) var(--space-6) var(--space-16);
      display: grid;
      gap: var(--space-12);
    }
    .cover-banner {
      position: relative;
      background: var(--graphite-1);
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      overflow: hidden;
      min-height: 320px;
      display: grid;
      grid-template-columns: 1.15fr 1fr;
      align-items: end;
      box-shadow: var(--shadow-sm);
    }
    .cover-words {
      padding: var(--space-8);
      z-index: 2;
    }
    .cover-art {
      position: relative;
      height: 320px;
      overflow: hidden;
      display: flex;
      justify-content: flex-end;
      align-items: flex-end;
    }
    .cover-art svg {
      width: 520px;
      height: 296px;
      display: block;
    }
    .slab { fill: var(--cadmium); }
    .tint { fill: var(--cadmium-soft); }
    .deep { fill: var(--graphite-3); }
    .rail { stroke: var(--ink); stroke-width: 4; stroke-linecap: round; fill: none; }
    .rod { stroke: var(--cadmium); stroke-width: 8; stroke-linecap: round; fill: none; }
    .rod.cut { stroke: var(--on-cadmium); }
    .rod.cloud { stroke: var(--cherenkov); }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--ink-muted);
      margin: 0 0 var(--space-2);
    }
    .panel {
      background: var(--graphite-1);
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      padding: var(--space-5);
      box-shadow: var(--shadow-sm);
    }
    .well {
      background: var(--graphite-2);
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      padding: var(--space-4);
    }
    .two {
      display: grid;
      grid-template-columns: 1.05fr 1fr;
      gap: var(--space-6);
      align-items: start;
    }
    .three {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: var(--space-4);
    }
    .node-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: var(--space-4);
    }
    .stat-strip {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: var(--space-4);
    }
    .stat-card {
      background: var(--graphite-1);
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      padding: var(--space-4);
      box-shadow: var(--shadow-sm);
      display: grid;
      gap: var(--space-1);
    }
    .stat-card .meta {
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--ink-muted);
      font-variant-numeric: tabular-nums;
    }
    .plans {
      display: flex;
      gap: var(--space-4);
      flex-wrap: wrap;
    }
    .mono-table {
      width: 100%;
      border-collapse: collapse;
      font-family: var(--font-mono);
      font-size: 12px;
      font-variant-numeric: tabular-nums;
    }
    .mono-table th {
      text-align: left;
      padding: var(--space-2) var(--space-3);
      background: var(--graphite-2);
      color: var(--ink-muted);
      border-bottom: 1px solid var(--line);
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .mono-table td {
      padding: var(--space-2) var(--space-3);
      border-bottom: 1px solid var(--line);
      color: var(--ink);
    }
    .mono-table tr:last-child td { border-bottom: none; }
    footer {
      border-top: 1px solid var(--line);
      padding: var(--space-6) 0 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--ink-muted);
      flex-wrap: wrap;
      gap: var(--space-3);
    }
    @media (max-width: 900px) {
      .cover-banner, .two { grid-template-columns: 1fr; }
      .cover-art { display: none; }
    }
  </style>
</head>
