    *, *::before, *::after { box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    body { background: var(--graphite-0); color: var(--ink); font-family: var(--font-sans); -webkit-font-smoothing: antialiased; }

    .s-eyebrow.cloud { color: var(--cherenkov-text); }
    .s-eyebrow.muted { color: var(--ink-muted); }
    .s-h2 { font-size: clamp(30px, 3.6vw, 40px); line-height: 1.08; font-weight: 650; letter-spacing: -0.03em; margin: 0 0 var(--space-4); max-width: 22ch; }
    .s-lede { font-size: 17px; line-height: 26px; color: var(--ink-muted); margin: 0; max-width: 60ch; }
    .s-lede b { color: var(--ink); font-weight: 600; }
    .s-section { padding: clamp(56px, 8vw, 96px) 0; }
    .s-section + .s-section { border-top: 1px solid var(--line); }
    .s-head { margin-bottom: clamp(28px, 4vw, 44px); display: grid; gap: var(--space-2); }

    /* nav */
    .s-nav { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--graphite-0) 86%, transparent); backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); }
    .s-nav .s-row { display: flex; align-items: center; gap: var(--space-5); height: 60px; }
    .s-nav img { height: 24px; display: block; }
    .s-nav .cd { font-family: var(--font-mono); font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-faint); margin-left: -8px; }
    .s-links { display: flex; gap: 2px; margin-left: var(--space-3); }
    .s-links a { color: var(--ink-muted); text-decoration: none; font-size: 14px; font-weight: 500; padding: 6px 10px; border-radius: var(--radius-sm); }
    .s-links a:hover { color: var(--ink); background: var(--graphite-2); }
    .s-nav .right { margin-left: auto; display: flex; gap: var(--space-2); align-items: center; }
    .s-burger { display: none; }
    .s-mobile { display: none; }
    .s-mobile.open { display: grid; gap: 2px; padding: var(--space-2) 0 var(--space-3); border-top: 1px solid var(--line); }
    .s-mobile a { color: var(--ink); text-decoration: none; font-size: 15px; padding: 10px 12px; border-radius: var(--radius-sm); }
    .s-mobile a:hover { background: var(--graphite-2); }

    /* hero */
    .s-hero { padding: clamp(48px, 7vw, 88px) 0 clamp(40px, 6vw, 72px); }
    .s-hero .s-wrap { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: clamp(32px, 5vw, 72px); align-items: center; }
    .s-chips { display: flex; flex-wrap: wrap; gap: var(--space-2); margin-bottom: var(--space-5); }
    .s-h1 { font-size: clamp(38px, 5.4vw, 60px); line-height: 1.02; font-weight: 650; letter-spacing: -0.035em; margin: 0 0 var(--space-5); max-width: 15ch; }
    .s-hero .s-lede { margin-bottom: var(--space-6); }
    .s-ctas { display: flex; flex-wrap: wrap; gap: var(--space-3); margin-bottom: var(--space-6); }
    .s-install { display: grid; gap: var(--space-2); }
    .s-art { position: relative; background: var(--graphite-1); border: 1px solid var(--line); border-radius: var(--radius-lg); padding: var(--space-5); box-shadow: var(--shadow-sm); overflow: hidden; }
    .s-art svg { display: block; width: 100%; height: auto; }
    .s-art .slab { fill: var(--cadmium); } .s-art .tint { fill: var(--cadmium-soft); } .s-art .deep { fill: var(--graphite-3); }
    .s-art .rail { stroke: var(--ink); stroke-width: 4; stroke-linecap: round; fill: none; }
    .s-art .rod { stroke: var(--cadmium); stroke-width: 8; stroke-linecap: round; fill: none; }
    .s-art .rod.cut { stroke: var(--on-cadmium); } .s-art .rod.cloud { stroke: var(--cherenkov); }
    .s-art .caption { display: flex; justify-content: space-between; gap: var(--space-3); margin-bottom: var(--space-4); font-family: var(--font-mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-muted); }
    .s-stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--space-3); margin-top: var(--space-5); }
    .s-stat { background: var(--graphite-0); border: 1px solid var(--line); border-radius: var(--radius-md); padding: 12px 14px; display: grid; gap: 3px; min-width: 0; }
    .s-stat .l { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-muted); }
    .s-stat .v { font-family: var(--font-mono); font-size: 22px; line-height: 26px; font-weight: 500; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; color: var(--cadmium-text); }
    .s-stat.cloud .v { color: var(--cherenkov-text); }
    .s-stat .m { font-size: 12px; color: var(--ink-muted); }

    /* generic blocks */
    .s-grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--space-5); }
    .s-grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--space-5); }
    .s-card { background: var(--graphite-1); border: 1px solid var(--line); border-radius: var(--radius-md); padding: var(--space-5); box-shadow: var(--shadow-sm); min-width: 0; display: flex; flex-direction: column; gap: var(--space-3); }
    .s-card h3 { margin: 0; font-size: 20px; line-height: 26px; font-weight: 600; letter-spacing: -0.01em; }
    .s-card p { margin: 0; font-size: 15px; line-height: 22px; color: var(--ink-muted); }
    .s-card p b { color: var(--ink); font-weight: 600; }
    .s-step { font-family: var(--font-mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--cadmium-text); display: flex; align-items: center; gap: 8px; }
    .s-step::before { content: ""; width: 3px; height: 14px; border-radius: var(--radius-full); background: var(--cadmium); }
    .s-hw { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: var(--space-3); margin-top: var(--space-6); }
    .s-hw div { border: 1px solid var(--line); border-radius: var(--radius-md); padding: 14px 12px; display: grid; gap: 8px; justify-items: center; text-align: center; color: var(--ink-muted); font-size: 12.5px; background: var(--graphite-1); }

    .s-rows { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; }
    .s-rows li { display: grid; grid-template-columns: 150px 1fr; gap: var(--space-4); padding: 10px 0; border-top: 1px solid var(--line); font-size: 14px; line-height: 20px; }
    .s-rows li:first-child { border-top: 0; }
    .s-rows li span:first-child { font-family: var(--font-mono); font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-muted); padding-top: 3px; }
    .s-table { width: 100%; border-collapse: collapse; font-family: var(--font-mono); font-size: 12.5px; }
    .s-table th { text-align: left; font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-muted); padding: 10px 14px; border-bottom: 1px solid var(--line); white-space: nowrap; }
    .s-table td { padding: 12px 14px; border-bottom: 1px solid var(--line); vertical-align: top; }
    .s-table tbody tr:last-child td { border-bottom: 0; }
    .s-table td.sans { font-family: var(--font-sans); font-size: 14px; }
    .s-table .cad { color: var(--cadmium-text); font-weight: 600; } .s-table .cher { color: var(--cherenkov-text); font-weight: 600; } .s-table .mut { color: var(--ink-muted); }
    .s-tablewrap { overflow: auto; border: 1px solid var(--line); border-radius: var(--radius-md); background: var(--graphite-1); }
    .s-plans { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--space-5); align-items: stretch; }
    .s-plans .kd-plan { width: 100%; }
    .s-sim { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.3fr); gap: var(--space-5); align-items: start; }
    .s-sim .kd-rail { width: 100%; }
    .s-nodes { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: var(--space-4); margin-top: var(--space-5); }
    .s-tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--space-4); }
    .s-tile { background: var(--graphite-1); border: 1px solid var(--line); border-radius: var(--radius-md); padding: var(--space-5); display: grid; gap: 6px; }
    .s-tile .v { font-family: var(--font-mono); font-size: 34px; line-height: 38px; font-weight: 500; letter-spacing: -0.03em; }
    .s-tile .l { font-size: 14px; line-height: 20px; color: var(--ink-muted); }
    .s-calc { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(280px, 1fr); gap: var(--space-5); }
    .s-seg { display: inline-flex; gap: 2px; padding: 2px; background: var(--graphite-2); border-radius: var(--radius-sm); }
    .s-seg button { -webkit-appearance: none; appearance: none; border: 0; background: transparent; color: var(--ink-muted); font: inherit; font-size: 13px; font-weight: 500; height: 28px; padding: 0 12px; border-radius: 4px; cursor: pointer; }
    .s-seg button.active { background: var(--graphite-1); color: var(--ink); box-shadow: var(--shadow-sm); }
    .s-seg button:focus-visible { outline: none; box-shadow: var(--focus-ring); }
    .s-total { background: var(--graphite-0); border: 1px solid var(--line); border-radius: var(--radius-md); padding: var(--space-4); display: grid; gap: 4px; }
    .s-total .v { font-family: var(--font-mono); font-size: 30px; line-height: 34px; font-weight: 500; letter-spacing: -0.02em; color: var(--cadmium-text); }
    .s-total.cloud .v { color: var(--cherenkov-text); }
    .s-faq { display: grid; gap: var(--space-3); }
    .s-faq details { background: var(--graphite-1); border: 1px solid var(--line); border-radius: var(--radius-md); padding: 0 var(--space-5); }
    .s-faq summary { cursor: pointer; font-size: 16px; font-weight: 600; padding: 16px 0; list-style: none; display: flex; justify-content: space-between; gap: var(--space-3); }
    .s-faq summary::-webkit-details-marker { display: none; }
    .s-faq summary::after { content: "+"; font-family: var(--font-mono); color: var(--ink-muted); }
    .s-faq details[open] summary::after { content: "–"; }
    .s-faq details p { margin: 0 0 16px; font-size: 15px; line-height: 22px; color: var(--ink-muted); }
    .s-cta { background: var(--graphite-1); border: 1px solid var(--line); border-radius: var(--radius-lg); padding: clamp(28px, 4vw, 48px); display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: var(--space-6); align-items: center; }
    .s-cta h2 { margin: 0 0 var(--space-2); font-size: clamp(24px, 3vw, 32px); line-height: 1.1; letter-spacing: -0.02em; font-weight: 650; }
    .s-cta p { margin: 0; color: var(--ink-muted); font-size: 15px; }
    .s-foot { border-top: 1px solid var(--line); padding: var(--space-8) 0; }
    .s-foot .s-wrap { display: grid; grid-template-columns: 1.4fr 1fr 1fr 1fr; gap: var(--space-6); }

    .s-foot a { display: block; color: var(--ink-muted); text-decoration: none; font-size: 14px; padding: 3px 0; }
    .s-foot a:hover { color: var(--ink); }
    .s-foot p { margin: 0; color: var(--ink-muted); font-size: 13px; line-height: 20px; max-width: 36ch; }
    .s-foot .legal { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: var(--space-4); font-family: var(--font-mono); font-size: 11.5px; color: var(--ink-faint); border-top: 1px solid var(--line); padding-top: var(--space-5); }

      .s-hw { grid-template-columns: repeat(3, minmax(0, 1fr)); }

      .s-sim, .s-calc { grid-template-columns: 1fr; }

      .s-grid3, .s-grid2, .s-plans, .s-tiles, .s-nodes { grid-template-columns: 1fr; }
      .s-hw { grid-template-columns: 1fr 1fr; }
      .s-rows li { grid-template-columns: 1fr; gap: 2px; }
      .s-cta { grid-template-columns: 1fr; }
      .s-foot .s-wrap { grid-template-columns: 1fr; }
      .s-stats { grid-template-columns: 1fr; }
    }
  </style>
</head>
