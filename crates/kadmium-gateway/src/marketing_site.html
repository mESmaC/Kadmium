<html lang="en" data-theme="dark">

    *, *::before, *::after { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    html, body { margin: 0; overflow-x: hidden; }
    body {
      background: var(--graphite-0);
      color: var(--ink);
      font-family: var(--font-sans);
      -webkit-font-smoothing: antialiased;
    }

    /* ---- Responsive Typography Overrides ---- */
    .display-xl {
      font-size: clamp(32px, 4.4vw, 52px);
      line-height: 1.08;
      letter-spacing: -0.035em;
      font-weight: 650;
    }
    .headline {
      font-size: clamp(22px, 2.8vw, 30px);
      line-height: 1.18;
      letter-spacing: -0.02em;
      font-weight: 600;
    }
    .title {
      font-size: clamp(18px, 2vw, 21px);
      line-height: 1.3;
      font-weight: 600;
    }

    /* ---- Commercial Top Navigation ---- */
    .top-wrap {
      position: sticky;
      top: 0;
      z-index: 40;
      background: var(--graphite-1);
      border-bottom: 1px solid var(--line);
    }
    .top {
      max-width: 1240px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-4);
      min-height: 64px;
      padding: var(--space-2) var(--space-6);
    }
    .brand-cluster {
      display: flex;
      align-items: center;
      gap: var(--space-3);
      text-decoration: none;
      color: inherit;
      flex-shrink: 0;
    }
    .brand-cluster img { height: 24px; display: block; }
    .brand-tag {
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 0.08em;
      color: var(--ink-muted);
      text-transform: uppercase;
      padding: 2px 8px;
      border-radius: var(--radius-full);
      border: 1px solid var(--line);
      background: var(--graphite-2);
    }
    .nav-links {
      display: flex;
      align-items: center;
      gap: var(--space-1);
    }
    .nav-link {
      font-family: var(--font-sans);
      font-size: 14px;
      font-weight: 500;
      color: var(--ink-muted);
      text-decoration: none;
      padding: 6px 12px;
      border-radius: var(--radius-sm);
      transition: color 0.12s ease, background-color 0.12s ease;
      white-space: nowrap;
    }
    .nav-link:hover {
      color: var(--ink);
      background: var(--graphite-2);
    }
    .nav-actions {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      flex-shrink: 0;
    }
    .mobile-menu-btn {
      display: none;
    }
    .mobile-drawer {
      display: none;
      border-top: 1px solid var(--line);
      background: var(--graphite-1);
      padding: var(--space-4) var(--space-6);
    }
    .mobile-drawer.open {
      display: grid;
      gap: var(--space-2);
    }

    /* ---- Page Layout & Grid Safety (min-width: 0 prevents blowout) ---- */
    .page {
      max-width: 1240px;
      margin: 0 auto;
      padding: var(--space-8) var(--space-6) var(--space-16);
      display: grid;
      gap: var(--space-16);
    }
    .page > *, .kd-stack > *, .two > *, .three > *, .plans > *, .node-grid > *, .stat-strip > * {
      min-width: 0;
    }

    /* ---- Hero Section ---- */
    .hero-card {
      background: var(--graphite-1);
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      padding: var(--space-8);
      box-shadow: var(--shadow-sm);
      display: grid;
      grid-template-columns: 1.18fr 0.82fr;
      gap: var(--space-8);
      align-items: stretch;
    }
    .hero-left {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: var(--space-5);
      min-width: 0;
    }
    .hero-right {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: var(--space-4);
      background: var(--graphite-2);
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      padding: var(--space-5);
      min-width: 0;
    }
    .hero-pillars {
      display: grid;
      gap: var(--space-2);
      margin: 0;
      padding: 0;
      list-style: none;
    }
    .hero-pillars li {
      display: flex;
      align-items: flex-start;
      gap: var(--space-3);
      font-size: 15px;
      line-height: 22px;
      color: var(--ink-muted);
    }
    .hero-pillars li strong {
      color: var(--ink);
      font-weight: 600;
    }
    .pillar-bar {
      flex: none;
      width: 4px;
      height: 16px;
      margin-top: 3px;
      border-radius: var(--radius-full);
      background: var(--cadmium);
    }
    .pillar-bar.cloud {
      background: var(--cherenkov);
    }
    .pillar-bar.ok {
      background: var(--ok);
    }
    .hero-svg-box {
      width: 100%;
      overflow: hidden;
      border-radius: var(--radius-sm);
      border: 1px solid var(--line);
      background: var(--graphite-1);
      padding: var(--space-3);
    }
    .hero-svg-box svg {
      width: 100%;
      height: auto;
      display: block;
    }
    .slab { fill: var(--cadmium); }
    .tint { fill: var(--cadmium-soft); }
    .deep { fill: var(--graphite-3); }
    .rail { stroke: var(--ink); stroke-width: 4; stroke-linecap: round; fill: none; }
    .rod { stroke: var(--cadmium); stroke-width: 8; stroke-linecap: round; fill: none; }
    .rod.cut { stroke: var(--on-cadmium); }
    .rod.cloud { stroke: var(--cherenkov); }

    /* ---- Eyebrow, Panels & Section Headers ---- */
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--ink-muted);
      margin: 0 0 var(--space-2);
    }
    .section-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: var(--space-4);
      flex-wrap: wrap;
      margin-bottom: var(--space-2);
    }
    .section-head-copy {
      max-width: 720px;
    }
    .panel {
      background: var(--graphite-1);
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      padding: var(--space-6);
      box-shadow: var(--shadow-sm);
      min-width: 0;
    }
    .well {
      background: var(--graphite-2);
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      padding: var(--space-4);
      min-width: 0;
    }

    /* ---- Responsive Grids ---- */
    .two {
      display: grid;
      grid-template-columns: 1.05fr 0.95fr;
      gap: var(--space-6);
      align-items: start;
    }
    .three {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: var(--space-5);
      align-items: stretch;
    }
    .node-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: var(--space-4);
    }
    .stat-strip {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: var(--space-4);
    }
    .stat-strip-3 {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: var(--space-4);
    }
    .stat-strip-2 {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: var(--space-4);
    }
    .stat-card {
      background: var(--graphite-1);
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      padding: var(--space-5);
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: var(--space-2);
    }
    .stat-card .meta {
      font-family: var(--font-mono);
      font-size: 12px;
      line-height: 17px;
      color: var(--ink-muted);
      font-variant-numeric: tabular-nums;
    }

    /* ---- Product Pillar Cards ---- */
    .service-card {
      background: var(--graphite-1);
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      padding: var(--space-6);
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      gap: var(--space-4);
    }
    .service-card-featured {
      border-color: var(--cherenkov);
    }
    .service-card .kd-btn {
      margin-top: auto;
      width: 100%;
    }

    /* ---- Pricing Grid ---- */
    .plans {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: var(--space-5);
      align-items: stretch;
    }
    .plan-featured-wrap {
      position: relative;
      display: flex;
      flex-direction: column;
    }
    .plan-featured-wrap .kd-plan {
      border-color: var(--cherenkov);
      flex: 1;
    }
    .plans > .kd-plan {
      height: 100%;
    }

    /* ---- Scrollable Tables (No Horizontal Blowout) ---- */
    .table-wrap {
      width: 100%;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      background: var(--graphite-1);
    }
    .mono-table {
      width: 100%;
      min-width: 520px;
      border-collapse: collapse;
      font-family: var(--font-mono);
      font-size: 12px;
      font-variant-numeric: tabular-nums;
    }
    .mono-table th {
      text-align: left;
      padding: var(--space-3) var(--space-3);
      background: var(--graphite-2);
      color: var(--ink-muted);
      border-bottom: 1px solid var(--line);
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .mono-table td {
      padding: var(--space-3) var(--space-3);
      border-bottom: 1px solid var(--line);
      color: var(--ink);
      vertical-align: middle;
    }
    .mono-table tr:last-child td { border-bottom: none; }

    /* ---- FAQ Grid ---- */
    .faq-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: var(--space-4);
    }
    .faq-card {
      background: var(--graphite-1);
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      padding: var(--space-5);
      display: grid;
      gap: var(--space-2);
    }

    /* ---- CTA Banner & Commercial Footer ---- */
    .cta-banner {
      background: var(--graphite-1);
      border: 1px solid var(--cadmium-edge);
      border-radius: var(--radius-lg);
      padding: var(--space-8);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: var(--space-6);
      flex-wrap: wrap;
      box-shadow: var(--shadow-sm);
    }
    .site-footer {
      border-top: 1px solid var(--line);
      padding-top: var(--space-8);
      display: grid;
      gap: var(--space-6);
    }
    .footer-grid {
      display: grid;
      grid-template-columns: 1.5fr repeat(3, 1fr);
      gap: var(--space-6);
    }
    .footer-col {
      display: grid;
      align-content: start;
      gap: var(--space-2);
    }
    .footer-col a {
      color: var(--ink-muted);
      text-decoration: none;
      font-size: 14px;
      line-height: 20px;
    }
    .footer-col a:hover { color: var(--ink); }
    .footer-bottom {
      border-top: 1px solid var(--line);
      padding-top: var(--space-4);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: var(--space-3);
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--ink-muted);
    }

    /* ---- Responsive Breakpoints ---- */
    @media (max-width: 1040px) {
      .nav-links { display: none; }
      .mobile-menu-btn { display: inline-flex; }
      .hero-card { grid-template-columns: 1fr; padding: var(--space-6); }
      .two { grid-template-columns: 1fr; }
      .three, .plans { grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
      .stat-strip { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .footer-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 720px) {
      .top { padding: var(--space-2) var(--space-4); }
      .brand-tag { display: none; }
      .page { padding: var(--space-5) var(--space-4) var(--space-12); gap: var(--space-10); }
      .hero-card, .panel, .cta-banner { padding: var(--space-4); }
      .stat-strip, .stat-strip-3, .stat-strip-2, .faq-grid, .footer-grid {
        grid-template-columns: 1fr;
      }
      .nav-actions .hide-sm { display: none; }
    }
  </style>
</head>
