<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kadmium — Documentation</title>
  <link rel="icon" href="/assets/Logos/kadmium-favicon.svg" />
  <link rel="stylesheet" href="/tokens.css" />
  <link rel="stylesheet" href="/components/bundle.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; overflow-x: hidden; }
    body {
      background: var(--graphite-0);
      color: var(--ink);
      font-family: var(--font-sans);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    header {
      min-height: 60px;
      border-bottom: 1px solid var(--line);
      background: color-mix(in srgb, var(--graphite-1) 92%, transparent);
      backdrop-filter: blur(12px);
      display: flex;
      align-items: center;
      gap: var(--space-3);
      padding: var(--space-2) clamp(16px, 3vw, 40px);
      position: sticky;
      top: 0;
      z-index: 20;
      flex-wrap: wrap;
    }
    header img { height: 24px; display: block; }
    header .cd {
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 0.08em;
      color: var(--ink-muted);
      text-transform: uppercase;
    }
    header .spacer { flex: 1; }
    .layout {
      display: grid;
      grid-template-columns: 300px minmax(0, 1fr);
      flex: 1;
      max-width: 1440px;
      width: 100%;
      margin: 0 auto;
    }
    aside {
      border-right: 1px solid var(--line);
      padding: var(--space-5) var(--space-4);
      background: var(--graphite-1);
      height: calc(100vh - 60px);
      position: sticky;
      top: 60px;
      overflow-y: auto;
    }
    .search-input {
      width: 100%;
      height: var(--control-md);
      padding: 0 var(--space-3);
      border-radius: var(--radius-sm);
      border: 1px solid var(--line-strong);
      background: var(--graphite-0);
      color: var(--ink);
      font-family: var(--font-sans);
      font-size: 14px;
      margin-bottom: var(--space-4);
      outline: none;
    }
    .search-input:focus {
      border-color: var(--cadmium-text);
      box-shadow: var(--focus-ring);
    }
    .cat-header {
      font-family: var(--font-mono);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--ink-muted);
      margin: var(--space-4) var(--space-2) var(--space-2);
      font-weight: 500;
    }
    .doc-item {
      display: block;
      width: 100%;
      text-align: left;
      background: transparent;
      border: 0;
      border-left: 3px solid transparent;
      color: var(--ink-muted);
      padding: var(--space-2) var(--space-3);
      border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
      font-family: var(--font-sans);
      font-size: 14px;
      cursor: pointer;
      margin-bottom: 2px;
      transition: background-color 0.12s ease, color 0.12s ease;
    }
    .doc-item:hover {
      background: var(--graphite-2);
      color: var(--ink);
    }
    .doc-item.active {
      background: var(--cadmium-soft);
      border-left-color: var(--cadmium);
      color: var(--ink);
      font-weight: 600;
    }
    .doc-item:focus-visible {
      outline: none;
      box-shadow: var(--focus-ring);
    }
    .doc-item small {
      display: block;
      color: var(--ink-muted);
      font-family: var(--font-mono);
      font-size: 11px;
      margin-top: 2px;
    }
    main:focus { outline: none; }
    .skip {
      position: fixed; left: 12px; top: 12px; z-index: 60; transform: translateY(-200%); padding: 8px 14px;
      border-radius: var(--radius-sm); background: var(--graphite-1); border: 1px solid var(--line-strong); color: var(--ink);
      font-size: 14px; font-weight: 600; text-decoration: none; box-shadow: var(--shadow-lg);
    }
    .skip:focus { transform: none; outline: none; box-shadow: var(--focus-ring); }
    .table-wrap:focus-visible, .doc-content pre:focus-visible { outline: none; box-shadow: var(--focus-ring); }
    @media (prefers-reduced-motion: no-preference) {
      .doc-content.enter { animation: doc-rise 260ms cubic-bezier(.2, .8, .2, 1) both; }
    }
    @keyframes doc-rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    main {
      padding: var(--space-8) clamp(20px, 4vw, 56px) var(--space-16);
      max-width: 1020px;
      min-width: 0;
      line-height: 1.65;
    }
    .doc-meta-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: var(--space-2);
      border-bottom: 1px solid var(--line);
      padding-bottom: var(--space-3);
      margin-bottom: var(--space-6);
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--ink-muted);
    }
    .doc-content :is(h1, h2, h3, h4, h5, h6) { scroll-margin-top: 90px; }
    .doc-content h1 {
      font-family: var(--font-sans);
      font-size: clamp(28px, 3.5vw, 40px);
      line-height: 1.12;
      font-weight: 650;
      letter-spacing: -0.03em;
      margin-top: 0;
      color: var(--ink);
    }
    .doc-content h2 {
      font-family: var(--font-sans);
      font-size: 24px;
      line-height: 30px;
      font-weight: 600;
      letter-spacing: -0.02em;
      margin-top: var(--space-8);
      padding-bottom: var(--space-2);
      border-bottom: 1px solid var(--line);
      color: var(--ink);
    }
    .doc-content h3 {
      font-family: var(--font-sans);
      font-size: 18px;
      line-height: 24px;
      font-weight: 600;
      margin-top: var(--space-6);
      color: var(--cadmium-text);
    }
    .doc-content p, .doc-content li {
      font-size: 15px;
      line-height: 24px;
      color: var(--ink);
    }
    .doc-content pre {
      background: var(--graphite-2);
      border: 1px solid var(--line);
      padding: var(--space-3) var(--space-4);
      border-radius: var(--radius-md);
      overflow-x: auto;
      font-family: var(--font-mono);
      font-size: 13px;
      line-height: 20px;
      color: var(--ink);
    }
    .doc-content code {
      font-family: var(--font-mono);
      background: var(--graphite-2);
      padding: 2px 6px;
      border-radius: var(--radius-xs);
      font-size: 12px;
    }
    .doc-content pre code {
      background: transparent;
      padding: 0;
    }
    .table-wrap {
      width: 100%;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      margin: var(--space-4) 0;
    }
    .doc-content table {
      width: 100%;
      min-width: 560px;
      border-collapse: collapse;
      font-family: var(--font-mono);
      font-size: 12px;
      line-height: 18px;
    }
    .doc-content th, .doc-content td {
      border: 1px solid var(--line);
      padding: var(--space-2) var(--space-3);
      text-align: left;
    }
    .doc-content th {
      background: var(--graphite-2);
      color: var(--ink-muted);
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .doc-content hr {
      border: none;
      border-top: 1px solid var(--line);
      margin: var(--space-8) 0;
    }
    .doc-content a {
      color: var(--cadmium-text);
      text-decoration: none;
    }
    .doc-content a:hover {
      text-decoration: underline;
    }
    .doc-content h4 {
      font-family: var(--font-sans);
      font-size: 15px;
      line-height: 22px;
      font-weight: 600;
      margin: var(--space-5) 0 var(--space-2);
      color: var(--ink);
    }
    .doc-content blockquote {
      margin: var(--space-4) 0;
      padding: var(--space-2) var(--space-4);
      border-left: 3px solid var(--cadmium);
      background: var(--graphite-1);
      border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
    }
    .doc-content blockquote p { margin: var(--space-1) 0; color: var(--ink-muted); }
    .doc-content ul ul, .doc-content ol ul, .doc-content ul ol, .doc-content ol ol { margin: 2px 0; }
    .math { font-family: "Cambria Math", "STIX Two Math", "Latin Modern Math", "Times New Roman", serif; font-size: 1.06em; white-space: nowrap; }
    .math .up { font-style: normal; }
    .math sub, .math sup { font-size: 0.72em; line-height: 0; }
    .math .frac { display: inline-flex; flex-direction: column; vertical-align: middle; text-align: center; font-size: 0.92em; line-height: 1.15; margin: 0 2px; }
    .math .frac > span:first-child { border-bottom: 1px solid currentColor; padding: 0 2px; }
    .math .frac > span:last-child { padding: 0 2px; }
    .math .ov { border-top: 1px solid currentColor; }
    .math-block { margin: var(--space-4) 0; padding: var(--space-3) var(--space-4); overflow-x: auto; text-align: center; background: var(--graphite-1); border: 1px solid var(--line); border-radius: var(--radius-md); font-size: 17px; line-height: 30px; }
    .math-block .math { white-space: normal; }
    .diagram { margin: var(--space-4) 0; border: 1px solid var(--line); border-radius: var(--radius-md); background: var(--graphite-1); overflow: hidden; line-height: 1.4; }
    .diagram-head { display: flex; align-items: center; gap: var(--space-2); padding: 8px 14px; border-bottom: 1px solid var(--line); font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-muted); }
    .dg-groups { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; padding: 14px; }
    .dg-group { display: grid; gap: 8px; align-content: start; padding: 10px; border: 1px dashed var(--line-strong); border-radius: var(--radius-sm); }
    .dg-group > .t { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--cadmium-text); }
    .dg-node { padding: 8px 10px; background: var(--graphite-2); border: 1px solid var(--line); border-radius: 6px; font-size: 13px; line-height: 18px; color: var(--ink); }
    .dg-node b { display: block; font-weight: 600; }
    .dg-node span { display: block; color: var(--ink-muted); font-size: 12px; }
    .dg-chain { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 14px; }
    .dg-chain .dg-node { flex: 1 1 180px; max-width: 280px; }
    .dg-arrow { color: var(--cadmium-text); font-family: var(--font-mono); font-size: 14px; }
    .dg-edges { display: grid; gap: 6px; padding: 10px 14px 12px; border-top: 1px solid var(--line); font-size: 13px; }
    .dg-edge { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px; }
    .dg-edge.dotted .dg-arrow { color: var(--ink-muted); }
    .dg-edge em { font-style: normal; color: var(--ink-muted); font-size: 12px; }
    .dg-people { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
    .dg-person { padding: 4px 10px; border: 1px solid var(--line-strong); border-radius: var(--radius-full); font-size: 12.5px; }
    .dg-steps { margin: 0; padding: 10px 14px 12px 40px; display: grid; gap: 6px; font-size: 13.5px; }
    .dg-steps li { padding-left: 4px; }
    .dg-steps .who { font-family: var(--font-mono); font-size: 12px; color: var(--ink-muted); margin-right: 6px; }
    .dg-steps .reply .dg-arrow { color: var(--ink-muted); }
    .dg-steps .note { list-style: none; margin-left: -18px; color: var(--ink-muted); font-style: italic; }
    .dg-steps .section { list-style: none; margin-left: -18px; font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--cadmium-text); }
    details.dg-src summary { cursor: pointer; padding: 8px 14px; border-top: 1px solid var(--line); font-family: var(--font-mono); font-size: 11px; color: var(--ink-muted); }
    details.dg-src pre { margin: 0; border: 0; border-top: 1px solid var(--line); border-radius: 0; }
    @media (max-width: 900px) {
      .layout { grid-template-columns: 1fr; }
      aside { height: auto; max-height: 280px; position: static; border-right: 0; border-bottom: 1px solid var(--line); }
      main { padding: var(--space-6) clamp(16px, 4vw, 32px); }
    }
  </style>
</head>
<body>
  <a class="skip" href="#docMain" onclick="event.preventDefault(); document.getElementById('docMain').focus();">Skip to the document</a>
  <header>
    <img id="brandWordmark" src="/assets/Logos/kadmium-wordmark-dark.svg" alt="Kadmium" />
    <span class="cd">Cd‑48 · Docs</span>
    <span class="spacer"></span>
    <a class="kd-btn kd-btn-ghost kd-btn-sm" href="/site">Site</a>
    <a class="kd-btn kd-btn-sm" href="/">Control room</a>
    <a class="kd-btn kd-btn-ghost kd-btn-sm" href="/companion" title="The desktop app shows the Companion in its own window: run kadmium desktop">Companion (web)</a>
    <a class="kd-btn kd-btn-ghost kd-btn-sm" href="/design-system">Design system</a>
    <a class="kd-btn kd-btn-ghost kd-btn-sm" href="/api/v1/docs" target="_blank">JSON API</a>
    <button class="kd-btn kd-btn-ghost kd-btn-sm" id="themeBtn" onclick="toggleTheme()">Light theme</button>
  </header>

  <div class="layout">
    <aside>
      <input type="search" id="docSearch" class="search-input" placeholder="Filter documentation..." aria-label="Filter documentation" oninput="filterDocs()" />
      <nav id="sidebarList" aria-label="Documentation"></nav>
    </aside>
    <main id="docMain" tabindex="-1">
      <div class="doc-meta-bar">
        <span id="currentPath">docs/README.md</span>
        <span id="currentCat">1. Getting Started & Core Reference</span>
      </div>
      <div id="docBody" class="doc-content">Loading documentation...</div>
    </main>
  </div>

  <script>
    let allDocs = [];
    let activeSlug = "overview";
    let currentTheme = "dark";

    function toggleTheme() {
      currentTheme = currentTheme === "dark" ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", currentTheme);
      document.getElementById("brandWordmark").src = currentTheme === "dark"
        ? "/assets/Logos/kadmium-wordmark-dark.svg"
        : "/assets/Logos/kadmium-wordmark-light.svg";
      document.getElementById("themeBtn").textContent = currentTheme === "dark" ? "Light theme" : "Dark theme";
    }

    function escapeHtml(str) {
      return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    /* ---- TeX: the handful of commands the docs use, rendered as Unicode + HTML ---- */
    const TEX = {
      to: "→", rightarrow: "→", leftarrow: "←", leftrightarrow: "↔", Rightarrow: "⇒", Leftarrow: "⇐", mapsto: "↦",
      times: "×", approx: "≈", le: "≤", leq: "≤", ge: "≥", geq: "≥", neq: "≠", ne: "≠", ll: "≪", gg: "≫",
      dots: "…", ldots: "…", cdots: "⋯", cdot: "·", sum: "∑", prod: "∏", infty: "∞", pm: "±", mp: "∓",
      in: "∈", notin: "∉", subset: "⊂", subseteq: "⊆", cup: "∪", cap: "∩", forall: "∀", exists: "∃",
      nabla: "∇", partial: "∂", propto: "∝", sim: "∼", equiv: "≡", circ: "∘", star: "⋆", oplus: "⊕",
      otimes: "⊗", odot: "⊙", langle: "⟨", rangle: "⟩", lfloor: "⌊", rfloor: "⌋", lceil: "⌈", rceil: "⌉",
      mid: "∣", vert: "|", Vert: "‖", top: "⊤", quad: " ", qquad: "  ",
      alpha: "α", beta: "β", gamma: "γ", delta: "δ", epsilon: "ε", varepsilon: "ε", zeta: "ζ", eta: "η",
      theta: "θ", iota: "ι", kappa: "κ", lambda: "λ", mu: "μ", nu: "ν", xi: "ξ", pi: "π", rho: "ρ",
      sigma: "σ", tau: "τ", upsilon: "υ", phi: "φ", varphi: "φ", chi: "χ", psi: "ψ", omega: "ω",
      Gamma: "Γ", Delta: "Δ", Theta: "Θ", Lambda: "Λ", Xi: "Ξ", Pi: "Π", Sigma: "Σ", Phi: "Φ", Psi: "Ψ", Omega: "Ω",
      log: "log", ln: "ln", exp: "exp", max: "max", min: "min", arg: "arg", lim: "lim", sin: "sin", cos: "cos",
      left: "", right: "", big: "", Big: "", displaystyle: "", limits: ""
    };
    const TEX_PUNCT = { ",": " ", ";": " ", ":": " ", " ": " ", "!": "" };
    function tex(src) {
      let i = 0;
      const group = () => {
        while (src[i] === " ") i++;
        if (i >= src.length) return "";
        if (src[i] === "{") { i++; const out = seq("}"); i++; return out; }
        return atom();
      };
      const atom = () => {
        const c = src[i];
        if (c === "\\") {
          i++;
          let name = "";
          if (/[A-Za-z]/.test(src[i] || "")) { while (i < src.length && /[A-Za-z]/.test(src[i])) name += src[i++]; }
          else name = src[i++] || "";
          if (name === "frac") { const a = group(), b = group(); return '<span class="frac"><span>' + a + "</span><span>" + b + "</span></span>"; }
          if (["text", "mathrm", "operatorname", "textrm"].includes(name)) return '<span class="up">' + group() + "</span>";
          if (["mathbf", "textbf", "boldsymbol", "mathit", "mathcal", "mathbb", "mathsf", "mathtt"].includes(name)) return group();
          if (["hat", "bar", "tilde", "vec", "dot", "overline"].includes(name)) {
            const mark = { hat: "̂", bar: "̄", overline: "̄", tilde: "̃", vec: "⃗", dot: "̇" }[name];
            return group() + mark;
          }
          if (name === "sqrt") return '√<span class="ov">' + group() + "</span>";
          if (name in TEX_PUNCT) return TEX_PUNCT[name];
          if (name in TEX) return escapeHtml(TEX[name]);
          return escapeHtml(name);
        }
        i++;
        if (c === "^") return "<sup>" + group() + "</sup>";
        if (c === "_") return "<sub>" + group() + "</sub>";
        if (c === "{") { i--; return group(); }
        if (c === "*") return "&#42;";
        return escapeHtml(c);
      };
      const seq = stop => { let out = ""; while (i < src.length && src[i] !== stop) out += atom(); return out; };
      return '<span class="math">' + seq(undefined) + "</span>";
    }
    /* Prices such as "$0.90–$1.20" stay text; "$k$", "$q^*$" and "$800\times$" become math. */
    function looksLikeMath(body) {
      if (/^\s|\s$/.test(body)) return false;
      if (/\\[A-Za-z,;:!]|[\^_{}]/.test(body)) return true;
      if (/^\d+(\.\d+)?$/.test(body)) return body.length <= 6;
      return /^[A-Za-z][A-Za-z0-9 +\-=*/.,()']*$/.test(body) && body.length <= 16;
    }

    /* ---- Mermaid: flowcharts and sequence diagrams drawn as cards, no external library ---- */
    function nodeHtml(label) {
      const lines = String(label).split(/\\n|<br\s*\/?>/i).map(l => l.trim()).filter(Boolean);
      return '<div class="dg-node"><b>' + escapeHtml(lines[0] || "") + "</b>" + lines.slice(1).map(l => "<span>" + escapeHtml(l) + "</span>").join("") + "</div>";
    }
    const firstLine = label => String(label).split(/\\n|<br\s*\/?>/i)[0].trim();
    function splitTop(text, sep) {
      const out = []; let depth = 0, quote = false, cur = "";
      for (const ch of text) {
        if (ch === '"') quote = !quote;
        if (!quote && "[({".includes(ch)) depth++;
        if (!quote && "])}".includes(ch)) depth--;
        if (!quote && depth === 0 && ch === sep) { out.push(cur); cur = ""; continue; }
        cur += ch;
      }
      out.push(cur);
      return out.map(x => x.trim()).filter(Boolean);
    }
    function renderFlow(lines, head) {
      const nodes = new Map(), groups = [], stack = [], edges = [];
      const nodeRe = /^([A-Za-z_][\w.-]*)\s*(\[\[|\[\(|\(\[|\(\(|\[\/|\[\\|\[|\(|\{\{|\{|>)\s*"?([\s\S]*?)"?\s*(\]\]|\)\]|\]\)|\)\)|\/\]|\\\]|\]|\)|\}\}|\})$/;
      const define = token => {
        const m = token.match(nodeRe);
        const id = m ? m[1] : token.split(/\s+/)[0];
        let n = nodes.get(id);
        if (!n) { n = { id, label: id, group: stack[stack.length - 1] || null }; nodes.set(id, n); if (n.group) n.group.nodes.push(n); }
        if (m && m[3]) n.label = m[3];
        return id;
      };
      const ARROW = /\s*(?:(-\.|--|==)\s*"([^"]*)"\s*(\.->|-->|==>|---)|(<-->|-\.->|-->|==>|---|-\.-|--o|--x))\s*(?:\|([^|]*)\|)?\s*/g;
      for (const raw of lines) {
        const line = raw.replace(/%%.*$/, "").trim();
        if (!line) continue;
        let m = line.match(/^subgraph\s+([^\s\["]+)\s*(?:\[\s*"?(.*?)"?\s*\])?\s*$/) || line.match(/^subgraph\s+(.+)$/);
        if (m) { const g = { id: m[1].trim(), title: (m[2] || m[1]).replace(/^"|"$/g, ""), nodes: [] }; groups.push(g); stack.push(g); continue; }
        if (line === "end") { stack.pop(); continue; }
        if (/^(style|classDef|class|linkStyle|click|direction)\b/.test(line)) continue;
        const parts = [], arrows = [];
        let last = 0, a;
        ARROW.lastIndex = 0;
        while ((a = ARROW.exec(line))) {
          parts.push(line.slice(last, a.index));
          arrows.push({ label: a[2] || a[5] || "", dotted: /\./.test(a[1] || a[3] || a[4] || "") });
          last = a.index + a[0].length;
        }
        parts.push(line.slice(last));
        const sides = parts.map(p => splitTop(p, "&").map(define));
        for (let k = 0; k < arrows.length; k++) {
          for (const from of sides[k] || []) for (const to of sides[k + 1] || []) edges.push({ from, to, label: arrows[k].label, dotted: arrows[k].dotted });
        }
      }
      const groupIds = new Map(groups.map(g => [g.id, g]));
      groupIds.forEach((g, id) => nodes.delete(id));
      const name = id => groupIds.has(id) ? groupIds.get(id).title : firstLine((nodes.get(id) || { label: id }).label);
      const loose = [...nodes.values()].filter(n => !n.group);
      let body = "";
      const order = [...nodes.keys()];
      const chain = !groups.length && edges.length === order.length - 1 && edges.every((e, k) => e.from === order[k] && e.to === order[k + 1]);
      if (chain) {
        body = '<div class="dg-chain">' + order.map((id, k) => (k ? '<span class="dg-arrow">→</span>' : "") + nodeHtml(nodes.get(id).label)).join("") + "</div>";
      } else {
        body = '<div class="dg-groups">' + groups.filter(g => g.nodes.length).map(g => '<div class="dg-group"><div class="t">' + escapeHtml(g.title) + "</div>" + g.nodes.map(n => nodeHtml(n.label)).join("") + "</div>").join("")
          + (loose.length ? '<div class="dg-group">' + loose.map(n => nodeHtml(n.label)).join("") + "</div>" : "") + "</div>";
        if (edges.length) body += '<div class="dg-edges">' + edges.map(e => '<div class="dg-edge' + (e.dotted ? " dotted" : "") + '"><b>' + escapeHtml(name(e.from)) + '</b><span class="dg-arrow">' + (e.dotted ? "⇢" : "→") + "</span><b>" + escapeHtml(name(e.to)) + "</b>" + (e.label ? "<em>" + escapeHtml(e.label) + "</em>" : "") + "</div>").join("") + "</div>";
      }
      return { kind: "flowchart " + (head.split(/\s+/)[1] || ""), body };
    }
    function renderSequence(lines) {
      const people = new Map(), steps = [];
      const add = (id, label) => { id = id.trim(); if (!people.has(id)) people.set(id, label ? label.trim() : id); else if (label) people.set(id, label.trim()); return id; };
      for (const raw of lines) {
        const line = raw.replace(/%%.*$/, "").trim();
        let m;
        if (!line) continue;
        if ((m = line.match(/^(participant|actor)\s+(\S+)(?:\s+as\s+(.+))?$/))) { add(m[2], m[3]); continue; }
        if ((m = line.match(/^note\s+(?:over|left of|right of)\s+([^:]+):\s*(.*)$/i))) { steps.push({ kind: "note", text: m[2] }); continue; }
        if ((m = line.match(/^(loop|alt|else|opt|par|and|critical|break)\b\s*(.*)$/))) { steps.push({ kind: "section", text: (m[1] + " " + m[2]).trim() }); continue; }
        if (/^(end|rect|activate|deactivate|autonumber)\b/.test(line)) continue;
        if ((m = line.match(/^(.+?)\s*(-->>|->>|-->|->|--x|-x|--\)|-\))\s*[+-]?\s*(.+?)\s*:\s*(.*)$/))) {
          steps.push({ kind: "msg", from: add(m[1]), to: add(m[3]), reply: m[2].indexOf("--") === 0, text: m[4] });
        }
      }
      const label = id => people.get(id) || id;
      const body = '<div class="dg-people">' + [...people.keys()].map(id => '<span class="dg-person">' + escapeHtml(label(id)) + "</span>").join("") + "</div>"
        + '<ol class="dg-steps">' + steps.map(st => st.kind === "note" ? '<li class="note">' + escapeHtml(st.text) + "</li>"
          : st.kind === "section" ? '<li class="section">' + escapeHtml(st.text) + "</li>"
          : '<li class="' + (st.reply ? "reply" : "") + '"><span class="who">' + escapeHtml(label(st.from)) + ' <span class="dg-arrow">' + (st.from === st.to ? "↻" : st.reply ? "⇢" : "→") + "</span> " + escapeHtml(st.from === st.to ? "" : label(st.to)) + "</span>" + escapeHtml(st.text) + "</li>").join("") + "</ol>";
      return { kind: "sequence", body };
    }
    function renderMermaid(code) {
      const lines = code.split("\n");
      const head = (lines[0] || "").trim();
      let out = null;
      try {
        if (/^sequenceDiagram\b/.test(head)) out = renderSequence(lines.slice(1));
        else if (/^(flowchart|graph)\b/.test(head)) out = renderFlow(lines.slice(1), head);
      } catch (e) { out = null; }
      const src = '<details class="dg-src"><summary>Mermaid source</summary><pre><code>' + escapeHtml(code.trim()) + "</code></pre></details>";
      if (!out) return "<pre><code class=\"lang-mermaid\">" + escapeHtml(code.trim()) + "</code></pre>";
      return '<figure class="diagram"><div class="diagram-head">diagram · ' + escapeHtml(out.kind) + "</div>" + out.body + src + "</figure>";
    }

    function renderMarkdown(md) {
      const blocks = [];
      const headingIds = new Set();
      const heading = (level, text) => {
        const content = formatInline(text);
        const template = document.createElement("template");
        template.innerHTML = content;
        const base = template.content.textContent.toLowerCase()
          .replace(/[^\p{L}\p{M}\p{N}\p{Pc} -]/gu, "").replace(/ /g, "-");
        let id = base;
        for (let suffix = 1; headingIds.has(id); suffix++) id = `${base}-${suffix}`;
        headingIds.add(id);
        return `<h${level} id="${escapeHtml(id)}">${content}</h${level}>`;
      };
      md = md.replace(/```([\w-]*)[^\n]*\n([\s\S]*?)```/g, (_, lang, code) => {
        const idx = blocks.length;
        blocks.push(lang === "mermaid" ? renderMermaid(code) : `<pre><code class="lang-${lang}">${escapeHtml(code.replace(/\s+$/, ""))}</code></pre>`);
        return `\n@@CODEBLOCK_${idx}@@\n`;
      });

      const lines = md.split("\n");
      let html = "";
      let inTable = false;
      const lists = [];
      let quote = [];
      /* Each open list remembers whether its last <li> is still open, so a nested list lands inside that item. */
      const closeList = () => { const l = lists.pop(); html += (l.open ? "</li>" : "") + "</" + l.type + ">"; };
      const closeLists = () => { while (lists.length) closeList(); };
      const closeQuote = () => { if (quote.length) { html += "<blockquote>" + quote.map(q => "<p>" + formatInline(q) + "</p>").join("") + "</blockquote>"; quote = []; } };

      for (let i = 0; i < lines.length; i++) {
        const line = lines[i];
        const trimmed = line.trim();

        if (trimmed.startsWith("|") && trimmed.endsWith("|") && trimmed.length > 1) {
          closeLists(); closeQuote();
          if (/^\|[\s:|-]+\|$/.test(trimmed)) continue;
          const cells = trimmed.slice(1, -1).split("|").map(c => formatInline(c.trim()));
          if (!inTable) {
            html += '<div class="table-wrap"><table><thead><tr>' + cells.map(c => `<th>${c}</th>`).join("") + "</tr></thead><tbody>";
            inTable = true;
          } else {
            html += "<tr>" + cells.map(c => `<td>${c}</td>`).join("") + "</tr>";
          }
          continue;
        } else if (inTable) {
          html += "</tbody></table></div>";
          inTable = false;
        }

        const item = line.match(/^(\s*)([-*+]|\d+\.)\s+(.*)$/);
        if (item) {
          closeQuote();
          const indent = item[1].replace(/\t/g, "    ").length;
          const type = /\d/.test(item[2]) ? "ol" : "ul";
          while (lists.length && indent < lists[lists.length - 1].indent) closeList();
          const top = lists[lists.length - 1];
          if (top && indent === top.indent && type !== top.type) closeList();
          if (!lists.length || indent > lists[lists.length - 1].indent) {
            lists.push({ indent, type, open: false });
            html += type === "ol" ? `<ol start="${parseInt(item[2], 10)}">` : "<ul>";
          } else if (lists[lists.length - 1].open) {
            html += "</li>";
          }
          html += "<li>" + formatInline(item[3]);
          lists[lists.length - 1].open = true;
          continue;
        }

        if (trimmed.startsWith(">")) { closeLists(); quote.push(trimmed.replace(/^>\s?/, "")); continue; }
        closeQuote();
        if (!trimmed) { continue; }
        closeLists();

        const display = trimmed.match(/^\$\$([\s\S]+)\$\$$/);
        const title = line.match(/^(#{1,6})\s+(.+?)(?:\s+#+)?\s*$/);
        if (display) html += '<div class="math-block">' + tex(display[1].trim()) + "</div>";
        else if (title) html += heading(title[1].length, title[2]);
        else if (trimmed === "---" || trimmed === "***") html += "<hr />";
        else if (trimmed.startsWith("@@CODEBLOCK_")) html += trimmed;
        else html += `<p>${formatInline(line)}</p>`;
      }
      if (inTable) html += "</tbody></table></div>";
      closeLists(); closeQuote();

      blocks.forEach((b, idx) => {
        html = html.replace(`@@CODEBLOCK_${idx}@@`, () => b);
      });
      return html;
    }

    const DOC_LINKS = {
      "docs/README.md": "overview",
      "docs/getting-started.md": "getting-started",
      "docs/guides/cli.md": "launch-guide",
      "docs/cli-reference.md": "cli-reference",
      "docs/api-reference.md": "api-reference",
      "docs/SPECSHEET_AND_ROADMAP.md": "specsheet-and-roadmap",
      "docs/ARCHITECTURE.md": "architecture",
      "docs/BENCHMARKS_2026-10.md": "benchmarks",
      "docs/guides/hardware-and-sharding.md": "hardware-and-sharding",
      "docs/guides/condenser-workspace.md": "condenser-workspace",
      "docs/guides/local-checkpoints.md": "local-checkpoints",
      "docs/guides/distributed-compute.md": "distributed-compute",
      "docs/guides/training-and-dream-rsi.md": "training-and-dream-rsi",
      "docs/guides/subclusters-and-cloud-shield.md": "subclusters-and-cloud-shield",
      "docs/guides/integrations-hf-github.md": "integrations-hf-github",
      "docs/guides/mcp-server.md": "mcp-server",
      "docs/guides/usbc-delta-bridge.md": "usbc-delta-bridge",
      "crates/kadmium-npu/README.md": "npu-kernels",
      "docs/guides/release.md": "release-runbook",
      "docs/MARKET_RESEARCH_AND_LAUNCH_PLAN.md": "market-research-and-launch-plan",
      "CONTRIBUTING.md": "contributing"
    };
    function normalizeRepoPath(path) {
      const parts = [];
      for (const part of path.split("/")) {
        if (!part || part === ".") continue;
        if (part === "..") {
          if (!parts.length) return null;
          parts.pop();
        } else {
          parts.push(part);
        }
      }
      return parts.join("/");
    }
    function resolveRepoHref(raw) {
      const hashAt = raw.indexOf("#");
      const path = hashAt >= 0 ? raw.slice(0, hashAt) : raw;
      const anchor = hashAt >= 0 ? raw.slice(hashAt) : "";
      const doc = allDocs.find(d => d.slug === activeSlug);
      const base = doc ? doc.file_path.split("/").slice(0, -1).join("/") : "docs";
      const normalized = normalizeRepoPath(`${base}/${path}`);
      return { normalized, anchor };
    }
    function formatInline(text) {
      const held = [];
      const hold = html => "\u0000" + (held.push(html) - 1) + "\u0000";
      let out = String(text)
        .replace(/`([^`]+)`/g, (_, code) => hold("<code>" + escapeHtml(code) + "</code>"))
        .replace(/\$([^$\n]+?)\$/g, (m, body) => looksLikeMath(body) ? hold(tex(body)) : m);
      out = escapeHtml(out)
        .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
        .replace(/(^|[^\w*])\*([^*\s][^*]*)\*(?![\w*])/g, "$1<em>$2</em>")
        .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (m, label, href) => {
          const raw = href.replace(/&amp;/g, "&");
          if (raw.startsWith("#")) return `<a href="#${activeSlug}/${href.slice(1)}">${label}</a>`;
          if (/^(https?:|mailto:|\/)/i.test(raw)) return `<a href="${href}" target="_blank" rel="noopener">${label}</a>`;
          const { normalized, anchor } = resolveRepoHref(raw);
          if (normalized && DOC_LINKS[normalized]) {
            const slug = DOC_LINKS[normalized];
            return `<a href="#${slug}${anchor ? '/' + anchor.slice(1) : ''}">${label}</a>`;
          }
          if (normalized) return `<a href="https://github.com/mESmaC/Kadmium/blob/main/${normalized}${anchor}" target="_blank" rel="noopener">${label}</a>`;
          return label;
        });
      return out.replace(/\u0000(\d+)\u0000/g, (_, n) => held[Number(n)]);
    }

    function renderSidebar(filterText = "") {
      const q = filterText.toLowerCase();
      const container = document.getElementById("sidebarList");
      const categories = [...new Set(allDocs.map(d => d.category))];
      let html = "";

      for (const cat of categories) {
        const items = allDocs.filter(d => d.category === cat && (
          d.title.toLowerCase().includes(q) ||
          d.summary.toLowerCase().includes(q) ||
          d.markdown.toLowerCase().includes(q)
        ));
        if (items.length === 0) continue;
        html += `<div class="cat-header">${cat}</div>`;
        for (const doc of items) {
          const active = doc.slug === activeSlug ? "active" : "";
          html += `<button class="doc-item ${active}" ${active ? 'aria-current="page"' : ""} onclick="selectDoc('${doc.slug}')">
            ${doc.title}
            <small>${doc.file_path}</small>
          </button>`;
        }
      }
      container.innerHTML = html;
    }

    function selectDoc(slug, anchor = "", updateHash = true) {
      const doc = allDocs.find(d => d.slug === slug) || allDocs[0];
      if (!doc) return;
      activeSlug = doc.slug;
      const hash = `#${activeSlug}${anchor ? '/' + encodeURIComponent(anchor) : ''}`;
      if (updateHash && location.hash !== hash) {
        location.hash = hash;
        return;
      }
      document.getElementById("currentPath").textContent = doc.file_path;
      document.getElementById("currentCat").textContent = doc.category;
      const body = document.getElementById("docBody");
      body.innerHTML = renderMarkdown(doc.markdown);
      body.classList.remove("enter"); void body.offsetWidth; body.classList.add("enter");
      document.title = doc.title + " · Kadmium docs";
      body.querySelectorAll(".table-wrap, pre").forEach(el => {
        if (el.scrollWidth > el.clientWidth + 1) { el.setAttribute("tabindex", "0"); el.setAttribute("role", "region"); el.setAttribute("aria-label", "Wide content (scrolls sideways)"); }
      });
      renderSidebar(document.getElementById("docSearch").value);
      const calm = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      const target = anchor && document.getElementById(anchor);
      if (target && body.contains(target)) {
        target.setAttribute("tabindex", "-1");
        target.focus({ preventScroll: true });
        target.scrollIntoView({ behavior: calm ? "auto" : "smooth" });
      } else {
        window.scrollTo({ top: 0, behavior: calm ? "auto" : "smooth" });
      }
    }

    function selectDocFromHash() {
      const [slug, ...fragment] = location.hash.slice(1).split("/");
      let anchor = fragment.join("/");
      try { anchor = decodeURIComponent(anchor); } catch (_) { /* Keep malformed fragments inert. */ }
      selectDoc(slug || "overview", anchor, false);
    }

    window.addEventListener("hashchange", selectDocFromHash);

    function filterDocs() {
      renderSidebar(document.getElementById("docSearch").value);
    }

    async function initDocs() {
      const res = await fetch("/api/v1/docs");
      allDocs = await res.json();
      selectDocFromHash();
    }

    initDocs();
  </script>
</body>
</html>
