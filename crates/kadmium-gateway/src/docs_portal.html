<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kadmium — Documentation</title>
  <link rel="icon" href="/assets/Logos/kadmium-favicon.svg" />
  <link rel="stylesheet" href="/tokens.css" />
  <link rel="stylesheet" href="/components/bundle.css" />
  <style>
    html, body { margin: 0; }
    body {
      background: var(--graphite-0);
      color: var(--ink);
      font-family: var(--font-sans);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    header {
      height: 56px;
      border-bottom: 1px solid var(--line);
      background: var(--graphite-1);
      display: flex;
      align-items: center;
      gap: var(--space-3);
      padding: 0 var(--space-6);
      position: sticky;
      top: 0;
      z-index: 20;
    }
    header img { height: 24px; display: block; }
    header .cd {
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 0.08em;
      color: var(--ink-muted);
      text-transform: uppercase;
    }
    header .spacer { flex: 1; }
    .layout {
      display: grid;
      grid-template-columns: 290px 1fr;
      flex: 1;
      max-width: 1380px;
      width: 100%;
      margin: 0 auto;
    }
    aside {
      border-right: 1px solid var(--line);
      padding: var(--space-5) var(--space-4);
      background: var(--graphite-1);
      height: calc(100vh - 56px);
      position: sticky;
      top: 56px;
      overflow-y: auto;
    }
    .search-input {
      width: 100%;
      height: var(--control-md);
      padding: 0 var(--space-3);
      border-radius: var(--radius-sm);
      border: 1px solid var(--line-strong);
      background: var(--graphite-0);
      color: var(--ink);
      font-family: var(--font-sans);
      font-size: 14px;
      margin-bottom: var(--space-4);
      outline: none;
    }
    .search-input:focus {
      border-color: var(--cadmium-text);
      box-shadow: var(--focus-ring);
    }
    .cat-header {
      font-family: var(--font-mono);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--ink-muted);
      margin: var(--space-4) var(--space-2) var(--space-2);
      font-weight: 500;
    }
    .doc-item {
      display: block;
      width: 100%;
      text-align: left;
      background: transparent;
      border: 0;
      border-left: 3px solid transparent;
      color: var(--ink-muted);
      padding: var(--space-2) var(--space-3);
      border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
      font-family: var(--font-sans);
      font-size: 14px;
      cursor: pointer;
      margin-bottom: 2px;
      transition: background-color 0.12s ease, color 0.12s ease;
    }
    .doc-item:hover {
      background: var(--graphite-2);
      color: var(--ink);
    }
    .doc-item.active {
      background: var(--cadmium-soft);
      border-left-color: var(--cadmium);
      color: var(--ink);
      font-weight: 600;
    }
    .doc-item small {
      display: block;
      color: var(--ink-muted);
      font-family: var(--font-mono);
      font-size: 11px;
      margin-top: 2px;
    }
    main {
      padding: var(--space-8) var(--space-10) var(--space-16);
      max-width: 920px;
      line-height: 1.6;
    }
    .doc-meta-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--line);
      padding-bottom: var(--space-3);
      margin-bottom: var(--space-6);
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--ink-muted);
    }
    .doc-content h1 {
      font-family: var(--font-sans);
      font-size: 40px;
      line-height: 44px;
      font-weight: 650;
      letter-spacing: -0.03em;
      margin-top: 0;
      color: var(--ink);
    }
    .doc-content h2 {
      font-family: var(--font-sans);
      font-size: 24px;
      line-height: 30px;
      font-weight: 600;
      letter-spacing: -0.02em;
      margin-top: var(--space-8);
      padding-bottom: var(--space-2);
      border-bottom: 1px solid var(--line);
      color: var(--ink);
    }
    .doc-content h3 {
      font-family: var(--font-sans);
      font-size: 18px;
      line-height: 24px;
      font-weight: 600;
      margin-top: var(--space-6);
      color: var(--cadmium-text);
    }
    .doc-content p, .doc-content li {
      font-size: 15px;
      line-height: 24px;
      color: var(--ink);
    }
    .doc-content pre {
      background: var(--graphite-2);
      border: 1px solid var(--line);
      padding: var(--space-3) var(--space-4);
      border-radius: var(--radius-md);
      overflow-x: auto;
      font-family: var(--font-mono);
      font-size: 13px;
      line-height: 20px;
      color: var(--ink);
    }
    .doc-content code {
      font-family: var(--font-mono);
      background: var(--graphite-2);
      padding: 2px 6px;
      border-radius: var(--radius-xs);
      font-size: 12px;
    }
    .doc-content pre code {
      background: transparent;
      padding: 0;
    }
    .doc-content table {
      width: 100%;
      border-collapse: collapse;
      margin: var(--space-4) 0;
      font-family: var(--font-mono);
      font-size: 12px;
      line-height: 18px;
    }
    .doc-content th, .doc-content td {
      border: 1px solid var(--line);
      padding: var(--space-2) var(--space-3);
      text-align: left;
    }
    .doc-content th {
      background: var(--graphite-2);
      color: var(--ink-muted);
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .doc-content hr {
      border: none;
      border-top: 1px solid var(--line);
      margin: var(--space-8) 0;
    }
    .doc-content a {
      color: var(--cadmium-text);
      text-decoration: none;
    }
    .doc-content a:hover {
      text-decoration: underline;
    }
    @media (max-width: 860px) {
      .layout { grid-template-columns: 1fr; }
      aside { height: auto; position: static; border-right: 0; border-bottom: 1px solid var(--line); }
      main { padding: var(--space-6); }
    }
  </style>
</head>
<body>
  <header>
    <img id="brandWordmark" src="/assets/Logos/kadmium-wordmark-dark.svg" alt="Kadmium" />
    <span class="cd">Cd‑48 · Docs</span>
    <span class="spacer"></span>
    <a class="kd-btn kd-btn-sm" href="/">Control room</a>
    <a class="kd-btn kd-btn-ghost kd-btn-sm" href="/design-system">Design system</a>
    <a class="kd-btn kd-btn-ghost kd-btn-sm" href="/api/v1/docs" target="_blank">JSON API</a>
    <button class="kd-btn kd-btn-ghost kd-btn-sm" id="themeBtn" onclick="toggleTheme()">Light theme</button>
  </header>

  <div class="layout">
    <aside>
      <input type="text" id="docSearch" class="search-input" placeholder="Filter documentation..." oninput="filterDocs()" />
      <div id="sidebarList"></div>
    </aside>
    <main>
      <div class="doc-meta-bar">
        <span id="currentPath">docs/README.md</span>
        <span id="currentCat">1. Getting Started & Core Reference</span>
      </div>
      <div id="docBody" class="doc-content">Loading documentation...</div>
    </main>
  </div>

  <script>
    let allDocs = [];
    let activeSlug = "overview";
    let currentTheme = "dark";

    function toggleTheme() {
      currentTheme = currentTheme === "dark" ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", currentTheme);
      document.getElementById("brandWordmark").src = currentTheme === "dark"
        ? "/assets/Logos/kadmium-wordmark-dark.svg"
        : "/assets/Logos/kadmium-wordmark-light.svg";
      document.getElementById("themeBtn").textContent = currentTheme === "dark" ? "Light theme" : "Dark theme";
    }

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    function renderMarkdown(md) {
      let blocks = [];
      md = md.replace(/```([\w-]*)\n([\s\S]*?)```/g, (_, lang, code) => {
        const idx = blocks.length;
        blocks.push(`<pre><code class="lang-${lang}">${escapeHtml(code.trim())}</code></pre>`);
        return `@@CODEBLOCK_${idx}@@`;
      });

      const lines = md.split("\n");
      let html = "";
      let inTable = false;
      let inList = false;

      for (let i = 0; i < lines.length; i++) {
        let line = lines[i];

        if (line.trim().startsWith("|") && line.trim().endsWith("|")) {
          if (line.includes("---")) continue;
          const cells = line.trim().slice(1, -1).split("|").map(c => formatInline(c.trim()));
          if (!inTable) {
            html += "<table><thead><tr>" + cells.map(c => `<th>${c}</th>`).join("") + "</tr></thead><tbody>";
            inTable = true;
          } else {
            html += "<tr>" + cells.map(c => `<td>${c}</td>`).join("") + "</tr>";
          }
          continue;
        } else if (inTable) {
          html += "</tbody></table>";
          inTable = false;
        }

        if (/^(\s*[-*]|\s*\d+\.)\s+/.test(line)) {
          if (!inList) { html += "<ul>"; inList = true; }
          html += "<li>" + formatInline(line.replace(/^(\s*[-*]|\s*\d+\.)\s+/, "")) + "</li>";
          continue;
        } else if (inList) {
          html += "</ul>";
          inList = false;
        }

        if (line.startsWith("### ")) html += `<h3>${formatInline(line.slice(4))}</h3>`;
        else if (line.startsWith("## ")) html += `<h2>${formatInline(line.slice(3))}</h2>`;
        else if (line.startsWith("# ")) html += `<h1>${formatInline(line.slice(2))}</h1>`;
        else if (line.trim() === "---") html += "<hr />";
        else if (line.trim().startsWith("@@CODEBLOCK_")) html += line.trim();
        else if (line.trim().length > 0) html += `<p>${formatInline(line)}</p>`;
      }
      if (inTable) html += "</tbody></table>";
      if (inList) html += "</ul>";

      blocks.forEach((b, idx) => {
        html = html.replace(`@@CODEBLOCK_${idx}@@`, b);
      });
      return html;
    }

    function formatInline(text) {
      return text
        .replace(/`([^`]+)`/g, "<code>$1</code>")
        .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
        .replace(/\*([^*]+)\*/g, "<em>$1</em>")
        .replace(/\[([^\]]+)\]\(([^)]+)\)/g, (m, label, href) => {
          const slugMap = {
            "./getting-started.md": "getting-started",
            "./cli-reference.md": "cli-reference",
            "./api-reference.md": "api-reference",
            "./ARCHITECTURE.md": "architecture",
            "./guides/hardware-and-sharding.md": "hardware-and-sharding",
            "./guides/training-and-dream-rsi.md": "training-and-dream-rsi",
            "./guides/subclusters-and-cloud-shield.md": "subclusters-and-cloud-shield",
            "./guides/integrations-hf-github.md": "integrations-hf-github",
            "./guides/mcp-server.md": "mcp-server"
          };
          if (slugMap[href]) {
            return `<a href="#" onclick="selectDoc('${slugMap[href]}'); return false;">${label}</a>`;
          }
          return `<a href="${href}" target="_blank">${label}</a>`;
        });
    }

    function renderSidebar(filterText = "") {
      const q = filterText.toLowerCase();
      const container = document.getElementById("sidebarList");
      const categories = [...new Set(allDocs.map(d => d.category))];
      let html = "";

      for (const cat of categories) {
        const items = allDocs.filter(d => d.category === cat && (
          d.title.toLowerCase().includes(q) ||
          d.summary.toLowerCase().includes(q) ||
          d.markdown.toLowerCase().includes(q)
        ));
        if (items.length === 0) continue;
        html += `<div class="cat-header">${cat}</div>`;
        for (const doc of items) {
          const active = doc.slug === activeSlug ? "active" : "";
          html += `<button class="doc-item ${active}" onclick="selectDoc('${doc.slug}')">
            ${doc.title}
            <small>${doc.file_path}</small>
          </button>`;
        }
      }
      container.innerHTML = html;
    }

    function selectDoc(slug) {
      activeSlug = slug;
      const doc = allDocs.find(d => d.slug === slug) || allDocs[0];
      if (!doc) return;
      document.getElementById("currentPath").textContent = doc.file_path;
      document.getElementById("currentCat").textContent = doc.category;
      document.getElementById("docBody").innerHTML = renderMarkdown(doc.markdown);
      renderSidebar(document.getElementById("docSearch").value);
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function filterDocs() {
      renderSidebar(document.getElementById("docSearch").value);
    }

    async function initDocs() {
      const res = await fetch("/api/v1/docs");
      allDocs = await res.json();
      selectDoc("overview");
    }

    initDocs();
  </script>
</body>
</html>
