[package]
name = "kadmium-condenser"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Condenser: the modular Kadmium Power Plant inference harness"
# GUI-free library (plus the test echo plugin). The `kadmium-condenser` command and its
# native window live in `kadmium-condenser-app`, so embedding this links no webview.

[dependencies]
kadmium-core.workspace = true
kadmium-data.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util = { version = "0.7", features = ["rt", "io"] }
axum.workspace = true
async-trait = "0.1"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
jsonschema = "0.29"
