[package]
name = "kadmium-condenser"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Condenser: the modular Kadmium Power Plant inference harness"
default-run = "kadmium-condenser"

[features]
default = ["native-window"]
# Native Condenser window on Windows and macOS. The Kadmium gateway embeds Condenser
# with default features off, so headless coordinators link no webview stack.
native-window = ["dep:wry", "dep:tao"]
# Linux uses the browser shell by default. Enable the same native window used on
# Windows and macOS when WebKitGTK 4.1 and GTK 3 development files are available.
linux-native = ["dep:linux-wry", "dep:linux-tao"]

[dependencies]
kadmium-core.workspace = true
kadmium-data.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util = { version = "0.7", features = ["rt", "io"] }
axum.workspace = true
clap.workspace = true
async-trait = "0.1"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
jsonschema = "0.29"

[target.'cfg(not(target_os = "linux"))'.dependencies]
wry = { version = "0.57", optional = true }
tao = { version = "0.37", optional = true }

# Renamed so `native-window` (on by default) never pulls WebKitGTK into Linux builds.
[target.'cfg(target_os = "linux")'.dependencies]
linux-wry = { package = "wry", version = "0.57", optional = true }
linux-tao = { package = "tao", version = "0.37", optional = true }
