[package]
name = "kadmium-condenser-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Condenser command line and native window. The kadmium-condenser library stays GUI-free so the Kadmium gateway can embed it."

[[bin]]
name = "kadmium-condenser"
path = "src/main.rs"

[features]
default = []
# Linux uses the browser shell by default. Enable the same native window used on
# Windows and macOS when WebKitGTK 4.1 and GTK 3 development files are available.
linux-native = ["dep:wry", "dep:tao"]

[dependencies]
kadmium-condenser.workspace = true
kadmium-core.workspace = true
kadmium-data.workspace = true
serde_json.workspace = true
tokio.workspace = true
clap.workspace = true
reqwest = { version = "0.12", default-features = false }

[target.'cfg(not(target_os = "linux"))'.dependencies]
wry = "0.57"
tao = "0.37"

[target.'cfg(target_os = "linux")'.dependencies]
wry = { version = "0.57", optional = true }
tao = { version = "0.37", optional = true }
