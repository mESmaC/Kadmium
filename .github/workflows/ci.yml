name: Kadmium CI (Rust Workspace, Numerical Kernels & Cross-OS Matrix)

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"

jobs:
  business-model:
    name: Verify business planning calculations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check accounting and cohort invariants
        run: python scripts/test_business_model.py
      - name: Check generated economics match assumptions
        run: python scripts/business_model.py --check

  workspace-ui:
    name: Workspace browser workflows
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: crates/kadmium-gateway/tests/ui
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: crates/kadmium-gateway/tests/ui/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: workspace-ui-traces
          path: crates/kadmium-gateway/tests/ui/test-results

  check-and-test:
    name: Test & Lint (${{ matrix.os }})
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Linux native WebView development libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"
          components: rustfmt, clippy

      - name: Cache Cargo registry and target build
        uses: Swatinem/rust-cache@v2

      - name: Check formatting (rustfmt)
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all -- --check

      - name: Run Clippy lints across all workspace crates
        run: cargo clippy --workspace --all-targets --locked

      - name: Run Clippy lints for Linux native WebView feature path
        if: runner.os == 'Linux'
        run: cargo clippy -p kadmium-desktop -p kadmium-condenser --features linux-native --all-targets --locked

      - name: Run workspace unit, integration & doc tests
        run: cargo test --workspace --locked

      - name: Install Node for UI regression tests
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Test Control Room keyboard navigation and request recovery
        if: matrix.os == 'ubuntu-latest'
        run: |
          npm install --prefix target/ui-test --no-package-lock --no-audit --no-fund playwright@1.64.1
          node target/ui-test/node_modules/playwright/cli.js install --with-deps chromium
          cargo build -p kadmium-gateway --example control_room_fixture
          node --test crates/kadmium-gateway/tests/control_room.test.cjs
      - name: Test Condenser stream and task workflows
        run: node --test crates/kadmium-condenser/tests/workflow.test.cjs

      - name: Smoke-test Kadmium CLI & Condenser engines
        run: |
          cargo run --locked --bin kadmium -- probe
          cargo run --locked --bin kadmium -- simulate
          cargo run --locked --bin kadmium -- dream
          cargo run --locked --bin kadmium -- slice --pool-size 100 --slices 5
          cargo run --locked --bin kadmium -- dataflow --model deepseek-v3-671b-moe --batch-tokens 512
          cargo run --locked --bin kadmium -- cloud-shield
          cargo run --locked --bin kadmium-condenser -- dsv41-profile --json

      - name: Test Windows release installer with offline fixtures
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test_installers.ps1 -Executable target/debug/kadmium.exe

      - name: Test Unix release installer with offline fixtures
        if: runner.os != 'Windows'
        run: sh scripts/test_install.sh
