name: Kadmium CI (Rust Workspace, Numerical Kernels & Cross-OS Matrix)

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"

jobs:
  check-and-test:
    name: Test & Lint (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo registry and target build
        uses: Swatinem/rust-cache@v2

      - name: Check formatting (rustfmt)
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all -- --check

      - name: Run Clippy lints across all workspace crates
        run: cargo clippy --workspace --all-targets

      - name: Run workspace unit & async integration tests
        run: cargo test --workspace

      - name: Install Node for embedded UI protocol tests
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Test Condenser stream and task workflows
        run: node --test crates/kadmium-condenser/tests/workflow.test.cjs

      - name: Smoke-test Kadmium CLI engines (probe, simulate, dream, slice, dataflow, cloud-shield)
        run: |
          cargo run --bin kadmium -- probe
          cargo run --bin kadmium -- simulate
          cargo run --bin kadmium -- dream
          cargo run --bin kadmium -- slice --pool-size 100 --slices 5
          cargo run --bin kadmium -- dataflow --model deepseek-v3-671b-moe --batch-tokens 512
          cargo run --bin kadmium -- cloud-shield
