name: Kadmium Multi-Arch Release (CLI, NAS Container & Desktop Companion)

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-cli-matrix:
    name: Build Single-Binary CLI (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows Desktop & Gaming Laptops
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: kadmium-windows-x86_64.exe
          # Apple Silicon M1-M4 Mac Mini / MacBook
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: kadmium-macos-arm64
          # Linux Workstations, Legacy Laptops, NAS & Cloud Burst GPUs
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: kadmium-linux-x86_64
          # Linux ARM64 Single-Board Computers (Raspberry Pi 5, RK3588, Jetson)
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact_name: kadmium-linux-arm64-sbc

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain for target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo build
        uses: Swatinem/rust-cache@v2

      - name: Build optimized release binary
        run: cargo build --release --bin kadmium --target ${{ matrix.target }}

      - name: Upload release binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            target/${{ matrix.target }}/release/kadmium*
          if-no-files-found: error
