<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kadmium — component demo</title>
<link rel="icon" href="assets/Logos/kadmium-favicon.svg">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="components/bundle.css">
<style>
  /* page chrome for the demo only — everything below uses the system's tokens and classes */
  html, body { margin: 0; }
  body { background: var(--graphite-0); color: var(--ink); font-family: var(--font-sans); }
  .top { display: flex; align-items: center; gap: var(--space-4); height: 56px; padding: 0 var(--space-6); border-bottom: 1px solid var(--line); background: var(--graphite-1); }
  .top img { height: 24px; display: block; }
  .top .cd { font-family: var(--font-mono); font-size: 11px; letter-spacing: .08em; color: var(--ink-muted); text-transform: uppercase; }
  .top .spacer { flex: 1; }
  .page { max-width: 1120px; margin: 0 auto; padding: var(--space-8) var(--space-6) var(--space-16); display: grid; gap: var(--space-8); }
  .hero { display: grid; grid-template-columns: 1.1fr 1fr; gap: var(--space-8); align-items: end; }
  .hero h1 { margin: 0 0 var(--space-4); }
  .hero p { margin: 0 0 var(--space-6); color: var(--ink-muted); max-width: 52ch; }
  section > h2 { margin: 0 0 var(--space-4); }
  .eyebrow { font-family: var(--font-mono); font-size: 11px; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-muted); margin: 0 0 var(--space-2); }
  .panel { background: var(--graphite-1); border: 1px solid var(--line); border-radius: var(--radius-lg); padding: var(--space-5); box-shadow: var(--shadow-sm); }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-4); }
  .plans { display: flex; gap: var(--space-4); flex-wrap: wrap; }
  @media (max-width: 820px) { .hero, .two { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div id="app"></div>

<script src="components/lib/react.production.min.js"></script>
<script src="components/lib/react-dom.production.min.js"></script>
<script src="components/bundle.js"></script>
<script>
(function () {
  var K = window.Kadmium, h = React.createElement;

  function Demo() {
    var theme = React.useState('dark'), tab = React.useState('nodes');
    React.useEffect(function () { document.documentElement.setAttribute('data-theme', theme[0]); }, [theme[0]]);
    var wordmark = theme[0] === 'dark' ? 'assets/Logos/kadmium-wordmark-dark.svg' : 'assets/Logos/kadmium-wordmark-light.svg';

    return h(React.Fragment, null,
      h('header', { className: 'top' },
        h('img', { src: wordmark, alt: 'Kadmium' }),
        h('span', { className: 'cd' }, 'Cd‑48'),
        h('span', { className: 'spacer' }),
        h(K.Badge, { tone: 'ok', dot: true }, 'cluster healthy'),
        h(K.Button, { variant: 'ghost', size: 'sm', onClick: function () { theme[1](theme[0] === 'dark' ? 'light' : 'dark'); } }, theme[0] === 'dark' ? 'Light theme' : 'Dark theme'),
        h(K.Button, { variant: 'primary', size: 'sm', icon: 'rods' }, 'Start node')),

      h('main', { className: 'page' },
        h('div', { className: 'hero' },
          h('div', null,
            h('h1', { className: 'display' }, 'Every machine you own, as one reactor.'),
            h('p', { className: 'body-lg' }, 'Kadmium profiles each node’s FLOPs, memory tiers and link speed, computes an asymmetric shard plan, and rebalances live when a laptop unplugs or a rented GPU joins.'),
            h('div', { className: 'kd-row' }, h(K.Button, { variant: 'primary', size: 'lg' }, 'Install'), h(K.Button, { size: 'lg' }, 'Read the docs'), h(K.Button, { variant: 'cloud', size: 'lg', icon: 'cloud' }, 'Attach burst GPU'))),
          h(K.CodeBlock, { title: 'terminal', language: 'shell', code: '$ cargo run --bin kadmium -- simulate\n$ kadmium plan --workload inference\n$ kadmium serve --port 7848   # dashboard + /v1 gateway' })),

        h('section', null,
          h(K.Tabs, { label: 'Cluster', value: tab[0], onChange: tab[1], items: [
            { id: 'nodes', label: 'Nodes', count: 8 }, { id: 'shards', label: 'Shard plan' }, { id: 'transfers', label: 'Transfers', count: 3 }, { id: 'jobs', label: 'Jobs' }, { id: 'gateway', label: 'Gateway' }] }),
          h('div', { style: { height: 'var(--space-5)' } }),
          tab[0] === 'shards'
            ? h('div', { className: 'panel' }, h('p', { className: 'eyebrow' }, 'Shard plan · deepseek-v3-671b-moe · inference'),
                h(K.ShardRail, { label: 'Shard plan', depth: 120, nodes: [
                  { name: 'mac', share: 0.34 }, { name: 'pc', share: 0.22 }, { name: 'lap-1', share: 0.12 }, { name: 'lap-2', share: 0.09 },
                  { name: 'old', share: 0.05 }, { name: 'pi', share: 0.02 }, { name: 'nas', share: 0 }, { name: 'a100', share: 0.16, placement: 'cloud' }] }))
            : h('div', { className: 'kd-grid' },
                h(K.NodeCard, { name: 'M4 Mac Mini', hardware: 'm4 · 64 gb unified · metal', kind: 'compact', status: 'resident', shards: 'layers 12–31',
                  meters: [{ label: 'UMA', value: 46, max: 64, unit: 'GB' }, { label: 'NVMe', value: 1.8, max: 2, unit: 'TB' }] }),
                h(K.NodeCard, { name: 'Main desktop', hardware: 'rtx 5070 · 12 gb · nvme 7 gb/s', kind: 'desktop', status: 'yielded', shards: 'layers 0–11 → handoff',
                  meters: [{ label: 'VRAM', value: 0.6, max: 12, unit: 'GB' }, { label: 'RAM', value: 21, max: 64, unit: 'GB' }] }),
                h(K.NodeCard, { name: 'Gaming laptop (Ava)', hardware: 'rtx 4060 · 8 gb · wifi 6', kind: 'laptop', status: 'training', shards: 'layers 32–43',
                  meters: [{ label: 'VRAM', value: 7.7, max: 8, unit: 'GB', criticalAt: 0.95 }] }),
                h(K.NodeCard, { name: 'Raspberry Pi 5', hardware: 'arm64 · 8 gb · tokenizer + drafts', kind: 'sbc', status: 'resident', shards: 'utility',
                  meters: [{ label: 'RAM', value: 2.1, max: 8, unit: 'GB' }] }),
                h(K.NodeCard, { name: 'Home NAS', hardware: '12 tb · ktb vault · 2.5 gbe', kind: 'nas', status: 'resident', shards: 'cold experts',
                  meters: [{ label: 'NVMe', value: 9.4, max: 12, unit: 'TB' }] }),
                h(K.NodeCard, { name: 'RunPod A100', hardware: 'a100 80 gb · 3h lease · us-east', kind: 'gpu', placement: 'cloud', status: 'prefetching', shards: 'layers 0–11',
                  meters: [{ label: 'VRAM', value: 30, max: 80, unit: 'GB' }, { label: 'link', value: 410, max: 1000, unit: 'Mbps' }] }))),

        h('section', { className: 'two' },
          h('div', { className: 'panel' }, h('p', { className: 'eyebrow' }, 'Add a node'),
            h('div', { className: 'kd-stack' },
              h(K.Input, { label: 'Coordinator', mono: true, prefix: 'quic://', defaultValue: '10.0.0.14:7848', hint: 'Reachable from every node on the LAN.' }),
              h(K.Input, { label: 'Node name', placeholder: 'e.g. Gaming laptop (Ava)' }),
              h(K.Input, { label: 'Spot budget', mono: true, prefix: '$', defaultValue: '12', error: 'Must be at least $1 per hour.' }),
              h('div', { className: 'kd-row' }, h(K.Button, { variant: 'primary' }, 'Join cluster'), h(K.Button, { variant: 'ghost' }, 'Cancel')))),
          h(K.CodeBlock, { title: 'crates/kadmium-sharding/src/lib.rs', language: 'rust', code: 'pub fn plan(nodes: &[Node], model: &Topology) -> ShardPlan {\n    // slice blocks in proportion to each node\'s compute-to-memory envelope\n    let total: f64 = nodes.iter().map(|n| n.envelope()).sum();\n    ShardPlan::new(nodes.iter().map(|n| (n.id, n.envelope() / total)))\n}' })),

        h('section', null, h('h2', { className: 'headline' }, 'Run it yourself, or let us run the hard part.'),
          h('div', { className: 'plans' },
            h(K.PlanCard, { product: 'self-hosted', name: 'Kadmium', price: '$0', period: 'forever', summary: 'The whole fabric, on hardware you already own.',
              features: ['One Rust binary, every OS', 'Asymmetric sharding and live rebalancing', 'DiLoCo + DeMo training over home internet', 'OpenAI- and Anthropic-compatible gateway', 'MIT / Apache-2.0'], cta: 'Install' }),
            h(K.PlanCard, { product: 'cloud', name: 'Kadmium Cloud', price: '$0.89', period: '/ GPU-hour, from', summary: 'A managed control plane, multi-provider spot arbitrage, and a failover shield for your local lab.',
              features: ['Burst GPUs attached to your cluster in minutes', 'Pre-warmed .ktb vault for zero-downtime failover', 'Spot eviction handled for you', 'Usage billing, no minimum'], cta: 'Start a cluster' })))));
  }
  ReactDOM.createRoot(document.getElementById('app')).render(h(Demo));
})();
</script>
</body>
</html>
