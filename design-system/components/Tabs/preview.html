<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Tabs — preview</title></head>
<body class="kd-preview">
<div id="root" style="max-width:720px"></div>
<script>
  var K = window.Kadmium, h = React.createElement;

  function Demo() {
    var s = React.useState('nodes');
    return h(K.Tabs, { label: 'Cluster', value: s[0], onChange: s[1], items: [
      { id: 'nodes', label: 'Nodes', count: 8 }, { id: 'shards', label: 'Shard plan' }, { id: 'transfers', label: 'Transfers', count: 3 }, { id: 'jobs', label: 'Jobs' }, { id: 'gateway', label: 'Gateway' } ] });
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body>
</html>
